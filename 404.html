<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUREL | Access Restricted</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#06182b;color:#fff}
body{display:grid;place-items:center;min-height:100vh;background:
radial-gradient(circle at 70% 20%,rgba(0,153,255,.12),transparent 34%),
linear-gradient(180deg,#06182b,#03101e)}
.card{width:min(92vw,620px);padding:44px 34px;border:1px solid rgba(130,205,255,.18);border-radius:22px;
background:rgba(6,28,50,.86);box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center}
.brand{font-size:30px;font-weight:900;letter-spacing:.18em}
.sub{margin-top:8px;color:#9fc7df;font-size:12px;letter-spacing:.16em}
.rule{width:72px;height:2px;margin:24px auto;background:linear-gradient(90deg,#13b7ff,#e6bb55)}
h1{margin:0 0 12px;font-size:28px}
p{margin:0;color:#b8cedc;line-height:1.7}
.code{margin-top:22px;font-size:12px;color:#6f9ab5;letter-spacing:.12em}
</style>
</head>
<body>
<main class="card">
<div class="brand">AUREL</div>
<div class="sub">FINANCIAL INTELLIGENCE</div>
<div class="rule"></div>
<h1>Đường dẫn này không còn công khai</h1>
<p>Trang AUREL tại địa chỉ này đã được khóa. Vui lòng sử dụng đường dẫn truy cập chính thức hiện hành.</p>
<div class="code">ACCESS RESTRICTED</div>
</main>
</body>
</html>
