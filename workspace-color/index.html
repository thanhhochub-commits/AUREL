/* Scenario-only presentation; no rules for other application pages. */
.scenario-layout{align-items:start}
.scenario-settings,.scenario-results{min-height:390px}
.scenario-results .table-wrap table{min-width:0}.scenario-results .table-wrap th,.scenario-results .table-wrap td{padding:11px 10px}
.scenario-intro{color:#6c8192;font-size:12px;line-height:1.7;margin:8px 0 19px}
.scenario-fields{display:grid;gap:16px}
.scenario-control{border:1px solid #dfebe8;border-radius:15px;background:linear-gradient(145deg,#fbfefd 0%,#f5faf9 100%);padding:18px 19px 16px;transition:border-color .18s}
.scenario-control:focus-within{border-color:#9bcfc3}
.scenario-control-head{display:flex;align-items:start;justify-content:space-between;gap:12px}
.scenario-label{display:block;color:#203a4d;font-size:13px;font-weight:790;line-height:1.5}
.scenario-description{font-size:11px;color:#8598a4;margin:4px 0 0;line-height:1.6}
.scenario-preview{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-width:78px;padding:7px 10px;border-radius:9px;color:#087e78;background:#e0f4ee;border:1px solid #cdebe2;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.scenario-track-wrap{position:relative;display:flex;align-items:center;margin:22px 4px 8px;height:20px}
.scenario-slider{position:relative;z-index:2;appearance:none;-webkit-appearance:none;width:100%;height:7px;border-radius:999px;outline:none;background:linear-gradient(to right,#0b8980 0%,#0b8980 var(--slider-fill),#dce9e7 var(--slider-fill),#dce9e7 100%);cursor:pointer;touch-action:pan-y}
.scenario-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;height:21px;width:21px;border:4px solid #fff;border-radius:50%;background:#087e78;box-shadow:0 1px 8px rgba(10,79,76,.28),0 0 0 1px #a9cdc5;cursor:grab}
.scenario-slider::-moz-range-thumb{height:13px;width:13px;border:4px solid #fff;border-radius:50%;background:#087e78;box-shadow:0 1px 8px rgba(10,79,76,.28);cursor:grab}
.scenario-slider:active::-webkit-slider-thumb{cursor:grabbing}
.scenario-slider:focus-visible{outline:2px solid #0b8980;outline-offset:6px}
.scenario-neutral{position:absolute;z-index:1;top:0;bottom:0;border-left:1px dashed #93a9a4;pointer-events:none}
.scenario-scale{position:relative;height:16px;color:#8496a3;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}.scenario-scale>span{position:absolute;top:0;white-space:nowrap}.scenario-scale>span:first-child{left:0}.scenario-scale>span:nth-child(2){transform:translateX(-50%)}.scenario-scale>span:last-child{right:0}
.scenario-manual-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:19px;padding-top:14px;border-top:1px solid #e4eeeb}
.scenario-manual-row>label{font-size:11.5px;color:#597488;font-weight:650}
.scenario-number{display:flex;align-items:center;border:1px solid #cfdfdf;border-radius:10px;background:#fff;overflow:hidden;min-width:108px;box-shadow:0 1px 3px rgba(16,55,60,.03)}
.scenario-number:focus-within{border-color:#3f9e90;box-shadow:0 0 0 3px rgba(14,129,117,.1)}
.scenario-number input{width:80px;min-width:0;border:0;padding:9px 9px 9px 10px;color:#143246;font-size:15px;line-height:1.2;font-weight:750;font-variant-numeric:tabular-nums;text-align:right;background:transparent;outline:none}
.scenario-number span{font-size:12px;color:#728c98;font-weight:750;margin:0 12px 0 2px}
.scenario-number:has(input[aria-invalid=true]){border-color:#c77c68}
.scenario-error{font-size:11px;line-height:1.45;color:#ab5542;min-height:0;margin:0}
.scenario-error:not(:empty){margin-top:8px}
.scenario-run{width:100%;justify-content:center;margin-top:18px;min-height:45px;font-size:12px}
.scenario-footnote{line-height:1.7;text-align:center;margin:11px 0 0}
@media(max-width:510px){.scenario-control{padding:15px}.scenario-control-head{gap:8px}.scenario-preview{min-width:68px;font-size:13px}.scenario-manual-row{flex-wrap:wrap}.scenario-number{margin-left:auto}}

.compare-toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-bottom:16px}
.compare-toolbar .field{min-width:240px;max-width:340px}
.compare-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}
.compare-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.compare-kpi{background:#f7fafc;border:1px solid #e4edf2;border-radius:14px;padding:14px 16px}
.compare-kpi small{display:block;color:#7e8fa1;font-size:12px;margin-bottom:6px}.compare-kpi strong{display:block;font-size:24px;color:#17324d;line-height:1.2}.compare-kpi .sub{display:block;margin-top:5px;color:#6c7c8d;font-size:12px}

/* ==========================================================================
   AUREL WORKSPACE — BASIC UI MATCHED TO APPROVED LOGO
   IMPORTANT: logo markup/image is intentionally untouched.
   ========================================================================== */
:root{
  --a-navy:#17384a;
  --a-navy-2:#244d63;
  --a-blue:#bfd9e9;
  --a-blue-2:#e8f2f7;
  --a-blue-3:#f3f8fb;
  --a-bg:#eef4f7;
  --a-card:#ffffff;
  --a-line:#d5e2e9;
  --a-text:#17384a;
  --a-muted:#738896;
}

/* Page foundation */
html,body{
  background:var(--a-bg)!important;
  color:var(--a-text)!important;
}
body{
  font-size:13px!important;
  line-height:1.5!important;
}
.main{
  background:var(--a-bg)!important;
}
.page{
  max-width:1460px!important;
  padding:26px 30px 52px!important;
}

/* Sidebar: brand-safe. No logo selector is touched. */
.sidebar{
  background:var(--a-navy)!important;
  border-right:0!important;
  box-shadow:none!important;
  padding:24px 14px 18px!important;
}
.menu-title{
  color:#8fb2c5!important;
  font-size:9px!important;
  letter-spacing:1.6px!important;
  margin:16px 12px 8px!important;
}
.nav{
  gap:4px!important;
}
.nav button{
  color:#dce8ee!important;
  background:transparent!important;
  border:0!important;
  border-radius:8px!important;
  padding:10px 12px!important;
  font-size:12px!important;
  font-weight:600!important;
  box-shadow:none!important;
}
.nav button:hover{
  background:var(--a-navy-2)!important;
  color:#fff!important;
}
.nav button.active{
  background:var(--a-blue)!important;
  color:var(--a-navy)!important;
  box-shadow:none!important;
  font-weight:800!important;
}
.nav button.active svg{
  color:var(--a-navy)!important;
}
.sidebar-bottom{
  border-top:1px solid rgba(255,255,255,.12)!important;
}
.sidebar-bottom p{
  color:#a9c2cf!important;
}

/* Top bar becomes a clear light-blue product bar */
.topbar{
  min-height:68px!important;
  height:68px!important;
  padding:0 30px!important;
  background:#fff!important;
  border-bottom:4px solid var(--a-blue)!important;
  box-shadow:none!important;
}
.crumb-icon{
  background:var(--a-blue-2)!important;
  color:var(--a-navy)!important;
  border-radius:8px!important;
}
.crumb strong{
  color:var(--a-navy)!important;
  font-weight:800!important;
}
.crumb small{
  color:#8296a2!important;
}
.controls select{
  height:38px!important;
  background:#fff!important;
  color:var(--a-navy)!important;
  border:1px solid var(--a-line)!important;
  border-radius:7px!important;
  box-shadow:none!important;
}
.controls .status-pill{
  color:var(--a-navy)!important;
  background:var(--a-blue-2)!important;
  border:1px solid #cadfe9!important;
  border-radius:999px!important;
}

/* Page header: strong and simple */
.page-head{
  background:#fff!important;
  border:1px solid var(--a-line)!important;
  border-left:6px solid var(--a-blue)!important;
  border-radius:10px!important;
  padding:20px 22px!important;
  margin:0 0 16px!important;
  box-shadow:none!important;
}
.eyebrow{
  color:#6f9eb8!important;
  font-size:9px!important;
  letter-spacing:1.7px!important;
}
.page-head h1{
  color:var(--a-navy)!important;
  font-size:24px!important;
  margin:5px 0 5px!important;
  letter-spacing:-.4px!important;
}
.page-head p{
  color:var(--a-muted)!important;
  font-size:12px!important;
  max-width:760px!important;
}

/* Buttons */
.button{
  background:#fff!important;
  color:var(--a-navy)!important;
  border:1px solid var(--a-line)!important;
  border-radius:7px!important;
  min-height:38px!important;
  padding:9px 13px!important;
  box-shadow:none!important;
  transform:none!important;
  font-size:11.5px!important;
}
.button:hover:not(:disabled){
  background:var(--a-blue-3)!important;
  border-color:#afcbd9!important;
  box-shadow:none!important;
  transform:none!important;
}
.button.primary{
  background:var(--a-navy)!important;
  border-color:var(--a-navy)!important;
  color:#fff!important;
}
.button.primary:hover:not(:disabled){
  background:var(--a-navy-2)!important;
}
.button.teal,.button.subtle{
  background:var(--a-blue-2)!important;
  border-color:#c9dfe9!important;
  color:var(--a-navy)!important;
}

/* Panels: absolutely flat and basic */
.panel,
.metric,
.analysis-feature,
.compare-kpi,
.monitor-card,
.scenario-control,
.dataset-card,
.pdf-intro-card,
.pdf-intro-main,
.ai-key-panel,
.compare-settings,
.compare-pair-visual,
.compare-all-panel,
.report-mail-card,
.report-mail-security,
.monitor-process-step{
  background:#fff!important;
  background-image:none!important;
  border:1px solid var(--a-line)!important;
  border-radius:9px!important;
  box-shadow:none!important;
}
.panel:before,
.analysis-feature:before,
.monitor-card:before,
.ai-key-panel:before{
  display:none!important;
}
.panel{
  padding:18px!important;
}
.section-top{
  margin-bottom:14px!important;
  padding-bottom:11px!important;
  border-bottom:1px solid #e5edf1!important;
}
.section-top h2{
  color:var(--a-navy)!important;
  font-size:13.5px!important;
  font-weight:800!important;
}
.section-top small{
  color:#8497a2!important;
  font-size:10px!important;
}

/* KPI cards get obvious logo palette */
.metrics{
  gap:10px!important;
  margin:14px 0 16px!important;
}
.metric{
  min-height:112px!important;
  border-top:5px solid var(--a-blue)!important;
  padding:16px!important;
}
.metric:nth-child(even){
  border-top-color:var(--a-navy)!important;
}
.metric-title{
  color:#708694!important;
  font-size:10.5px!important;
}
.metric strong{
  color:var(--a-navy)!important;
  font-size:22px!important;
}
.metric-foot{
  color:#8b9da7!important;
}

/* Hero sections: solid navy only */
.hero,
.bank-monitor-hero,
.compare-insight{
  background:var(--a-navy)!important;
  background-image:none!important;
  color:#fff!important;
  border-radius:9px!important;
  box-shadow:none!important;
}
.hero:after{
  display:none!important;
}
.hero .eyebrow,
.bank-monitor-hero .eyebrow{
  color:var(--a-blue)!important;
}
.hero p{
  color:#dbe7ed!important;
}

/* Tables: clearer color hierarchy */
.table-wrap{
  border:1px solid var(--a-line)!important;
  border-radius:8px!important;
  background:#fff!important;
}
thead{
  background:var(--a-navy)!important;
}
th{
  color:#fff!important;
  padding:11px 13px!important;
  font-size:9.5px!important;
  letter-spacing:.5px!important;
}
td{
  color:#365261!important;
  padding:11px 13px!important;
  border-top:1px solid #e8eef2!important;
  font-size:11.5px!important;
}
tbody tr:nth-child(even){
  background:#f8fbfc!important;
}
tbody tr:hover{
  background:var(--a-blue-3)!important;
}

/* Fields */
.field input,
.field select,
.field textarea{
  background:#fff!important;
  color:var(--a-navy)!important;
  border:1px solid var(--a-line)!important;
  border-radius:7px!important;
  box-shadow:none!important;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#92b9cd!important;
  box-shadow:0 0 0 3px rgba(191,217,233,.38)!important;
}
.field input[type=range],
.checkbox input{
  accent-color:var(--a-navy)!important;
}

/* Upload */
.drop{
  background:var(--a-blue-3)!important;
  border:2px dashed #a8c6d5!important;
  border-radius:9px!important;
  box-shadow:none!important;
}
.drop:hover{
  background:var(--a-blue-2)!important;
  border-color:#78a8bf!important;
}
.drop svg{
  color:#6f9eb8!important;
}

/* Neutral information chips */
.note{
  background:var(--a-blue-3)!important;
  border:1px solid #d6e6ee!important;
  color:#526f7e!important;
  border-radius:7px!important;
}
.tag,
.status-chip,
.subtle-badge,
.file-chip{
  background:var(--a-blue-2)!important;
  border:1px solid #d2e3eb!important;
  color:#315b71!important;

.note.warn,.tag.warn,.status-chip.warn{
  background:#fff8ed!important;

  background:#fff0ed!important;
  color:#aa5848!important;

.analysis-feature:nth-child(2){
  border-left-color:var(--a-navy)!important;
}
.analysis-feature:nth-child(3){
  border-left-color:#80abc1!important;
}
.analysis-feature-value{
  color:var(--a-navy)!important;
}
.analysis-chart-wrap{
  background:#fff!important;
  border:1px solid var(--a-line)!important;
  border-radius:8px!important;
}
.analysis-chart .analysis-grid{
  stroke:#e1e9ed!important;
}
.analysis-chart .analysis-line,
.chart .line{
  stroke:var(--a-navy)!important;
}
.analysis-chart .analysis-dot,
.chart .dot{
  fill:#6fa9c7!important;
}
.chart .bar{
  fill:var(--a-navy)!important;
}
.chart .bar-alt{
  fill:var(--a-blue)!important;
}

/* Comparison */
.compare-track{
  background:#e6edf1!important;
}
.compare-track .bar-vcb{
  background:var(--a-blue)!important;
}
.compare-track .bar-bidv{
  background:var(--a-navy)!important;
}
.compare-viz-row:nth-child(even){

.compare-viz-row:hover{
  background:var(--a-blue-2)!important;

.compare-viz-bar.first,

  background:var(--a-blue)!important;
}
.compare-viz-bar.second,

}
.scenario-slider{
  background:linear-gradient(to right,#6fa9c7 0%,#6fa9c7 var(--slider-fill),#dce7ed var(--slider-fill),#dce7ed 100%)!important;
}
.scenario-slider::-webkit-slider-thumb{
  background:var(--a-navy)!important;
}
.scenario-slider::-moz-range-thumb{
  background:var(--a-navy)!important;
}

  background:#fff!important;
  border:1px solid var(--a-line)!important;
  color:#607986!important;
  border-radius:7px!important;
}
.progress{
  background:#e5edf1!important;
}
.progress i{
  background:#6fa9c7!important;
}

}
.modal{
  background:rgba(23,56,74,.48)!important;
}
.modal-box{
  box-shadow:none!important;
  border-radius:10px!important;
}

    padding:16px 12px 30px!important;
  }
  .metrics,.metrics.three{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .cols,.cols-equal,.upload-grid,.data-lists,.report-delivery,.pdf-intro{
    grid-template-columns:1fr!important;
  }
}
@media(max-width:540px){
  .page{
    padding:12px 9px 24px!important;
  }
  .metrics,.metrics.three,.dataset-cards,.compare-summary{
    grid-template-columns:1fr!important;
  }
  .pdf-intro-grid{
    grid-template-columns:1fr!important;
  }
  .page-head{
    padding:16px!important;
  }
  .panel{
    padding:14px!important;
  }
  table{
    min-width:560px!important;
  }
}


/* ===== AUREL WORKSPACE · COLOR ONLY ===== */
:root{
  --aurel-accent:#0F766E;
  --aurel-accent-soft:#EAF6F3;
  --aurel-accent-line:#CBE6E1;
}

/* Brand text accents only; logo image/shape/layout remains untouched */
.brand-desc{
  color:#BFD9E9!important;
}
.brand-title{
  color:#FFFFFF!important;
}

/* Navigation */
.nav button.active{
  background:#BFD9E9!important;
  color:#17384A!important;
  box-shadow:inset 3px 0 var(--aurel-accent)!important;
}
.nav button:hover{
  background:#244D63!important;
}

/* Top bar + page accents */
.crumb-icon,
.eyebrow,
.positive,
.source button,
.monitor-process-step em{
  color:var(--aurel-accent)!important;
}
.controls .status-pill{
  color:var(--aurel-accent)!important;
  background:var(--aurel-accent-soft)!important;
  border-color:var(--aurel-accent-line)!important;
}

/* Buttons */
.button.teal{
  background:var(--aurel-accent)!important;
  color:#fff!important;
  border-color:var(--aurel-accent)!important;
}
.button.teal:hover:not(:disabled){
  background:#0C665F!important;
  border-color:#0C665F!important;
}
.button.subtle{
  background:var(--aurel-accent-soft)!important;
  color:var(--aurel-accent)!important;
  border-color:var(--aurel-accent-line)!important;
}

/* Status / tags / notes */
.tag.good,
.status-chip:not(.neutral):not(.warn),
.file-chip{
  background:var(--aurel-accent-soft)!important;
  color:var(--aurel-accent)!important;
  border-color:var(--aurel-accent-line)!important;
}
.note:not(.warn){
  background:var(--aurel-accent-soft)!important;
  color:#466E69!important;
  border-color:var(--aurel-accent-line)!important;
}

/* Form focus */
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--aurel-accent)!important;
  box-shadow:0 0 0 3px rgba(15,118,110,.10)!important;
}
.checkbox input,
.field input[type=range]{
  accent-color:var(--aurel-accent)!important;
}
.drop:hover{
  border-color:var(--aurel-accent)!important;
  background:#F5FBF9!important;
}

/* Charts and comparison accents */
.analysis-chart .analysis-line,
.chart .line{
  stroke:var(--aurel-accent)!important;
}
.analysis-chart .analysis-dot,
.chart .dot{
  fill:var(--aurel-accent)!important;
}
.compare-viz-bar.first,
.compare-viz-dot.first,
.compare-legend .dot.vcb,
.compare-track .bar-vcb{
  background:var(--aurel-accent)!important;
}

/* Scenario */
.scenario-preview{
  color:var(--aurel-accent)!important;
  background:var(--aurel-accent-soft)!important;
  border-color:var(--aurel-accent-line)!important;
}
.scenario-slider{
  background:linear-gradient(
    to right,
    var(--aurel-accent) 0%,
    var(--aurel-accent) var(--slider-fill),
    #dce7ed var(--slider-fill),
    #dce7ed 100%
  )!important;
}
.scenario-slider::-webkit-slider-thumb{
  background:var(--aurel-accent)!important;
}
.scenario-slider::-moz-range-thumb{
  background:var(--aurel-accent)!important;
}
.progress i{
  background:var(--aurel-accent)!important;
}

function normalizeApiBase(value){
  value=String(value||'').trim();
  if(!value)return '';
  try{
    const u=new URL(value);
    if(!/^https?:$/.test(u.protocol))return '';
    u.pathname=u.pathname.replace(/\/+$/,'')+'/';
    u.search='';u.hash='';
    return u.toString();
  }catch(_){return ''}
}
function resolveApiBase(){
  const query=new URLSearchParams(location.search).get('api');

    if(normalized){localStorage.setItem('aurel_api_base',normalized);return normalized}
  }
  const saved=normalizeApiBase(localStorage.getItem('aurel_api_base')||'');
  if(saved)return saved;
  if(!location.hostname.endsWith('.github.io'))return location.origin+'/';
  return GITHUB_DEFAULT_API;
}

async function fetchWithTimeout(url,options={},timeout=65000){

  if(!values.length)return emptySmall('Chưa có số liệu cho chỉ tiêu được chọn.');
  let lo=Math.min(0,...values),hi=Math.max(0,...values);
  if(hi===lo){lo=-1;hi=1;}

  const pct=v=>Math.max(0,Math.min(100,100*(v-lo)/(hi-lo)));

  }).join('');
  const howMany=rows.length>12?' many':'';
  return `<div class="compare-plot"><div class="compare-plot-heading"><strong>${escapeHTML(opt.label)}</strong><small>Đơn vị: ${escapeHTML(opt.unit)} · ${rows.length} ngân hàng</small></div><div class="compare-viz-list${howMany}" role="list" aria-label="So sánh ${escapeHTML(opt.label)}">${rowMarkup}</div><div class="compare-viz-axis"><span>${escapeHTML(formatCompareValue(lo,opt))}</span>${zero>5&&zero<95?`<span class="compare-axis-zero" style="left:${zero}%">Mốc 0</span>`:''}<span>${escapeHTML(formatCompareValue(hi,opt))}</span></div></div>`;

function syncScenarioControl(kind,source){
  const range=$('#'+kind+'-slider'),number=$('#'+kind+'-input'),preview=$('#'+kind+'-preview'),error=$('#'+kind+'-error');
  if(!range||!number||!preview||!error)return;
  if(source==='slider') number.value=range.value;
  const raw=number.value.trim(),v=Number(raw),min=Number(number.min),max=Number(number.max);
  const valid=raw!==''&&Number.isFinite(v)&&v>=min&&v<=max&&Number.isInteger(v);
  if(!valid){
    number.setAttribute('aria-invalid','true');preview.textContent='Cần điều chỉnh';
    error.textContent='Nhập số nguyên từ '+min+'% đến +'+max+'%.';
  }else{
    number.removeAttribute('aria-invalid');error.textContent='';
    range.value=String(v);range.style.setProperty('--slider-fill',100*(v-min)/(max-min)+'%');
    preview.textContent=(v>0?'+':'')+v+'%';
  }
  const run=$('#run-scenario');if(run)run.disabled=['npl','loan'].some(k=>{
    const n=$('#'+k+'-input');if(!n)return true;const x=Number(n.value);
    return n.value.trim()===''||!Number.isFinite(x)||x<Number(n.min)||x>Number(n.max)||!Number.isInteger(x);
  });
}

async function analyzePdf(name){return analyzeSelectedPdfs(name?[name]:null)}
async function analyzeSelectedPdfs(explicitNames=null){
 const btn=$('#pdf-run');if(btn)btn.disabled=true;
 const feed=$('#pdf-extract-feedback');
 let names=(explicitNames||pdfSelectedNames()).filter(Boolean);names=[...new Set(names)];
 if(!names.length){if(btn)btn.disabled=false;return toast('Hãy chọn ít nhất một PDF để phân tích.',true)}

 app.pdfPreviews=[];app.pdfPreview=null;app.pdfJobIds={};app.pdfBatchStatus={};
 const saved=[],failed=[];
 if(feed)feed.innerHTML='<div class="note"><strong>bộ trích xuất V13</strong>: bắt đầu File 1/'+names.length+'. Mỗi file sẽ được lưu xong trước khi file kế tiếp được OCR.</div>';
 try{
   for(let i=0;i<names.length;i++){
     const source=names[i];
     app.pdfBatchStatus[source]={status:'queued',progress:0,message:`File ${i+1}/${names.length}: chuẩn bị OCR`};
     if(feed)feed.innerHTML=pdfBatchProgressHtml(app.pdfBatchStatus);
     try{
       // IMPORTANT: start only ONE job here. Do not start the next PDF until this one is committed.
       const started=await request('api/pdf/analyze/start',{name:source,bank:'',year:null,unit:'auto'},25000);
       const jid=started.job_id;app.pdfJobIds={};app.pdfJobIds[source]=jid;
       app.pdfBatchStatus[source]={status:started.status||'queued',progress:Number(started.progress||0),message:started.message||'Đã xếp hàng OCR'};
       const deadline=Date.now()+15*60*1000;let result=null,error=null;
       while(Date.now()<deadline){
         await new Promise(resolve=>setTimeout(resolve,900));
         let st;try{st=await request(`api/pdf/job?id=${encodeURIComponent(jid)}`,null,18000)}catch(e){st={status:'error',progress:0,message:e.message,error:e.message}}
         app.pdfBatchStatus[source]={status:st.status,progress:Number(st.progress||0),message:`File ${i+1}/${names.length}: ${st.message||''}`,error:st.error||''};
         if(feed)feed.innerHTML=pdfBatchProgressHtml(app.pdfBatchStatus);
         if(st.status==='done'){result=st.result;break}
         if(st.status==='error'){error=st.error||st.message||'OCR lỗi';break}
       }
       if(!result){throw Error(error||`File ${i+1} OCR quá 15 phút.`)}
       const metrics=(result.items||[]).map(x=>x.metric_id);
       if(!metrics.length)throw Error('Không đọc được chỉ tiêu nào từ PDF này; không có dữ liệu để lưu.')
       // Commit NOW. This increments datastore revision and invalidates this preview before the next PDF starts.
       // Therefore data from two PDFs can never share/mix the same preview revision.
       const committed=await request('api/pdf/commit',{preview_token:result.preview_token,metrics,replace:true},60000);
       app.state=committed.state||app.state;
       saved.push({source,bank:result.bank,year:result.year,count:metrics.length,missing:(result.missing||[]).length});
       app.pdfBatchStatus[source]={status:'saved',progress:100,message:`File ${i+1}/${names.length}: đã lưu ${metrics.length}/16 chỉ tiêu · ${result.bank} ${result.year}`};
       if(feed)feed.innerHTML=pdfBatchProgressHtml(app.pdfBatchStatus);
     }catch(e){
       const message=(e&&e.message)?e.message:String(e||'Lỗi không xác định');
       failed.push({source,error:message});
       app.pdfBatchStatus[source]={status:'error',progress:0,message:`File ${i+1}/${names.length}: ${message}`,error:message};
       if(feed)feed.innerHTML=pdfBatchProgressHtml(app.pdfBatchStatus);
       // Deliberately continue to the next selected PDF. One broken document must not erase prior saved files.
     }
   }
   app.pdfJobIds={};app.pdfPreviews=[];app.pdfPreview=null;
   const last=saved[saved.length-1];if(last){app.bank=last.bank;app.year=last.year}
   await refresh();
   const okText=saved.map((x,i)=>`${i+1}. ${x.source}: ${x.count}/16 · ${x.bank} ${x.year}`).join(' | ');
   if(saved.length)toast(`Đã đọc và lưu tuần tự ${saved.length}/${names.length} PDF. ${okText}`);
   if(failed.length)toast(`${failed.length} PDF lỗi; các PDF đã lưu thành công vẫn được giữ nguyên. Có thể chọn lại riêng file lỗi để chạy lại.`,true);
 }catch(e){if(feed)feed.innerHTML=`<div class="note warn">${escapeHTML(e.message)}</div>`;toast(e.message,true)}
 finally{if($('#pdf-run'))$('#pdf-run').disabled=false}
}
async function commitPdf(){
 const previews=app.pdfPreviews||[];if(!previews.length)return;
 const checks=Array.from(document.querySelectorAll('.pdf-metric-batch:checked'));if(!checks.length)return toast('Hãy chọn ít nhất một chỉ tiêu để nạp.',true);
 const grouped=new Map();for(const c of checks){const token=c.dataset.token,metric=c.dataset.metric;if(!grouped.has(token))grouped.set(token,[]);grouped.get(token).push(metric)}
 const selections=Array.from(grouped,([preview_token,metrics])=>({preview_token,metrics}));
 if(!confirm(`Xác nhận nạp ${checks.length} chỉ tiêu đã chọn từ ${selections.length} PDF vào bộ dữ liệu? Các chỉ tiêu trùng ngân hàng/năm sẽ được cập nhật bằng bản bạn vừa xác nhận.`))return;
 const btn=$('#pdf-commit');if(btn)btn.disabled=true;
 try{
   const r=await request('api/pdf/commit/batch',{selections,replace:Boolean($('#pdf-replace')?.checked)},60000);
   const last=previews[previews.length-1]?.result;app.pdfPreviews=[];app.pdfPreview=null;app.pdfBatchStatus={};if(last){app.bank=last.bank;app.year=last.year}toast(r.message);await refresh();
 }catch(e){const f=$('#pdf-commit-feedback');if(f)f.textContent=e.message;toast(e.message,true)}finally{if($('#pdf-commit'))$('#pdf-commit').disabled=false}
}

hương pháp tính các tỷ số và nội dung AI đã được duyệt, sẵn sàng mở hoặc lưu trực tiếp.</p><div class="hrow"><a class="button primary" href="${escapeHTML(getUrl('api/report',{bank:app.bank,year:app.year}))}">${icon('doc')} Xuất báo cáo PDF</a><span class="tiny">Hoặc gửi thẳng báo cáo qua email ở bên dưới.</span></div>`)}<div class="top-gap">${mail}</div><div class="section-top top-gap"><h2>Trạng thái chuẩn bị báo cáo</h2></div>${wrapTable(['Hạng mục','Trạng thái'],[['Bảng chỉ tiêu',tag('Có dữ liệu','good')],['Phân tích tỷ số',tag('Đã tính','good')],['Nguồn tài liệu',tag(s.documents.length?'Đã tiếp nhận':'Chưa bổ sung',s.documents.length?'good':'warn')],['Kết quả phân tích',tag(approved?'Đã duyệt '+approved+' tác vụ':'Chưa có nội dung duyệt',approved?'good':'warn')]])}`}

function draw(){
 const s=app.state;if(!s)return;
 const pageNames={overview:'Tổng quan tài chính',analysis:'Phân tích chỉ số',comparison:'Đối chiếu ngân hàng',monitor:'Giám sát rủi ro',scenario:'Phân tích kịch bản',data:'Nguồn dữ liệu',ai:'Phân tích hỗ trợ',report:'Báo cáo'};
 let body='';
 try{
   if(app.page==='data')body=renderData();
   else if(!has())body=title(pageNames[app.page],'Bắt đầu với bộ số liệu tài chính để sử dụng các chức năng phân tích.')+mustData();
   else if(app.page==='overview')body=renderOverview();
   else if(app.page==='analysis')body=renderAnalysis();

   else if(app.page==='report')body=renderReport();
   else{app.page='overview';body=has()?renderOverview():mustData()}
 }catch(e){
   console.error('AUREL render error',e);
   body=title('Không thể hiển thị nội dung','Đã xảy ra lỗi khi dựng trang hiện tại.')+`<div class="panel"><div class="note warn">${escapeHTML(e.message||String(e))}</div><button class="button primary" id="retry">Tải lại dữ liệu</button></div>`;
 }
 $('#crumb-title').textContent=pageNames[app.page]||'AUREL';

}
function controls(){const s=app.state;let b=$('#bank-select'),y=$('#year-select');const banks=[...new Set((s.choices||[]).map(c=>c.bank))];if(!banks.includes(app.bank))app.bank=banks[0]||null;const years=[...new Set((s.choices||[]).filter(c=>c.bank===app.bank).map(c=>c.year))].sort((a,b)=>b-a);if(!years.includes(app.year))app.year=years[0]||null;b.innerHTML=banks.length?banks.map(x=>`<option ${app.bank===x?'selected':''} value="${escapeHTML(x)}">${escapeHTML(x)}</option>`).join(''):'<option>Chọn ngân hàng</option>';y.innerHTML=years.length?years.map(x=>`<option ${app.year===x?'selected':''} value="${x}">${x}</option>`).join(''):'<option>Chọn năm</option>';b.disabled=!banks.length;y.disabled=!years.length;const z=$('#dataset-status');z.textContent=s.has_data?'Dữ liệu sẵn sàng':'Chưa có dữ liệu';z.className='status-pill'+(!s.has_data?' empty-status':'')}

async function uploadOneFile(f,replace,feed,index,total){
 if(f.size>40*1024*1024)throw Error(`${f.name}: dung lượng vượt 40 MB.`);
 const bytes=new Uint8Array(await f.arrayBuffer()),isPdf=/\.pdf$/i.test(f.name);let out=null;
 const prefix=`[${index}/${total}] ${escapeHTML(f.name)}`;
 if(isPdf||bytes.length>512*1024){
   if(!window.crypto?.subtle)throw Error('Trình duyệt không hỗ trợ SHA-256 để tải tệp theo từng phần.');
   const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');
   const init=await request('api/upload/start',{name:f.name,size:bytes.length,sha256:digest,replace},25000),n=init.chunk_bytes;
   for(let offset=0;offset<bytes.length;offset+=n){const slice=bytes.subarray(offset,Math.min(offset+n,bytes.length));let binary='';for(let i=0;i<slice.length;i++)binary+=String.fromCharCode(slice[i]);await request('api/upload/chunk',{upload_id:init.upload_id,offset,base64:btoa(binary)},30000);if(feed){const pct=Math.round(100*Math.min(offset+slice.length,bytes.length)/bytes.length);feed.innerHTML=`<div class="note">${prefix} · đang tải ${pct}%<br><span class="tiny">Đã hoàn tất ${index-1}/${total} tệp trước đó.</span></div>`}}
   out=await request('api/upload/complete',{upload_id:init.upload_id},50000);
 }else{
   let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
   try{out=await request('api/upload',{name:f.name,base64:btoa(binary),replace},50000)}catch(primary){
     if(!window.crypto?.subtle)throw primary;const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');const init=await request('api/upload/start',{name:f.name,size:bytes.length,sha256:digest,replace},25000),n=init.chunk_bytes;for(let offset=0;offset<bytes.length;offset+=n){const slice=bytes.subarray(offset,Math.min(offset+n,bytes.length));let part='';for(let i=0;i<slice.length;i++)part+=String.fromCharCode(slice[i]);await request('api/upload/chunk',{upload_id:init.upload_id,offset,base64:btoa(part)},30000)}out=await request('api/upload/complete',{upload_id:init.upload_id},50000);
   }
 }
 return out;
}
async function upload(){
 const files=(app.selectedFiles||[]).slice();if(!files.length)return toast('Vui lòng chọn ít nhất một tệp để tiếp tục.',true);if(files.length>20)return toast('Mỗi lần chọn tối đa 20 tệp.',true);
 const btn=$('#upload-button'),feed=$('#upload-feedback');if(btn)btn.disabled=true;const replace=Boolean($('#replace-check')?.checked),ok=[],failed=[];
 try{
   for(let i=0;i<files.length;i++){
     const f=files[i];try{const out=await uploadOneFile(f,replace,feed,i+1,files.length);ok.push({name:f.name,message:out.message})}catch(e){failed.push({name:f.name,error:e.message});if(feed)feed.innerHTML=`<div class="note warn">${escapeHTML(f.name)}: ${escapeHTML(e.message)}<br>Hệ thống tiếp tục với các tệp còn lại…</div>`}
   }
   app.selectedFiles=[];app.selectedFile=null;app.pdfPreviews=[];app.pdfPreview=null;app.pdfBatchStatus={};const input=$('#upload-file');if(input)input.value='';
   await refresh();
   const summary=`Đã tiếp nhận ${ok.length}/${files.length} tệp${failed.length?`; ${failed.length} tệp lỗi`:''}.`;
   const f2=$('#upload-feedback');if(f2)f2.innerHTML=`<div class="note ${failed.length?'warn':''}"><strong>${escapeHTML(summary)}</strong>${failed.map(x=>`<br>${escapeHTML(x.name)}: ${escapeHTML(x.error)}`).join('')}</div>`;toast(summary,Boolean(failed.length&& !ok.length));
 }finally{if($('#upload-button'))$('#upload-button').disabled=false}
}

async function runScenario(){
 const out=$('#scenario-result'),button=$('#run-scenario');
 if(!out||!button){toast('Không tìm thấy vùng mô phỏng. Hãy tải lại trang.',true);return}
 const nplInput=$('#npl-input'),loanInput=$('#loan-input');
 if(!nplInput||!loanInput){out.innerHTML='<div class="note warn">Giao diện kịch bản chưa khởi tạo đầy đủ. Hãy tải lại trang.</div>';return}
 const nplChange=Number(nplInput.value),loanChange=Number(loanInput.value);
 const valid=Number.isFinite(nplChange)&&Number.isFinite(loanChange)&&nplChange>=-100&&nplChange<=300&&loanChange>=-95&&loanChange<=300;
 if(!valid){out.innerHTML='<div class="note warn">Giả định không hợp lệ. Nợ xấu: -100% đến +300%; dư nợ: -95% đến +300%.</div>';return}
 button.disabled=true;out.innerHTML=loading('Đang tính toán kịch bản…');
 try{
   const r=await request('api/scenario',{bank:app.bank,year:app.year,npl_change:nplChange,loan_change:loanChange},30000);
   const delta=(r.before===null||r.after===null)?null:Number(r.after)-Number(r.before);
   out.innerHTML=`<div class="grid cols-equal" style="gap:10px">
     <div class="panel" style="background:#f7faf9;box-shadow:none"><div class="metric-title">Tỷ lệ nợ xấu ban đầu</div><h2>${percent(r.before)}</h2></div>
     <div class="panel" style="background:#f7faf9;box-shadow:none"><div class="metric-title">Tỷ lệ nợ xấu sau giả định</div><h2>${percent(r.after)}</h2><div class="tiny">${delta===null?'':(delta>0?'+':'')+new Intl.NumberFormat('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(delta)+' điểm %'}</div></div>
   </div>
   <div class="top-gap">${wrapTable(['Chỉ tiêu','Hiện tại','Sau giả định','Thay đổi'],[
     ['Nợ xấu',money(r.npl_before),money(r.npl_after),percent(nplChange)],
     ['Dư nợ cho vay',money(r.loans_before),money(r.loans_after),percent(loanChange)]
   ])}</div>
   <div class="note top-gap">Đây là mô phỏng cơ học trên nợ xấu và dư nợ cho vay. Kết quả không phải dự báo và không tự phản ánh tác động đến dự phòng, lợi nhuận, CAR hoặc thanh khoản.</div>`;
 }catch(e){
   out.innerHTML=`<div class="note warn"><strong>Không tính được kịch bản.</strong><br>${escapeHTML(e.message)}</div>`;
   toast(e.message,true);
 }finally{button.disabled=false}
}
async function runAI(){let out=$('#ai-output');$('#run-ai').disabled=true;out.innerHTML=loading('Đang tổng hợp thông tin và đối chiếu tài liệu…');try{let r=await request('api/ai',{bank:app.bank,year:app.year,task:app.aiTask,question:$('#ai-question').value},105000);app.state.ai[`${app.bank}:${app.year}:${app.aiTask}`]=r;out.innerHTML=aiPanel();toast('Đã hoàn thành nội dung phân tích.')}catch(e){out.innerHTML=`<div class="note warn">${escapeHTML(e.message)}</div>`;toast(e.message,true)}finally{if($('#run-ai'))$('#run-ai').disabled=false}}
async function approveAI(){try{let r=await request('api/review',{bank:app.bank,year:app.year,task:app.aiTask,approve:true});app.state.ai[`${app.bank}:${app.year}:${app.aiTask}`]=r.result;$('#ai-output').innerHTML=aiPanel();toast('Đã duyệt nội dung phân tích.')}catch(e){toast(e.message,true)}}
async function showDoc(name,page){try{let r=await fetch(getUrl('api/document',{name,page}));let d=await r.json();if(!r.ok)throw Error(d.error||'Không mở được tài liệu.');$('#modal-content').innerHTML=`<div class="eyebrow">NGUỒN TÀI LIỆU</div><h2>${escapeHTML(d.name)} · Trang ${d.page}</h2><pre id="doc-content"></pre>`;$('#doc-content').textContent=d.text;$('#modal').classList.remove('hidden')}catch(e){toast(e.message,true)}}
// Delegated events survive page rerenders.
document.addEventListener('click',async e=>{const modeButton=e.target.closest('[data-compare-mode]');if(modeButton){app.compareMode=modeButton.dataset.compareMode;draw();return}const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const doc=e.target.closest('[data-doc]');if(doc){showDoc(doc.dataset.doc,Number(doc.dataset.sourcePage));return}if(e.target.closest('#close-modal')||e.target.id==='modal'){$('#modal').classList.add('hidden');return}if(e.target.closest('#retry'))return bootstrapAurel();if(e.target.closest('#save-api-base'))return saveApiBase();
 if(e.target.closest('#report-mail-password-toggle')){e.preventDefault();toggleReportPasswordVisibility();return}
 const extract=e.target.closest('[data-pdf-analyze]');if(extract)return analyzePdf(extract.dataset.pdfAnalyze);
 if(e.target.closest('#pdf-select-all')){document.querySelectorAll('.pdf-source-check').forEach(x=>x.checked=true);return}
 if(e.target.closest('#pdf-select-none')){document.querySelectorAll('.pdf-source-check').forEach(x=>x.checked=false);return}
 if(e.target.closest('#pdf-metric-all')){document.querySelectorAll('.pdf-metric-batch').forEach(x=>x.checked=true);return}
 if(e.target.closest('#pdf-metric-none')){document.querySelectorAll('.pdf-metric-batch').forEach(x=>x.checked=false);return}
 if(e.target.closest('#pdf-run'))return analyzeSelectedPdfs();if(e.target.closest('#pdf-commit'))return commitPdf();if(e.target.closest('#upload-button'))return upload();if(e.target.closest('#run-scenario'))return runScenario();if(e.target.closest('#run-ai'))return runAI();if(e.target.closest('#check-ai'))return checkGemini();if(e.target.closest('#save-ai-key'))return saveGeminiKey();if(e.target.closest('#clear-ai-key'))return clearGeminiKey();if(e.target.closest('#approve-ai'))return approveAI();if(e.target.closest('#send-report-email'))return sendReportEmail();if(e.target.closest('#clear-button')){if(!confirm('Xóa toàn bộ dữ liệu tài chính, tài liệu PDF và nội dung AI của phiên này?'))return;try{const z=await request('api/clear',{confirm:'XOA_DU_LIEU'});toast(z.message);app.bank=null;app.year=null;app.compareBankA=null;app.compareBankB=null;app.compareMode='pair';app.compareChart='bar';app.pdfPreview=null;app.pdfPreviews=[];app.pdfBatchStatus={};app.selectedFiles=[];await refresh()}catch(err){toast(err.message,true)}}});
document.addEventListener('change',async e=>{if(e.target.id==='chart-select'){app.chart=e.target.value;draw()}if(e.target.id==='analysis-metric'){app.analysisMetric=e.target.value;draw()}if(e.target.id==='ai-task'){app.aiTask=e.target.value;draw()}if(e.target.id==='compare-metric'){app.compareMetric=e.target.value;draw()}if(e.target.id==='compare-chart'){app.compareChart=e.target.value;draw()}if(e.target.id==='compare-bank-a'){app.compareBankA=e.target.value;draw()}if(e.target.id==='compare-bank-b'){app.compareBankB=e.target.value;draw()}if(e.target.id==='upload-file'){app.selectedFiles=Array.from(e.target.files||[]);app.selectedFile=app.selectedFiles[0]||null;const n=$('#upload-name');if(n)n.textContent=app.selectedFiles.length?`${app.selectedFiles.length} tệp đã chọn`:'Chọn một hoặc nhiều tệp cùng lúc'}if(e.target.id==='bank-select'){app.bank=e.target.value;app.year=null;await refresh()}if(e.target.id==='year-select'){app.year=Number(e.target.value);await refresh()}});
bootstrapAurel();
</script></body></html>
