name: AUREL redesign non overview pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-redesign-non-overview.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign all pages except overview
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R126_NON_OVERVIEW_REDESIGN">
          /* R126 — redesign toàn bộ trang chức năng, NGOẠI TRỪ Tổng quan.
             Chỉ thay presentation/CSS; không đổi dữ liệu, JS, công thức hoặc chức năng. */

          /* =========================================================
             LIGHT MODE — clean financial intelligence system
             ========================================================= */
          body:not(:has(#nav button[data-page="overview"].active)) .page{
            background:
              radial-gradient(circle at 88% 4%,rgba(37,99,235,.055),transparent 23%),
              radial-gradient(circle at 16% 2%,rgba(14,165,164,.045),transparent 22%),
              linear-gradient(180deg,#f4f8fb 0%,#edf3f7 100%)!important;
          }

          body:not(:has(#nav button[data-page="overview"].active)) .page-head{
            position:relative!important;
            overflow:hidden!important;
            margin-bottom:22px!important;
            padding:22px 24px!important;
            border:1px solid #cbdbe7!important;
            border-radius:15px!important;
            background:
              linear-gradient(120deg,rgba(255,255,255,.98),rgba(242,248,252,.96))!important;
            box-shadow:0 9px 24px rgba(25,58,82,.065)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .page-head:before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            top:0!important;
            bottom:0!important;
            width:4px!important;
            background:linear-gradient(180deg,#287cff,#20b8b0)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .page-head:after{
            content:""!important;
            position:absolute!important;
            width:170px!important;
            height:170px!important;
            right:-55px!important;
            top:-95px!important;
            border-radius:50%!important;
            background:radial-gradient(circle,rgba(48,153,255,.10),rgba(48,153,255,0) 70%)!important;
            pointer-events:none!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .page-head h1{
            color:#123754!important;
            font-size:clamp(24px,2vw,31px)!important;
            font-weight:900!important;
            letter-spacing:-.45px!important;
            margin-bottom:7px!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .page-head p{
            color:#607d91!important;
            line-height:1.62!important;
            max-width:820px!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .page-head .eyebrow,
          body:not(:has(#nav button[data-page="overview"].active)) .eyebrow{
            color:#2873b7!important;
            font-weight:850!important;
            letter-spacing:1.55px!important;
          }

          /* Core surfaces */
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel,.metric,.dataset-card,.analysis-feature,.analysis-trend,
            .compare-settings,.compare-pair-visual,.compare-all-panel,
            .monitor-card,.scenario-control,.pdf-intro-card,.pdf-intro-main,
            .ai-key-panel,.compare-kpi,.compare-details
          ){
            border:1px solid #cbd9e4!important;
            border-radius:14px!important;
            background:linear-gradient(180deg,#ffffff 0%,#f9fbfd 100%)!important;
            box-shadow:0 7px 20px rgba(25,55,77,.055)!important;
          }

          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel,.dataset-card,.analysis-trend,.compare-settings,.compare-pair-visual,
            .compare-all-panel,.monitor-card,.scenario-control,.pdf-intro-card,
            .pdf-intro-main,.ai-key-panel
          ){
            transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .dataset-card,.analysis-feature,.monitor-card,.scenario-control,.compare-kpi
          ):hover{
            border-color:#a9c5d8!important;
            box-shadow:0 11px 24px rgba(25,63,91,.085)!important;
          }

          /* Section headings */
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel h2,.panel h3,.analysis-trend h2,.analysis-trend h3,
            .compare-settings h2,.compare-pair-visual h2,.compare-all-panel h2,
            .monitor-card h2,.monitor-card h3,.scenario-control h2,.scenario-control h3,
            .pdf-intro-card h2,.pdf-intro-card h3,.pdf-intro-main h2,.pdf-intro-main h3,
            .ai-key-panel h2,.ai-key-panel h3
          ){
            color:#173a55!important;
            letter-spacing:-.18px!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel p,.analysis-trend p,.monitor-card p,.scenario-control p,
            .pdf-intro-card p,.pdf-intro-main p,.ai-key-panel p
          ){
            color:#698295!important;
          }

          /* Forms & controls */
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            input,select,textarea
          ){
            background:#fbfdff!important;
            border-color:#c9d9e5!important;
            color:#173b55!important;
            border-radius:10px!important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.85)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            input,select,textarea
          ):focus{
            border-color:#4f94d0!important;
            box-shadow:0 0 0 3px rgba(63,135,195,.11)!important;
            outline:none!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .field label{
            color:#537186!important;
            font-weight:750!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .button{
            border-color:#bfd2df!important;
            background:linear-gradient(180deg,#ffffff,#f6fafc)!important;
            color:#214760!important;
            border-radius:10px!important;
            box-shadow:0 3px 8px rgba(28,65,91,.05)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .button:hover:not(:disabled){
            border-color:#8fb6d1!important;
            box-shadow:0 7px 16px rgba(28,78,113,.10)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .button.primary{
            background:linear-gradient(135deg,#2175d9,#1665bd)!important;
            border-color:#1665bd!important;
            color:#fff!important;
            box-shadow:0 6px 15px rgba(33,117,217,.20)!important;
          }

          /* Tables */
          body:not(:has(#nav button[data-page="overview"].active)) .table-wrap{
            border:1px solid #cbd9e4!important;
            border-radius:12px!important;
            overflow:auto!important;
            background:#fff!important;
            box-shadow:none!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) table{
            border-collapse:separate!important;
            border-spacing:0!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) thead th{
            background:#eef5fa!important;
            color:#35576f!important;
            font-weight:850!important;
            border-bottom:1px solid #c9d8e3!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) tbody td{
            color:#27465c!important;
            border-bottom-color:#e4edf3!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) tbody tr:nth-child(even){
            background:#f8fbfd!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) tbody tr:hover{
            background:#eef6fb!important;
          }

          /* Analysis cards */
          body:not(:has(#nav button[data-page="overview"].active)) .analysis-feature{
            position:relative!important;
            overflow:hidden!important;
            border-top:3px solid #3b82f6!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .analysis-feature:nth-child(2){
            border-top-color:#17b6ae!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .analysis-feature:nth-child(3){
            border-top-color:#55a8c8!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .analysis-feature-value{
            color:#123754!important;
            font-weight:950!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .analysis-feature-label{
            color:#5e7b8f!important;
            font-weight:780!important;
          }

          /* Comparison — aesthetic only, preserve R125 geometry */
          body:not(:has(#nav button[data-page="overview"].active)) .compare-settings{
            background:linear-gradient(135deg,#ffffff,#f5fafc)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .compare-mode-btn{
            color:#547286!important;
            border-radius:9px!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .compare-mode-btn.active{
            background:linear-gradient(135deg,#2474d2,#1761b7)!important;
            color:#fff!important;
            box-shadow:0 5px 13px rgba(36,116,210,.18)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .compare-kpi:nth-child(1){
            border-top:3px solid #3b82f6!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .compare-kpi:nth-child(2){
            border-top:3px solid #20b8b0!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .compare-kpi:nth-child(3){
            border-top:3px solid #e5ad45!important;
          }

          /* Risk / scenario / data / support / reports */
          body:not(:has(#nav button[data-page="overview"].active)) .monitor-card{
            border-top:3px solid #3b82f6!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .scenario-control{
            border-top:3px solid #20b8b0!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .dataset-card{
            position:relative!important;
            overflow:hidden!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) .dataset-card:before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            top:0!important;
            bottom:0!important;
            width:3px!important;
            background:linear-gradient(180deg,#3b82f6,#20b8b0)!important;
          }
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .pdf-intro-card,.pdf-intro-main,.ai-key-panel
          ){
            background:
              linear-gradient(145deg,#ffffff 0%,#f4f9fc 100%)!important;
          }

          /* Small status chips */
          body:not(:has(#nav button[data-page="overview"].active)) :is(
            .status-pill,.badge,.chip
          ){
            border-radius:999px!important;
          }

          /* =========================================================
             DARK MODE — match current Tổng quan dark visual language
             ========================================================= */
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .page{
            background:
              radial-gradient(circle at 88% 3%,rgba(50,123,219,.08),transparent 24%),
              radial-gradient(circle at 14% 2%,rgba(30,183,173,.055),transparent 22%),
              linear-gradient(180deg,#080d14 0%,#070b11 100%)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .page-head{
            border-color:#2b4055!important;
            background:
              linear-gradient(135deg,#101b28 0%,#0c151f 100%)!important;
            box-shadow:0 11px 28px rgba(0,0,0,.20)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .page-head:before{
            background:linear-gradient(180deg,#4d9cff,#2fc7b3)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .page-head h1{
            color:#f3f8fc!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .page-head p{
            color:#9db0c0!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .page-head .eyebrow,.eyebrow
          ){
            color:#68aaff!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel,.metric,.dataset-card,.analysis-feature,.analysis-trend,
            .compare-settings,.compare-pair-visual,.compare-all-panel,
            .monitor-card,.scenario-control,.pdf-intro-card,.pdf-intro-main,
            .ai-key-panel,.compare-kpi,.compare-details
          ){
            border-color:#2b4055!important;
            background:linear-gradient(180deg,#111d2a 0%,#0d1722 100%)!important;
            box-shadow:0 8px 22px rgba(0,0,0,.18)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .dataset-card,.analysis-feature,.monitor-card,.scenario-control,.compare-kpi
          ):hover{
            border-color:#3a5872!important;
            box-shadow:0 12px 28px rgba(0,0,0,.25)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel h2,.panel h3,.analysis-trend h2,.analysis-trend h3,
            .compare-settings h2,.compare-pair-visual h2,.compare-all-panel h2,
            .monitor-card h2,.monitor-card h3,.scenario-control h2,.scenario-control h3,
            .pdf-intro-card h2,.pdf-intro-card h3,.pdf-intro-main h2,.pdf-intro-main h3,
            .ai-key-panel h2,.ai-key-panel h3
          ){
            color:#eef5fa!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .panel p,.analysis-trend p,.monitor-card p,.scenario-control p,
            .pdf-intro-card p,.pdf-intro-main p,.ai-key-panel p
          ){
            color:#98adbd!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            input,select,textarea
          ){
            background:#0b1520!important;
            border-color:#334a5f!important;
            color:#edf5fb!important;
            color-scheme:dark!important;
            box-shadow:none!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            input,select,textarea
          ):focus{
            border-color:#578fc8!important;
            box-shadow:0 0 0 3px rgba(77,156,255,.11)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .field label{
            color:#9db0bf!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .button{
            background:linear-gradient(180deg,#152334,#101b28)!important;
            border-color:#334a60!important;
            color:#d8e4ed!important;
            box-shadow:none!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .button.primary{
            background:linear-gradient(135deg,#2b80ed,#1765c0)!important;
            border-color:#347fd2!important;
            color:#fff!important;
            box-shadow:0 7px 17px rgba(35,112,218,.18)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .table-wrap{
            border-color:#2b4055!important;
            background:#0d1722!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) thead th{
            background:#162433!important;
            color:#b9c9d5!important;
            border-bottom-color:#31485d!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) tbody td{
            color:#d3e0e9!important;
            border-bottom-color:#223548!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) tbody tr:nth-child(even){
            background:#101b27!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) tbody tr:hover{
            background:#162638!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .analysis-feature{
            background:linear-gradient(145deg,rgba(65,139,225,.08),#111d2a 46%,#0d1722 100%)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .analysis-feature:nth-child(2){
            background:linear-gradient(145deg,rgba(32,184,176,.075),#111d2a 46%,#0d1722 100%)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .analysis-feature-value{
            color:#f7fbff!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .analysis-feature-label{
            color:#a5b8c7!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .compare-settings{
            background:linear-gradient(135deg,#111d2a,#0d1722)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .compare-mode-btn{
            color:#9fb3c3!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) .compare-mode-btn.active{
            background:linear-gradient(135deg,#2a7ee8,#1762b9)!important;
            color:#fff!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .pdf-intro-card,.pdf-intro-main,.ai-key-panel
          ){
            background:
              linear-gradient(145deg,#111d2a 0%,#0d1722 100%)!important;
          }

          /* Responsive polish */
          @media(max-width:900px){
            body:not(:has(#nav button[data-page="overview"].active)) .page-head{
              padding:18px!important;
              border-radius:13px!important;
            }
          }
          @media(max-width:640px){
            body:not(:has(#nav button[data-page="overview"].active)) .page-head{
              padding:16px 15px!important;
              margin-bottom:16px!important;
            }
            body:not(:has(#nav button[data-page="overview"].active)) .page-head h1{
              font-size:23px!important;
            }
            body:not(:has(#nav button[data-page="overview"].active)) :is(
              .panel,.metric,.dataset-card,.analysis-feature,.analysis-trend,
              .compare-settings,.compare-pair-visual,.compare-all-panel,
              .monitor-card,.scenario-control,.pdf-intro-card,.pdf-intro-main,
              .ai-key-panel,.compare-kpi,.compare-details
            ){
              border-radius:12px!important;
            }
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R126_NON_OVERVIEW_REDESIGN">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Redesign all non-overview pages to match overview"
          git push
