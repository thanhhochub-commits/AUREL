name: AUREL AI Super-Resolution V8 (one-time)
on:
  push:
    paths:
      - .github/workflows/aurel-ai-superres-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual AI super-resolution runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet 'numpy<2' 'opencv-contrib-python-headless==4.10.0.84'
          python -c "import cv2; print('OpenCV',cv2.__version__,'AI module',hasattr(cv2,'dnn_superres')); assert hasattr(cv2,'dnn_superres')"
          curl -fL --retry 3 -sS 'https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x2.pb' -o /tmp/FSRCNN_x2.pb
          test "$(stat -c%s /tmp/FSRCNN_x2.pb)" -gt 30000
      - name: Enhance actual video frames with neural-network x2 and balanced colors
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/aurel_enhance.py <<'PY'
          import cv2, subprocess, os, sys, time, numpy as np
          cv2.setNumThreads(3)
          path='assets/login-city-bg.mp4'
          out='assets/login-city-bg-ai-v8.mp4'
          cap=cv2.VideoCapture(path)
          assert cap.isOpened(), 'source video unavailable'
          fps=cap.get(cv2.CAP_PROP_FPS) or 30.0
          frames=int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          width=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
          height=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          assert width == 510 and height == 584, (width,height)
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/FSRCNN_x2.pb')
          sr.setModel('fsrcnn',2)
          clahe=cv2.createCLAHE(clipLimit=1.23,tileGridSize=(8,8))
          cmd=['ffmpeg','-hide_banner','-loglevel','error','-y','-f','rawvideo','-vcodec','rawvideo','-s',f'{width*2}x{height*2}','-pix_fmt','bgr24','-r',str(fps),'-i','pipe:0','-an','-c:v','libx264','-preset','veryfast','-crf','20','-pix_fmt','yuv420p','-movflags','+faststart','-threads','3',out]
          enc=subprocess.Popen(cmd,stdin=subprocess.PIPE,stderr=subprocess.PIPE)
          started=time.time()
          i=0
          try:
              while True:
                  ok,im=cap.read()
                  if not ok:break
                  up=sr.upsample(im)
                  # Restrained local tonal recovery on the *luminance* channel, keeping colors realistic.
                  lab=cv2.cvtColor(up,cv2.COLOR_BGR2LAB)
                  l,a,b=cv2.split(lab)
                  recovered=clahe.apply(l)
                  l=cv2.addWeighted(l,0.72,recovered,0.28,0)
                  refined=cv2.cvtColor(cv2.merge((l,a,b)),cv2.COLOR_LAB2BGR)
                  if i<2:
                      cv2.imwrite('/tmp/aurel_ai_test_'+str(i)+'.png',refined)
                  enc.stdin.write(refined.tobytes())
                  i+=1
                  if i%120==0:print('frames',i,'/',frames,'elapsed',round(time.time()-started,1),'sec',flush=True)
          finally:
              cap.release()
              enc.stdin.close()
              ret=enc.wait()
          assert ret==0, 'Video encoding failed'
          assert i>=800, f'Insufficient frames {i}'
          print('AI FSRCNN x2 finished:',i,'frames in',round(time.time()-started,1),'s; bytes',os.stat(out).st_size)
          PY
          python /tmp/aurel_enhance.py
          test -s assets/login-city-bg-ai-v8.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate -of default=nw=1 assets/login-city-bg-ai-v8.mp4
          if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 assets/login-city-bg-ai-v8.mp4 | grep -q .; then exit 1; fi
      - name: Commit enhanced web video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/login-city-bg-ai-v8.mp4
          git diff --cached --quiet || (git commit -m 'Add actual AI-superresolved silent AUREL login video' && git pull --rebase origin main && git push)
