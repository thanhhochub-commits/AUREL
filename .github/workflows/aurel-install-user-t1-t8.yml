name: AUREL install user T1 T8 hero images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-install-user-t1-t8.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace horizontal hero T1 through T8 only
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          hero=[
              "https://aurel-assets-20260929.floot.app/_cdn/static/aa18ae40-4e8a-40e4-9e3c-4eae054e2ba3-aurel_t1_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/25fa8f0f-36a9-4c92-b684-bde47976c501-aurel_t2_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/793a700b-cab0-422b-b7b6-2137bc11d3b9-aurel_t3_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/401515e0-6e9b-4a9b-84ae-1f0a3d64dc38-aurel_t4_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/637e1e0a-45ae-476c-8d73-6c6dbd610614-aurel_t5_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/b99fb51b-7e7b-41c2-89d7-9f17d5496d61-aurel_t6_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/0af3d24c-6082-4e14-a606-064af9245f2d-aurel_t7_horizontal_user_20261001.png",
              "https://aurel-assets-20260929.floot.app/_cdn/static/586439d3-65a8-4cb0-ac31-68c3acce97bb-aurel_t8_horizontal_user_20261001.png",
          ]

          new_hero="var HERO=[\n"+",\n".join("    '"+u+"'" for u in hero)+"\n  ];"

          script_pat=re.compile(
              r'(<script id="AUREL_R78_REAL_SLIDER_JS">[\s\S]*?)(var HERO=\[[\s\S]*?\];)([\s\S]*?</script>)',
              re.M
          )
          if not script_pat.search(s):
              raise SystemExit("Không tìm thấy AUREL_R78_REAL_SLIDER_JS / HERO array.")
          s=script_pat.sub(lambda m:m.group(1)+new_hero+m.group(3),s,count=1)

          selectors=",\n".join(
              'body:has(#nav button[data-page="overview"].active)\n'
              '.ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t%d_horizontal_user_20261001.png"]' % i
              for i in range(1,9)
          )

          rule=selectors+"""{
            position:absolute!important;
            inset:0!important;
            left:0!important;
            right:0!important;
            top:0!important;
            bottom:0!important;
            width:100%!important;
            height:100%!important;
            min-width:100%!important;
            min-height:100%!important;
            max-width:100%!important;
            max-height:100%!important;
            object-fit:fill!important;
            object-position:center center!important;
            margin:0!important;
            padding:0!important;
            border:0!important;
            border-radius:0!important;
            opacity:1!important;
            filter:none!important;
            clip-path:none!important;
          }"""

          css='<style id="AUREL_R118_USER_T1_T8_HERO_EXACT_FIT">\n'+rule+'\n</style>'
          css_pat=re.compile(r'<style id="AUREL_R118_USER_T1_T8_HERO_EXACT_FIT">[\s\S]*?</style>\s*',re.M)
          if css_pat.search(s):
              s=css_pat.sub(css+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body> để chèn CSS.")
              s=s.replace("</body>",css+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Install user-provided hero images T1 through T8"
          git push
