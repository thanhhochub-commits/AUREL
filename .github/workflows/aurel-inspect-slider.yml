name: AUREL inspect slider refs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-inspect-slider.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract current horizontal slider refs
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          lines=[]
          pats=[
            r'https?://[^"\'\s>]+aurel_t[1-8][^"\'\s>]*',
            r'aurel_t[1-8][A-Za-z0-9_\-.]*',
            r'[^\n]{0,180}aurel-r78-slider-img[^\n]{0,260}'
          ]
          seen=set()
          for pat in pats:
            for m in re.finditer(pat,s,re.I):
              x=m.group(0)
              if x not in seen:
                seen.add(x)
                lines.append(x)
          Path("slider_refs_debug.txt").write_text("\n---\n".join(lines),encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add slider_refs_debug.txt
          git commit -m "Temporary slider reference inspection"
          git push
