name: AUREL Hanoi hero copy fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-hanoi-copy-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Hanoi hero text overlay only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("financial-intelligence.html")
          s = p.read_text(encoding="utf-8")

          css = r'''
          <style id="AUREL_R117_HANOI_HERO_COPY">
          /* R117 — chỉ thay phần chữ trên 2 slide Hà Nội, không đổi ảnh/slideshow/chức năng. */
          .ref-hero{position:relative!important}
          .aurel-hanoi-copy-r117{
            position:absolute;
            z-index:12;
            left:18px;
            top:9px;
            width:min(365px,34%);
            min-height:88px;
            padding:7px 20px 8px 9px;
            display:flex;
            align-items:center;
            opacity:0;
            pointer-events:none;
            color:#fff;
            font-size:clamp(12px,1.12vw,17px);
            line-height:1.28;
            font-weight:620;
            font-style:italic;
            letter-spacing:.15px;
            text-shadow:0 1px 3px rgba(3,52,93,.38);
            transition:opacity .16s ease;
            overflow:visible;
          }
          .aurel-hanoi-copy-r117::before{
            content:"";
            position:absolute;
            z-index:-1;
            inset:-3px -10px -3px -7px;
            background:
              linear-gradient(90deg,
                rgba(24,151,225,.98) 0%,
                rgba(27,156,229,.96) 72%,
                rgba(34,161,230,.76) 88%,
                rgba(34,161,230,0) 100%);
            filter:saturate(1.04);
            border-radius:7px 18px 18px 7px;
          }
          .aurel-hanoi-copy-r117.is-visible{opacity:1}
          .aurel-hanoi-copy-r117 .r117-line{
            display:block;
            white-space:nowrap;
          }
          .aurel-hanoi-copy-r117 .r117-rule{
            display:block;
            width:54px;
            height:2px;
            margin:7px auto 0;
            border-radius:999px;
            background:rgba(255,255,255,.82);
            box-shadow:0 1px 2px rgba(0,0,0,.08);
          }

          @media(max-width:900px){
            .aurel-hanoi-copy-r117{
              left:11px;
              top:7px;
              width:min(330px,48%);
              font-size:clamp(10px,1.7vw,14px);
              min-height:72px;
              padding:5px 14px 6px 7px;
            }
          }
          @media(max-width:600px){
            .aurel-hanoi-copy-r117{
              left:7px;
              top:5px;
              width:62%;
              font-size:clamp(8px,2.1vw,11px);
              line-height:1.22;
              min-height:58px;
            }
            .aurel-hanoi-copy-r117 .r117-rule{
              width:40px;
              margin-top:5px;
            }
          }
          </style>
          '''

          js = r'''
          <script id="AUREL_R117_HANOI_HERO_COPY_JS">
          (function(){
            function ensureOverlay(hero){
              if(!hero) return null;
              var old=hero.querySelector(':scope > .aurel-hanoi-copy-r117');
              if(old) return old;

              var box=document.createElement('div');
              box.className='aurel-hanoi-copy-r117';
              box.setAttribute('aria-hidden','true');
              box.innerHTML=
                '<span>'+
                  '<span class="r117-line">“TP. Hà Nội</span>'+
                  '<span class="r117-line">- Thủ Đô ngàn năm văn hiến</span>'+
                  '<span class="r117-line">và trái tim văn hóa của Việt Nam”</span>'+
                  '<i class="r117-rule"></i>'+
                '</span>';
              hero.appendChild(box);
              return box;
            }

            function isHanoi(src){
              src=String(src||'');
              return src.indexOf('aurel_t5_hanoi_hero_fulltext_20261001.png')>=0 ||
                     src.indexOf('aurel_t6_hanoi_hero_night_20261001.png')>=0;
            }

            function currentHeroImage(hero){
              var imgs=[].slice.call(hero.querySelectorAll('.aurel-r78-slider-img'));
              if(!imgs.length) return null;
              var hr=hero.getBoundingClientRect();
              var hx=hr.left+hr.width/2;
              var best=null,dist=Infinity;
              imgs.forEach(function(img){
                var r=img.getBoundingClientRect();
                var ix=r.left+r.width/2;
                var d=Math.abs(ix-hx);
                if(d<dist){dist=d;best=img}
              });
              return best;
            }

            function update(){
              var hero=document.querySelector('.ref-hero');
              if(!hero) return;
              var box=ensureOverlay(hero);
              var img=currentHeroImage(hero);
              box.classList.toggle('is-visible',!!(img&&isHanoi(img.currentSrc||img.src)));
            }

            var queued=false;
            function schedule(){
              if(queued)return;
              queued=true;
              requestAnimationFrame(function(){
                queued=false;
                update();
              });
            }

            document.addEventListener('DOMContentLoaded',schedule);
            window.addEventListener('resize',schedule,{passive:true});
            document.addEventListener('transitionend',function(e){
              if(e.target&&e.target.classList&&e.target.classList.contains('aurel-r78-slider-img')) schedule();
            },true);

            var root=document.getElementById('root')||document.body;
            new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['src','style']});
            setTimeout(schedule,100);
            setTimeout(schedule,800);
          })();
          </script>
          '''

          css_pat = re.compile(r'<style id="AUREL_R117_HANOI_HERO_COPY">[\s\S]*?</style>\s*', re.M)
          js_pat = re.compile(r'<script id="AUREL_R117_HANOI_HERO_COPY_JS">[\s\S]*?</script>\s*', re.M)

          if css_pat.search(s):
              s = css_pat.sub(css.strip()+"\n", s, count=1)
          else:
              s = s.replace("</head>", css.strip()+"\n</head>", 1)

          if js_pat.search(s):
              s = js_pat.sub(js.strip()+"\n", s, count=1)
          else:
              s = s.replace("</body>", js.strip()+"\n</body>", 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Update Hanoi slide wording on website"
          git push
