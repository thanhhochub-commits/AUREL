name: AUREL replace T4 T6 exact fit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-replace-t4-t6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only horizontal T4 and T6
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          t4="https://aurel-assets-20260929.floot.app/_cdn/static/420092ec-2fdf-4b79-a067-35ce35b14cb0-aurel_t4_hcm_user_exact_20261001.png"
          t6="https://aurel-assets-20260929.floot.app/_cdn/static/70ee8ed7-386f-49c1-ac3f-c9ec2d87148a-aurel_t6_hanoi_user_exact_20261001.png"

          s, n4 = re.subn(
              r'https://aurel-assets-20260929\.floot\.app/_cdn/static/[^\'"]*aurel_t4_horizontal_user_20261001\.png',
              t4,
              s
          )
          s, n6 = re.subn(
              r'https://aurel-assets-20260929\.floot\.app/_cdn/static/[^\'"]*aurel_t6_horizontal_user_20261001\.png',
              t6,
              s
          )

          if n4 < 1:
              raise SystemExit("Không tìm thấy T4 hiện tại để thay.")
          if n6 < 1:
              raise SystemExit("Không tìm thấy T6 hiện tại để thay.")

          css=r'''
          <style id="AUREL_R122_T4_T6_EXACT_PAIR_FIT">
          /* T4 dùng cùng geometry T3; T6 dùng cùng geometry T5. Chỉ ảnh ngang overview. */
          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t3_horizontal_user_20261001.png"],
          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t4_hcm_user_exact_20261001.png"],
          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t5_horizontal_user_20261001.png"],
          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t6_hanoi_user_exact_20261001.png"]{
            position:absolute!important;
            inset:0!important;
            left:0!important;
            right:0!important;
            top:0!important;
            bottom:0!important;
            width:100%!important;
            height:100%!important;
            min-width:100%!important;
            min-height:100%!important;
            max-width:100%!important;
            max-height:100%!important;
            object-fit:fill!important;
            object-position:center center!important;
            margin:0!important;
            padding:0!important;
            border:0!important;
            border-radius:0!important;
            opacity:1!important;
            filter:none!important;
            clip-path:none!important;
          }

          @media (min-width:1101px){
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t4_hcm_user_exact_20261001.png"],
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t6_hanoi_user_exact_20261001.png"]{
              width:104.2%!important;
              min-width:104.2%!important;
              max-width:104.2%!important;
              left:-2.1%!important;
              right:auto!important;
              scale:.96 1.10!important;
              transform-origin:center center!important;
            }
          }

          @media (min-width:761px) and (max-width:1100px){
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t4_hcm_user_exact_20261001.png"],
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img[src*="aurel_t6_hanoi_user_exact_20261001.png"]{
              width:102.1%!important;
              min-width:102.1%!important;
              max-width:102.1%!important;
              left:-1.05%!important;
              right:auto!important;
              scale:.98 1.06!important;
              transform-origin:center center!important;
            }
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R122_T4_T6_EXACT_PAIR_FIT">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")
          print("T4 replacements:",n4)
          print("T6 replacements:",n6)

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Replace T4 and T6 horizontal hero images"
          git push
