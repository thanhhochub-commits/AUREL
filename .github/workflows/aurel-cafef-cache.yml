name: AUREL CafeF Source Refresh
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aurel-cafef-cache.yml"
      - "scripts/refresh_cafef_cache.py"
      - "aurel_cafef.py"
  schedule:
    - cron: "20 */3 * * *"

permissions:
  contents: write

concurrency:
  group: aurel-cafef-refresh
  cancel-in-progress: false

jobs:
  refresh-cafef-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve CafeF public articles and disclosures
        run: python scripts/refresh_cafef_cache.py
      - name: Verify cache JSON and truthfulness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/cafef-cache.json")
          cache=json.loads(p.read_text("utf-8"))
          assert cache["source"]=="CafeF" and cache["symbols"]
          for sym,item in cache["symbols"].items():
              assert item["symbol"]==sym
              assert item.get("official_api") is False
              for category in ("reports","disclosures","market_news"):
                  for row in item.get(category,[]):
                      assert row.get("url","").startswith("https://cafef.vn/")
          print("Cache validated:",len(cache["symbols"]),"symbols")
          PY
      - name: Commit public-source cache only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cafef-cache.json
          if git diff --cached --quiet; then
            echo "No source update"
            exit 0
          fi
          git commit -m "data: refresh CafeF public BCTC and news cache [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
