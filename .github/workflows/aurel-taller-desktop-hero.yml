name: AUREL taller desktop hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-taller-desktop-hero.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make only desktop horizontal hero taller
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R120_TALLER_DESKTOP_HERO">
          /* R120 — chỉ chỉnh khung ảnh ngang trang Tổng quan trên desktop/tablet.
             Mục tiêu: tăng chiều cao hiển thị để các tòa nhà trông cao, rõ và cân đối hơn
             giống cảm giác trên giao diện điện thoại. Mobile giữ nguyên. */
          @media (min-width:1101px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:420px!important;
              min-height:420px!important;
              max-height:420px!important;
              overflow:hidden!important;
            }
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap,
            body:has(#nav button[data-page="overview"].active)
            .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img{
              height:100%!important;
              min-height:100%!important;
              max-height:100%!important;
            }
          }

          @media (min-width:1440px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:455px!important;
              min-height:455px!important;
              max-height:455px!important;
            }
          }

          @media (min-width:761px) and (max-width:1100px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:350px!important;
              min-height:350px!important;
              max-height:350px!important;
              overflow:hidden!important;
            }
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R120_TALLER_DESKTOP_HERO">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Make desktop overview hero taller"
          git push
