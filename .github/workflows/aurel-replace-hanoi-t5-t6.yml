name: AUREL replace Hanoi T5 T6 hero images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-replace-hanoi-t5-t6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only T5 and T6 horizontal hero images
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("financial-intelligence.html")
          s = p.read_text(encoding="utf-8")

          t5 = "https://aurel-assets-20260929.floot.app/_cdn/static/3a3f1d3e-d848-4d8b-9d49-7f11ddb871f1-aurel_t5_hanoi_hero_user_exact_20261001.webp"
          t6 = "https://aurel-assets-20260929.floot.app/_cdn/static/d8f2c217-e524-4c8a-9c7b-8199370353bd-aurel_t6_hanoi_hero_user_exact_20261001.webp"

          # 1) Replace only the T5/T6 hero URLs in the slideshow source.
          s, n5 = re.subn(
              r"https://aurel-assets-20260929\.floot\.app/_cdn/static/[^'\"\s]*aurel_t5_hanoi_hero_fulltext_20261001\.png[^'\"\s]*",
              t5,
              s
          )
          s, n6 = re.subn(
              r"https://aurel-assets-20260929\.floot\.app/_cdn/static/[^'\"\s]*aurel_t6_hanoi_hero_night_20261001\.png[^'\"\s]*",
              t6,
              s
          )

          # 2) Keep the existing exact-fit rules, but point their src selectors at the new assets.
          s = s.replace(
              'src*="aurel_t5_hanoi_hero_fulltext_20261001.png"',
              'src*="aurel_t5_hanoi_hero_user_exact_20261001.webp"'
          )
          s = s.replace(
              'src*="aurel_t6_hanoi_hero_night_20261001.png"',
              'src*="aurel_t6_hanoi_hero_user_exact_20261001.webp"'
          )

          # 3) The new images already contain the requested wording. Remove the temporary HTML overlay
          #    from the previous fix so the text is not duplicated.
          s = re.sub(
              r'<style id="AUREL_R117_HANOI_HERO_COPY">[\s\S]*?</style>\s*',
              '',
              s,
              count=1
          )
          s = re.sub(
              r'<script id="AUREL_R117_HANOI_HERO_COPY_JS">[\s\S]*?</script>\s*',
              '',
              s,
              count=1
          )

          if n5 < 1:
              raise SystemExit("Không tìm thấy URL hero T5 hiện tại để thay.")
          if n6 < 1:
              raise SystemExit("Không tìm thấy URL hero T6 hiện tại để thay.")

          p.write_text(s, encoding="utf-8")
          print("T5 replacements:", n5)
          print("T6 replacements:", n6)

      - name: Commit patch
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Replace Hanoi T5 and T6 horizontal hero images"
          git push
