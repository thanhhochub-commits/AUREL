name: AUREL inspect comparison chart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-inspect-compare-chart.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract comparison chart code
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          terms=["compare-viz-row","compare-plot","compare-viz-track","compare-zero","compare-viz-axis"]
          out=[]
          for t in terms:
            start=0
            count=0
            while count<8:
              i=s.find(t,start)
              if i<0: break
              out.append(f"=== {t} @ {i} ===\n"+s[max(0,i-1800):min(len(s),i+4200)])
              start=i+len(t)
              count+=1
          Path("compare_chart_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add compare_chart_debug.txt
          git commit -m "Temporary comparison chart inspection"
          git push
