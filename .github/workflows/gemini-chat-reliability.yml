name: AUREL Gemini chat reliability
on:
  push:
    paths:
      - server.py
      - financial-intelligence.html
      - tests/test_gemini_chat_reliability.py
      - .github/workflows/gemini-chat-reliability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gemini-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m py_compile server.py
      - name: Test Gemini reliability with mocked HTTP responses
        run: python -m unittest discover -s tests -p 'test_gemini_chat_reliability.py' -v
      - name: Verify syntax of embedded frontend JavaScript
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          html=Path('financial-intelligence.html').read_text('utf-8')
          payload=re.search(r'const b="([A-Za-z0-9+/=]+)"',html)
          assert payload, 'AUREL embedded JS missing'
          Path('/tmp/aurel-main.js').write_bytes(base64.b64decode(payload.group(1),validate=True))
          PY
          node --check /tmp/aurel-main.js
