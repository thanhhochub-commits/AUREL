name: AUREL fix comparison chart alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-fix-compare-chart-alignment.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild only comparison bar-chart presentation
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R125_COMPARE_REAL_CHART_ALIGN">
          /* R125 — chỉ sửa biểu đồ Đối chiếu ngân hàng:
             cùng một hệ trục, cùng điểm bắt đầu, cùng chiều rộng vùng vẽ. */

          body:has(#nav button[data-page="comparison"].active) .compare-plot{
            padding:20px 18px 16px!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-list{
            display:grid!important;
            gap:12px!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-row{
            display:grid!important;
            grid-template-columns:74px minmax(0,1fr) 86px!important;
            align-items:center!important;
            column-gap:10px!important;
            min-height:38px!important;
            padding:0!important;
            border:0!important;
            border-left:0!important;
            border-radius:0!important;
            background:transparent!important;
            box-shadow:none!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-row:hover{
            background:transparent!important;
            filter:none!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-name{
            width:74px!important;
            min-width:74px!important;
            max-width:74px!important;
            padding:0 2px!important;
            overflow:hidden!important;
            text-overflow:ellipsis!important;
            white-space:nowrap!important;
            font-size:12px!important;
            font-weight:850!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-track{
            position:relative!important;
            width:100%!important;
            height:34px!important;
            min-width:0!important;
            border-radius:6px!important;
            border:1px solid rgba(129,157,178,.36)!important;
            background:
              linear-gradient(to right,
                transparent 24.75%,rgba(123,148,168,.16) 25%,transparent 25.25%,
                transparent 49.75%,rgba(123,148,168,.16) 50%,transparent 50.25%,
                transparent 74.75%,rgba(123,148,168,.16) 75%,transparent 75.25%),
              linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0))!important;
            box-shadow:none!important;
            overflow:visible!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-zero{
            top:-1px!important;
            bottom:-1px!important;
            z-index:3!important;
            border-left:1px solid #8196a8!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-bar{
            top:7px!important;
            height:18px!important;
            border-radius:4px 999px 999px 4px!important;
            min-width:2px!important;
            box-shadow:none!important;
            z-index:2!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-dot{
            display:none!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-number{
            width:86px!important;
            min-width:86px!important;
            max-width:86px!important;
            text-align:right!important;
            padding:0!important;
            font-variant-numeric:tabular-nums!important;
            font-size:12.5px!important;
            font-weight:900!important;
            line-height:1!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-viz-axis{
            position:relative!important;
            display:flex!important;
            justify-content:space-between!important;
            align-items:center!important;
            margin:8px 96px 0 84px!important;
            padding-top:7px!important;
            border-top:1px solid rgba(129,157,178,.34)!important;
            color:#7890a1!important;
            font-size:10px!important;
            line-height:1!important;
            font-variant-numeric:tabular-nums!important;
          }

          body:has(#nav button[data-page="comparison"].active) .compare-axis-zero{
            top:7px!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-viz-track{
            border-color:#344a5e!important;
            background:
              linear-gradient(to right,
                transparent 24.75%,rgba(130,157,179,.15) 25%,transparent 25.25%,
                transparent 49.75%,rgba(130,157,179,.15) 50%,transparent 50.25%,
                transparent 74.75%,rgba(130,157,179,.15) 75%,transparent 75.25%),
              linear-gradient(180deg,#142231,#101b28)!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-zero{
            border-left-color:#8398aa!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-viz-bar.first{
            background:linear-gradient(90deg,#2b80f7,#4d9cff)!important;
            border:1px solid #5aa5ff!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-viz-bar.second{
            background:linear-gradient(90deg,#15a89c,#2fc7b3)!important;
            border:1px solid #48d0bf!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-viz-axis{
            border-top-color:#344a5e!important;
            color:#9bb0c1!important;
          }

          @media(max-width:640px){
            body:has(#nav button[data-page="comparison"].active) .compare-viz-row{
              grid-template-columns:54px minmax(0,1fr) 70px!important;
              column-gap:7px!important;
            }
            body:has(#nav button[data-page="comparison"].active) .compare-viz-name{
              width:54px!important;
              min-width:54px!important;
              max-width:54px!important;
              font-size:10.5px!important;
            }
            body:has(#nav button[data-page="comparison"].active) .compare-viz-number{
              width:70px!important;
              min-width:70px!important;
              max-width:70px!important;
              font-size:10.5px!important;
            }
            body:has(#nav button[data-page="comparison"].active) .compare-viz-axis{
              margin:8px 77px 0 61px!important;
              font-size:9px!important;
            }
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R125_COMPARE_REAL_CHART_ALIGN">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Align bank comparison bars as a real chart"
          git push
