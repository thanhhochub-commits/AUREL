name: AUREL enlarge horizontal hero frame

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-enlarge-hero-frame.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge only the overview horizontal hero frame
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("financial-intelligence.html")
          s = p.read_text(encoding="utf-8")

          css = r'''
          <style id="AUREL_R119_OVERVIEW_HERO_LARGER">
          /* R119 — chỉ tăng chiều cao khung ảnh ngang trang Tổng quan.
             Giữ nguyên ảnh T1-T8, slideshow, sidebar, dữ liệu và toàn bộ phần còn lại. */
          body:has(#nav button[data-page="overview"].active) .ref-hero{
            height:360px!important;
            min-height:360px!important;
            max-height:360px!important;
          }

          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap{
            height:100%!important;
            min-height:100%!important;
            max-height:100%!important;
          }

          body:has(#nav button[data-page="overview"].active)
          .ref-hero > .aurel-r78-slider-wrap > .aurel-r78-slider-img{
            width:100%!important;
            height:100%!important;
            min-width:100%!important;
            min-height:100%!important;
            max-width:100%!important;
            max-height:100%!important;
          }

          @media (min-width:1440px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:390px!important;
              min-height:390px!important;
              max-height:390px!important;
            }
          }

          @media (max-width:1100px) and (min-width:761px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:330px!important;
              min-height:330px!important;
              max-height:330px!important;
            }
          }

          @media (max-width:760px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:260px!important;
              min-height:260px!important;
              max-height:260px!important;
            }
          }

          @media (max-width:480px){
            body:has(#nav button[data-page="overview"].active) .ref-hero{
              height:225px!important;
              min-height:225px!important;
              max-height:225px!important;
            }
          }
          </style>
          '''

          pat = re.compile(r'<style id="AUREL_R119_OVERVIEW_HERO_LARGER">[\s\S]*?</style>\s*', re.M)
          if pat.search(s):
              s = pat.sub(css.strip() + "\n", s, count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s = s.replace("</body>", css.strip() + "\n</body>", 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Enlarge overview horizontal hero frame"
          git push
