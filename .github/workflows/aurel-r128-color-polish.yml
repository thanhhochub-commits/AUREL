name: AUREL R128 color polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-r128-color-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply color polish to non-overview functional pages
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R128_COLOR_POLISH">
          /* R128 — color polish for all non-overview functional pages.
             Presentation only: no data, formulas, JS logic, or overview changes. */

          /* ---------- LIGHT MODE ---------- */
          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ){
            position:relative!important;
            overflow:hidden!important;
            border-color:#c4d7e4!important;
            background:linear-gradient(180deg,#ffffff 0%,#f8fbfd 100%)!important;
            box-shadow:
              0 8px 22px rgba(24,68,100,.065),
              0 0 20px rgba(59,130,246,.045)!important;
          }

          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          )::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            top:0!important;
            right:0!important;
            height:3px!important;
            background:linear-gradient(90deg,#3b82f6,#20b8b0)!important;
            opacity:.92!important;
            pointer-events:none!important;
          }

          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ):nth-child(3n+2)::before{
            background:linear-gradient(90deg,#20b8b0,#58c7c0)!important;
          }
          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ):nth-child(3n)::before{
            background:linear-gradient(90deg,#f0b95a,#e79a2e)!important;
          }

          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .result-card,.sim-card
          ):hover{
            transform:translateY(-1px)!important;
            border-color:#a9c7da!important;
            box-shadow:
              0 12px 26px rgba(24,68,100,.085),
              0 0 24px rgba(59,130,246,.055)!important;
          }

          /* Simulation/result panels */
          body:not(.aurel-dark-theme):not(:has(#nav button[data-page="overview"].active)) :is(
            .simulation-summary,.simulation-results,.simulation-result,.scenario-result,.result-panel
          ) :is(.metric,.card,.result-card,.sim-card){
            background:linear-gradient(180deg,#ffffff 0%,#f6fafc 100%)!important;
            border-color:#c7d9e5!important;
            box-shadow:
              0 8px 20px rgba(25,72,104,.06),
              0 0 18px rgba(32,184,176,.04)!important;
          }

          /* ---------- DARK MODE ---------- */
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ){
            position:relative!important;
            overflow:hidden!important;
            border-color:#314b60!important;
            background:linear-gradient(180deg,#111d2a 0%,#0d1722 100%)!important;
            box-shadow:
              0 10px 26px rgba(0,0,0,.23),
              0 0 22px rgba(77,156,255,.065)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          )::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            top:0!important;
            right:0!important;
            height:3px!important;
            background:linear-gradient(90deg,#4d9cff,#2fc7b3)!important;
            opacity:.95!important;
            pointer-events:none!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ):nth-child(3n+2)::before{
            background:linear-gradient(90deg,#2fc7b3,#5ed8ca)!important;
          }
          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .scenario-control,.pdf-intro-card,.pdf-intro-main,.ai-key-panel,.result-card,.sim-card
          ):nth-child(3n)::before{
            background:linear-gradient(90deg,#f0b95a,#e8a448)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .metric,.kpi,.compare-kpi,.monitor-card,.dataset-card,.analysis-feature,
            .result-card,.sim-card
          ):hover{
            transform:translateY(-1px)!important;
            border-color:#3e6079!important;
            box-shadow:
              0 13px 30px rgba(0,0,0,.27),
              0 0 26px rgba(77,156,255,.08)!important;
          }

          body.aurel-dark-theme:not(:has(#nav button[data-page="overview"].active)) :is(
            .simulation-summary,.simulation-results,.simulation-result,.scenario-result,.result-panel
          ) :is(.metric,.card,.result-card,.sim-card){
            background:linear-gradient(180deg,#111d2a 0%,#0c1620 100%)!important;
            border-color:#314b60!important;
            box-shadow:
              0 10px 24px rgba(0,0,0,.24),
              0 0 20px rgba(47,199,179,.06)!important;
          }

          /* ---------- RANGE SLIDERS: scenario page, both themes ---------- */
          body:has(#nav button[data-page="scenario"].active) input[type="range"]{
            --range-pct:50%;
            width:100%!important;
            height:9px!important;
            border:0!important;
            border-radius:999px!important;
            outline:none!important;
            appearance:none!important;
            -webkit-appearance:none!important;
            cursor:pointer!important;
          }

          body:not(.aurel-dark-theme):has(#nav button[data-page="scenario"].active) input[type="range"]{
            background:
              linear-gradient(90deg,#20b8b0 0%,#3b82f6 var(--range-pct),#dbe7ef var(--range-pct),#dbe7ef 100%)!important;
            box-shadow:inset 0 1px 2px rgba(0,0,0,.09),0 0 0 1px rgba(90,130,158,.17)!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="scenario"].active) input[type="range"]{
            background:
              linear-gradient(90deg,#20c7bb 0%,#4d9cff var(--range-pct),#203244 var(--range-pct),#203244 100%)!important;
            box-shadow:inset 0 1px 2px rgba(0,0,0,.42),0 0 0 1px rgba(82,112,138,.30),0 0 14px rgba(77,156,255,.06)!important;
          }

          body:has(#nav button[data-page="scenario"].active) input[type="range"]::-webkit-slider-runnable-track{
            height:9px!important;
            border-radius:999px!important;
            background:transparent!important;
          }
          body:has(#nav button[data-page="scenario"].active) input[type="range"]::-webkit-slider-thumb{
            -webkit-appearance:none!important;
            appearance:none!important;
            width:21px!important;
            height:21px!important;
            margin-top:-6px!important;
            border-radius:50%!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="scenario"].active) input[type="range"]::-webkit-slider-thumb{
            border:3px solid #fff!important;
            background:linear-gradient(145deg,#1a86a0,#145b78)!important;
            box-shadow:0 0 0 1px rgba(25,88,112,.30),0 4px 12px rgba(16,72,96,.24),0 0 14px rgba(32,184,176,.18)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="scenario"].active) input[type="range"]::-webkit-slider-thumb{
            border:3px solid #d8f5f1!important;
            background:linear-gradient(145deg,#27b9b1,#196f82)!important;
            box-shadow:0 0 0 1px #4ad0c1,0 4px 12px rgba(0,0,0,.38),0 0 16px rgba(47,199,179,.24)!important;
          }

          body:not(.aurel-dark-theme):has(#nav button[data-page="scenario"].active) input[type="range"]::-moz-range-track{
            height:9px!important;border-radius:999px!important;background:#dbe7ef!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="scenario"].active) input[type="range"]::-moz-range-progress{
            height:9px!important;border-radius:999px!important;background:linear-gradient(90deg,#20b8b0,#3b82f6)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="scenario"].active) input[type="range"]::-moz-range-track{
            height:9px!important;border-radius:999px!important;background:#203244!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="scenario"].active) input[type="range"]::-moz-range-progress{
            height:9px!important;border-radius:999px!important;background:linear-gradient(90deg,#20c7bb,#4d9cff)!important;
          }

          /* Preserve comparison chart geometry: presentation glow only */
          body:not(.aurel-dark-theme):has(#nav button[data-page="comparison"].active) .compare-pair-visual,
          body:not(.aurel-dark-theme):has(#nav button[data-page="comparison"].active) .compare-all-panel{
            box-shadow:0 9px 24px rgba(36,95,135,.07),0 0 20px rgba(59,130,246,.04)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-pair-visual,
          body.aurel-dark-theme:has(#nav button[data-page="comparison"].active) .compare-all-panel{
            box-shadow:0 11px 28px rgba(0,0,0,.24),0 0 22px rgba(77,156,255,.06)!important;
          }
          </style>
          '''

          js=r'''
          <script id="AUREL_R128_RANGE_SYNC">
          (function(){
            function syncRange(el){
              if(!el||el.type!=='range') return;
              var min=parseFloat(el.min), max=parseFloat(el.max), val=parseFloat(el.value);
              if(!isFinite(min)) min=0;
              if(!isFinite(max)) max=100;
              if(!isFinite(val)) val=min;
              var pct=max===min?0:((val-min)/(max-min))*100;
              pct=Math.max(0,Math.min(100,pct));
              el.style.setProperty('--range-pct',pct+'%');
            }
            function init(){
              document.querySelectorAll('input[type="range"]').forEach(function(el){
                syncRange(el);
                if(el.dataset.aurelR128==='1') return;
                el.dataset.aurelR128='1';
                el.addEventListener('input',function(){syncRange(el);});
                el.addEventListener('change',function(){syncRange(el);});
              });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true});
            else init();
            var root=document.getElementById('root')||document.body;
            if(root) new MutationObserver(init).observe(root,{childList:true,subtree:true});
          })();
          </script>
          '''

          css_pat=re.compile(r'<style id="AUREL_R128_COLOR_POLISH">[\s\S]*?</style>\s*',re.M)
          js_pat=re.compile(r'<script id="AUREL_R128_RANGE_SYNC">[\s\S]*?</script>\s*',re.M)

          if css_pat.search(s):
              s=css_pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s: raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          if js_pat.search(s):
              s=js_pat.sub(js.strip()+"\n",s,count=1)
          else:
              s=s.replace("</body>",js.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit website update
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Polish sliders and colored cards across non-overview pages"
          git push
