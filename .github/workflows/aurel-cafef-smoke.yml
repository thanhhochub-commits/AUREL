name: AUREL CafeF Connection Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aurel-cafef-smoke.yml"
      - "assets/aurel-cafef.js"
      - "assets/cafef-cache.json"
      - "financial-intelligence.html"

permissions:
  contents: read

jobs:
  cafef-browser-path:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser-side script
        run: |
          node --check assets/aurel-cafef.js
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path('financial-intelligence.html').read_text('utf-8')
          js=Path('assets/aurel-cafef.js').read_text('utf-8')
          feed=json.loads(Path('assets/cafef-cache.json').read_text('utf-8'))
          assert "assets/aurel-cafef.js?v=20261008-CF-FULLBLEED-V12" in html
          assert "width:0!important;min-width:0!important;max-width:0!important;" in js
          assert "cfBindSlideBackdrop(hero)" in js
          assert "new MutationObserver(sync)" in js
          assert "--cf-slide-background" in js
          assert "row.insertAdjacentElement(\'afterend\',hint)" in js
          assert "#root > .aurel-cafef-hero-row + .cf-swipe-hint" in js
          assert "object-fit:cover!important;" in js
          assert "aspect-ratio:auto!important;" in js
          assert "width:100%!important;" in js
          assert "row.nextElementSibling" in js
          assert "visible!important" in js
          assert "← Kéo sang trái để mở CafeF" in js
          assert "cf-swipe-hint{display:none!important}" in js
          assert "cfInstallHeroSwipe(row)" in js
          assert "setPointerCapture" in js and "cfSetPanel" in js
          assert "--cfh:clamp(430px,37.5vw,605px)" in js
          assert "--cf-panel-default:calc((100% - 14px) * .39)" in js
          assert "cf-resize-toggle" not in js and "cf-resize-grip" not in js
          assert "Kéo sang trái để mở CafeF" in js
          assert "Kéo sang phải để ẩn CafeF" in js
          assert "data-view" in js
          assert "group.hidden=!visible" in js
          assert ".cf-feed .cf-group[hidden]{display:none!important}" in js
          assert "hero.setPointerCapture(e.pointerId)" in js
          assert "grid-template-columns:minmax(0,1fr) 0px!important" in js
          assert "aurel-cafef-panel-hidden-v1" in js
          assert 'async function loadFromStatic(symbol)' in js
          assert 'readStaticSnapshot' in js
          assert 'aurel-page-overview' in js
          assert feed['source']=='CafeF'
          for symbol in ['VPB','VCB','ACB','MBB','TCB']:
              assert symbol in feed['symbols']
              news=feed['symbols'][symbol]['disclosures']
              assert len(news)>=1, (symbol, news)
              assert all(item['url'].startswith('https://cafef.vn/') for item in news)
              print(symbol, "verified company disclosures:", len(news))
          print("PASS: source-validated cache & JS syntax")
          PY
      - name: Verify public cache URL for browser access and backend diagnosis
        run: |
          python - <<'PY'
          import urllib.request, json
          raw='https://raw.githubusercontent.com/thanhhochub-commits/AUREL/main/assets/cafef-cache.json'
          req=urllib.request.Request(raw,headers={'Origin':'https://thanhhochub-commits.github.io','User-Agent':'AUREL-Cache-Smoke/1.0'})
          with urllib.request.urlopen(req,timeout=18) as resp:
              payload=json.loads(resp.read(500000))
              cors=resp.headers.get('access-control-allow-origin','')
              print('GitHub raw:',resp.status,'CORS:',repr(cors),'symbol count:',len(payload['symbols']))
              assert resp.status==200 and 'VPB' in payload['symbols']
              assert cors in ('*','https://thanhhochub-commits.github.io'), 'Raw cache lacks CORS permission'
          url='https://aurel-thanhhochub-backend.onrender.com/api/cafef?symbol=VPB'
          try:
              with urllib.request.urlopen(url,timeout=22) as response:
                  print('Render CafeF endpoint:',response.status)
          except Exception as exc:
              print('Render CafeF endpoint unavailable; static fallback required:',str(exc)[:170])
          PY
