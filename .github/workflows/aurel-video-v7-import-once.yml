name: AUREL video V7 import
on:
  push:
    paths:
      - .github/workflows/aurel-video-v7-import-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AUREL
        uses: actions/checkout@v4
      - name: Reproduce approved 1280x1466 silent video V7 from clean source
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -y \
            -i assets/login-city-bg.mp4 \
            -vf 'hqdn3d=0.6:0.6:1.2:1.2,scale=1280:1466:flags=lanczos,unsharp=7:7:1.0:7:7:0.0,eq=contrast=1.08:brightness=0.01:saturation=1.05' \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -movflags +faststart -an assets/login-city-bg-sharp-plus.mp4
          test -s assets/login-city-bg-sharp-plus.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -of default=nw=1 assets/login-city-bg-sharp-plus.mp4
          if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 assets/login-city-bg-sharp-plus.mp4 | grep -q .; then
            echo 'Unexpected audio stream' >&2
            exit 1
          fi
      - name: Commit final web video asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/login-city-bg-sharp-plus.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Add improved 1280x1466 silent AUREL login video'
            git pull --rebase origin main
            git push
          fi
