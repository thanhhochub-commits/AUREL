name: AUREL login video asset
on:
  push:
    paths:
      - .github/workflows/aurel-login-video-upload.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-login-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved muted AUREL video
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error             'https://a0a24ede-26af-4f51-9da6-dd850910b788.sandbox.floot.app/_cdn/static/09a57d15-d6b4-4938-938b-7fd058d4b3e4-aurel-login-hcm.mp4'             --output assets/login-city-bg.mp4
          test "$(stat -c%s assets/login-city-bg.mp4)" -eq 3677037
          file assets/login-city-bg.mp4
      - name: Commit video to AUREL repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/login-city-bg.mp4
          git diff --cached --quiet || (git commit -m 'Add silent HCM login background video' && git push)
