name: AUREL light crumb unframe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurel-light-crumb-unframe.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove light-mode crumb outer frame only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("financial-intelligence.html")
          s = p.read_text(encoding="utf-8")

          block = r'''
          <style id="AUREL_R116_LIGHT_CRUMB_UNFRAMED">
          /* R116 — chỉ bỏ khung ngoài tiêu đề tab ở LIGHT MODE, giữ nguyên icon/chữ/chức năng. */
          body:not(.aurel-dark-theme) .crumb{
            padding:0!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            box-shadow:none!important;
          }
          body:not(.aurel-dark-theme) .crumb-icon{
            background:linear-gradient(145deg,#E4F0FB,#E8F5F3)!important;
            border:1px solid #B9D0E1!important;
            color:#2563A7!important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.8)!important;
          }
          body:not(.aurel-dark-theme) .crumb strong,
          body:not(.aurel-dark-theme) #crumb-title{
            color:#143A57!important;
            -webkit-text-fill-color:#143A57!important;
            text-shadow:none!important;
          }
          body:not(.aurel-dark-theme) .crumb small{
            color:#6A8395!important;
            -webkit-text-fill-color:#6A8395!important;
            text-shadow:none!important;
          }
          @media(max-width:900px){
            body:not(.aurel-dark-theme) .crumb{
              padding:0!important;
            }
          }
          </style>
          '''

          pat = re.compile(r'<style id="AUREL_R116_LIGHT_CRUMB_UNFRAMED">[\s\S]*?</style>\s*', re.M)
          if pat.search(s):
              s = pat.sub(block.strip() + "\n", s, count=1)
          else:
              marker = "</head>"
              if marker not in s:
                  raise SystemExit("Không tìm thấy </head>")
              s = s.replace(marker, block.strip() + "\n" + marker, 1)

          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Remove light topbar title outer frame"
          git push
