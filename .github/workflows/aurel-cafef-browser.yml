name: AUREL CafeF Browser Layout
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aurel-cafef-browser.yml"
      - "assets/aurel-cafef.js"
      - "financial-intelligence.html"

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate actual desktop and mobile DOM, image fit, tabs and swipe
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const url='https://thanhhochub-commits.github.io/AUREL/financial-intelligence.html?cfBrowserCheck=1';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#aurel-cafef-overview').waitFor({state:'attached',timeout:30000}).catch(async error=>{
              console.error('LIVE PAGE DIAGNOSTICS',await page.evaluate(()=>({title:document.title,root:!!document.getElementById('root'),rootText:(document.getElementById('root')?.textContent||'').slice(0,400),bodyClass:document.body.className})),errors.slice(0,12));
              throw error;
            });
            await page.waitForTimeout(1300);
            async function measure(){
              return await page.evaluate(()=>{
                const row=document.querySelector('#root > .aurel-cafef-hero-row');
                const hero=row.querySelector('.ref-hero');
                const cafe=row.querySelector('#aurel-cafef-overview');
                const wrap=hero.querySelector('.aurel-r78-slider-wrap');
                const img=wrap?.querySelector('.aurel-r78-slider-img');
                const hint=row.nextElementSibling;
                const bg=wrap?getComputedStyle(wrap,'::before').backgroundImage:'';
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}};
                return {row:rect(row),hero:rect(hero),cafe:rect(cafe),hint:hint?rect(hint):null,
                  hintText:hint?.textContent, hintAlign:hint?getComputedStyle(hint).justifyContent:null, closed:row.dataset.cfClosed,
                  objectFit:img?getComputedStyle(img).objectFit:null,
                  bg:bg.slice(0,110),overflow:document.documentElement.scrollWidth-innerWidth,
                  hasButton:!!row.querySelector('.cf-resize-grip,.cf-resize-toggle')};
              });
            }
            const open=await measure();
            console.log('DESKTOP OPEN',JSON.stringify(open));
            await page.screenshot({path:'aurel-cafef-open.png'});
            assert.equal(open.objectFit,'cover');
            assert.ok(Math.abs(open.hero.height-512.25)<12,'unexpected hero frame height');
            assert.ok(open.bg.includes('url('),'dynamic backdrop missing');
            assert.ok(open.hint.y>=open.hero.bottom-1,'swipe caption is not below hero');
            assert.equal(open.hintAlign,'flex-end','swipe hint must remain aligned right');
            assert.ok(open.cafe.width>300,'CafeF panel width unexpectedly narrow');
            assert.equal(open.hasButton,false,'previous blue slider remains');
            await page.locator('#aurel-cafef-overview .cf-tab[data-tab="news"]').click();
            let tabs=await page.evaluate(()=>Array.from(document.querySelectorAll('#aurel-cafef-overview .cf-group')).map(x=>({name:x.dataset.view,hidden:x.hidden})));
            console.log('NEWS TAB',JSON.stringify(tabs));
            assert.deepEqual(tabs,[{name:'reports',hidden:true},{name:'news',hidden:false}]);
            await page.locator('#aurel-cafef-overview .cf-tab[data-tab="reports"]').click();
            tabs=await page.evaluate(()=>Array.from(document.querySelectorAll('#aurel-cafef-overview .cf-group')).map(x=>({name:x.dataset.view,hidden:x.hidden})));
            assert.deepEqual(tabs,[{name:'reports',hidden:false},{name:'news',hidden:true}]);
            await page.locator('#root > .aurel-cafef-hero-row > .ref-hero').focus();
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(450);
            const hidden=await measure();
            console.log('DESKTOP HIDDEN',JSON.stringify(hidden));
            await page.screenshot({path:'aurel-cafef-hidden.png'});
            assert.equal(hidden.closed,'true');
            assert.ok(hidden.hero.width>open.hero.width+100,'hero did not widen');
            assert.equal(hidden.objectFit,'cover','hidden full-width frame should remain full-bleed');
            assert.equal(hidden.cafe.width,0,'closed CafeF should be fully collapsed');
            const slideCheck=await page.evaluate(()=>Array.from(document.querySelectorAll('#root > .aurel-cafef-hero-row .ref-hero .aurel-r78-slider-img')).map(img=>{
              const r=img.getBoundingClientRect(),hero=img.parentElement.getBoundingClientRect();
              return {fit:getComputedStyle(img).objectFit, width:r.width, height:r.height,
                      heroWidth:hero.width,heroHeight:hero.height,url:img.getAttribute('src')?.slice(-62)}
            }));
            console.log('HERO SLIDE GEOMETRY',JSON.stringify(slideCheck));

            // Verify each of the four daytime pictures has no legacy per-image
            // horizontal/vertical scale, including images not currently on screen.
            const lightFiles=[
              'aurel_t1_horizontal_user_20261001.png',
              'aurel_t3_horizontal_user_20261001.png',
              'aurel_t5_horizontal_user_20261001.png',
              'aurel_t7_horizontal_user_20261001.png'
            ];
            const fourSlides=await page.evaluate(names=>{
              const wrap=document.querySelector('#root > .aurel-cafef-hero-row .ref-hero .aurel-r78-slider-wrap');
              const outer=wrap.getBoundingClientRect();
              return names.map(filename=>{
                const probe=document.createElement('img');
                probe.className='aurel-r78-slider-img';
                probe.setAttribute('src','data:image/svg+xml,%3Csvg/%3E#'+filename);
                probe.style.visibility='hidden';
                wrap.appendChild(probe);
                const r=probe.getBoundingClientRect(),c=getComputedStyle(probe);
                const result={filename, fit:c.objectFit, scale:c.scale, x:r.x, y:r.y,
                  width:r.width, height:r.height, parentWidth:outer.width,parentHeight:outer.height};
                probe.remove();
                return result;
              });
            },lightFiles);
            console.log('FOUR ORIGINAL HERO PHOTO GEOMETRIES',JSON.stringify(fourSlides));
            fourSlides.forEach(slide=>{
              assert.equal(slide.fit,'cover','hero photo must cover frame');
              assert.ok(Math.abs(slide.width-slide.parentWidth)<2,'photo has unexpected horizontal scale: '+slide.filename);
              assert.ok(Math.abs(slide.height-slide.parentHeight)<2,'photo has unexpected vertical scale: '+slide.filename);
            });

            assert.equal(slideCheck.length,2,'two-frame slider changed');
            slideCheck.forEach(img=>{
              assert.equal(img.fit,'cover');
              assert.ok(Math.abs(img.width-img.heroWidth)<2,'slide not spanning frame width');
              assert.ok(Math.abs(img.height-img.heroHeight)<2,'slide not spanning frame height');
            });
            assert.ok(hidden.hintText.includes('Kéo sang trái để mở CAFEF'));
            // Simulate an actual swipe from the hero to open, not just a key press.
            const start=await page.locator('#root > .aurel-cafef-hero-row > .ref-hero').boundingBox();
            const x=start.x+Math.floor(start.width*.72),y=start.y+Math.floor(start.height*.63);
            await page.mouse.move(x,y);
            await page.mouse.down();
            await page.mouse.move(x-155,y,{steps:12});
            await page.mouse.up();
            await page.waitForTimeout(500);
            const reopened=await measure();
            console.log('DESKTOP REOPENED BY SWIPE',JSON.stringify(reopened));
            assert.equal(reopened.closed,'false');
            assert.ok(reopened.hero.width<hidden.hero.width-100);
            // Existing mobile layout must remain stacked.
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(300);
            const mobile=await page.evaluate(()=>{const r=document.querySelector('.aurel-cafef-hero-row');return {display:getComputedStyle(r).display,hero:r.querySelector('.ref-hero').getBoundingClientRect().width,hasHint: getComputedStyle(r.nextElementSibling).display};});
            console.log('MOBILE',JSON.stringify(mobile));
            assert.equal(mobile.display,'flex');
            assert.equal(mobile.hasHint,'none');
            // Real wheel and touchscreen gesture regression: detect page-scroll lock.
            const desktopScroll=await browser.newPage({viewport:{width:1366,height:768}});
            await desktopScroll.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await desktopScroll.locator('#root').waitFor({state:'attached'});
            await desktopScroll.waitForTimeout(700);
            const desktopBefore=await desktopScroll.evaluate(()=>document.scrollingElement.scrollTop);
            await desktopScroll.mouse.move(720,550);
            await desktopScroll.mouse.wheel(0,650);
            await desktopScroll.waitForTimeout(550);
            const desktopAfter=await desktopScroll.evaluate(()=>document.scrollingElement.scrollTop);
            console.log('DESKTOP SCROLL',JSON.stringify({desktopBefore,desktopAfter}));
            assert.ok(desktopAfter>desktopBefore+30,'desktop wheel scrolling is blocked');
            // Repeated desktop navigation: active tab and content must agree.
            for(const target of ['ai','analysis','comparison','monitor','scenario','overview','data','report','overview']){
              const t0=Date.now();
              await desktopScroll.evaluate(name=>document.querySelector('#nav button[data-page="'+name+'"]').click(),target);
              await desktopScroll.waitForFunction(name=>{
                const b=document.querySelector('#nav button[data-page="'+name+'"]');
                const all=document.querySelectorAll('#nav button.active[data-page]');
                return b&&b.classList.contains('active')&&all.length===1&&!!document.querySelector('#root')?.firstElementChild;
              },target,{timeout:5000});
              await desktopScroll.waitForFunction(name=>{
                const titles={ai:'Phân tích cùng AI AUREL',analysis:'Phân tích chỉ số',comparison:'Đối chiếu ngân hàng',monitor:'Giám sát rủi ro',scenario:'Phân tích kịch bản',overview:'Tổng quan tài chính',data:'Nguồn dữ liệu',report:'Báo cáo'};
                return document.querySelector('#crumb-title')?.textContent===titles[name];
              },target,{timeout:5000});
              console.log('DESKTOP TAB RENDERED',target,'latency_ms',Date.now()-t0);
            }
            // Rapid clicks in a single event task must end at the requested tab.
            await desktopScroll.evaluate(()=>{
              for(const name of ['comparison','analysis','ai','overview']){
                document.querySelector('#nav button[data-page="'+name+'"]').click();
              }
            });
            await desktopScroll.waitForFunction(()=>document.querySelector('#nav button.active[data-page="overview"]')&&
              document.querySelector('#root > .aurel-cafef-hero-row'),null,{timeout:8000});
            console.log('DESKTOP RAPID TABS PASS');
            await desktopScroll.close();

            const phone=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const phonePage=await phone.newPage();
            await phonePage.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await phonePage.locator('#root > .aurel-cafef-hero-row').waitFor({state:'attached',timeout:30000});
            await phonePage.waitForTimeout(1100);
            const phoneStart=await phonePage.evaluate(()=>({
              top:document.scrollingElement.scrollTop,
              range:document.scrollingElement.scrollHeight-innerHeight,
              rootTouch:getComputedStyle(document.documentElement).touchAction
            }));
            const client=await phone.newCDPSession(phonePage);
            await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:190,y:590}]});
            for(let i=1;i<=14;i++){
              await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:190,y:590-i*24}]});
              await new Promise(resolve=>setTimeout(resolve,20));
            }
            await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await phonePage.waitForTimeout(450);
            const phoneAfter=await phonePage.evaluate(()=>document.scrollingElement.scrollTop);
            console.log('PHONE TOUCH SCROLL',JSON.stringify({phoneStart,phoneAfter}));
            assert.ok(phoneStart.range>150,'mobile test page must have vertical content');
            assert.ok(phoneAfter>phoneStart.top+30,'mobile touch scrolling is blocked');
            // Repeated tab switches must not leave mobile scrolling locked.
            for(let attempt=1;attempt<=4;attempt++){
              await phonePage.evaluate(()=>document.querySelector('#nav button[data-page="ai"]').click());
              await phonePage.locator('#aurel-chat-messages').waitFor({state:'attached',timeout:12000});
              await phonePage.evaluate(()=>document.querySelector('#nav button[data-page="overview"]').click());
              await phonePage.locator('#root > .aurel-cafef-hero-row').waitFor({state:'attached',timeout:12000});
              await phonePage.waitForTimeout(220);
              await phonePage.evaluate(()=>{document.scrollingElement.scrollTop=0;});
              const initial=await phonePage.evaluate(()=>document.scrollingElement.scrollTop);
              await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:190,y:590}]});
              for(let j=1;j<=10;j++){
                await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:190,y:590-j*28}]});
                await new Promise(resolve=>setTimeout(resolve,18));
              }
              await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              await phonePage.waitForTimeout(240);
              const latest=await phonePage.evaluate(()=>document.scrollingElement.scrollTop);
              console.log('PHONE TAB SWITCH SCROLL',JSON.stringify({attempt,initial,latest}));
              assert.ok(latest>initial+24,'touch scroll locked after tab switch '+attempt);
            }
            // Phone: repeated tab switches without waiting for data round trips.
            for(const target of ['ai','analysis','comparison','scenario','monitor','data','overview','ai','overview']){
              const t0=Date.now();
              await phonePage.evaluate(name=>document.querySelector('#nav button[data-page="'+name+'"]').click(),target);
              await phonePage.waitForFunction(name=>{
                const selected=document.querySelector('#nav button.active[data-page]');
                return selected?.dataset.page===name&&!!document.querySelector('#root')?.firstElementChild;
              },target,{timeout:6000});
              await phonePage.waitForFunction(name=>{
                const titles={ai:'Phân tích cùng AI AUREL',analysis:'Phân tích chỉ số',comparison:'Đối chiếu ngân hàng',scenario:'Phân tích kịch bản',monitor:'Giám sát rủi ro',data:'Nguồn dữ liệu',overview:'Tổng quan tài chính'};
                return document.querySelector('#crumb-title')?.textContent===titles[name];
              },target,{timeout:5000});
              console.log('MOBILE TAB RENDERED',target,'latency_ms',Date.now()-t0);
            }
            await phonePage.evaluate(()=>{
              for(const name of ['analysis','data','ai','comparison','overview']){
                document.querySelector('#nav button[data-page="'+name+'"]').click();
              }
            });
            await phonePage.waitForFunction(()=>document.querySelector('#nav button.active[data-page="overview"]')&&
              document.querySelector('#root > .aurel-cafef-hero-row'),null,{timeout:8000});
            console.log('MOBILE RAPID TABS PASS');
            await phone.close();
            if(errors.length)console.log('PAGE ERRORS',JSON.stringify(errors.slice(0,8)));
            await browser.close();
            console.log('BROWSER CHECK PASS: proportion, backdrop, caption, full swipe, tabs, mobile');
          })().catch(e=>{console.error('BROWSER REGRESSION FAILED',e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurel-cafef-browser-screenshots
          path: |
            aurel-cafef-open.png
            aurel-cafef-hidden.png
          if-no-files-found: ignore
          retention-days: 3
