name: AUREL CafeF Browser Layout
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aurel-cafef-browser.yml"
      - "assets/aurel-cafef.js"
      - "financial-intelligence.html"

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate actual desktop and mobile DOM, image fit, tabs and swipe
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const url='https://thanhhochub-commits.github.io/AUREL/financial-intelligence.html?cfBrowserCheck=1';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#aurel-cafef-overview').waitFor({state:'attached',timeout:30000}).catch(async error=>{
              console.error('LIVE PAGE DIAGNOSTICS',await page.evaluate(()=>({title:document.title,root:!!document.getElementById('root'),rootText:(document.getElementById('root')?.textContent||'').slice(0,400),bodyClass:document.body.className})),errors.slice(0,12));
              throw error;
            });
            await page.waitForTimeout(1300);
            async function measure(){
              return await page.evaluate(()=>{
                const row=document.querySelector('#root > .aurel-cafef-hero-row');
                const hero=row.querySelector('.ref-hero');
                const cafe=row.querySelector('#aurel-cafef-overview');
                const wrap=hero.querySelector('.aurel-r78-slider-wrap');
                const img=wrap?.querySelector('.aurel-r78-slider-img');
                const hint=row.nextElementSibling;
                const bg=wrap?getComputedStyle(wrap,'::before').backgroundImage:'';
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}};
                return {row:rect(row),hero:rect(hero),cafe:rect(cafe),hint:hint?rect(hint):null,
                  hintText:hint?.textContent, closed:row.dataset.cfClosed,
                  objectFit:img?getComputedStyle(img).objectFit:null,
                  bg:bg.slice(0,110),overflow:document.documentElement.scrollWidth-innerWidth,
                  hasButton:!!row.querySelector('.cf-resize-grip,.cf-resize-toggle')};
              });
            }
            const open=await measure();
            console.log('DESKTOP OPEN',JSON.stringify(open));
            assert.equal(open.objectFit,'contain');
            assert.ok(open.bg.includes('url('),'dynamic backdrop missing');
            assert.ok(open.hint.y>=open.hero.bottom-1,'swipe caption is not below hero');
            assert.ok(open.cafe.width>300,'CafeF panel width unexpectedly narrow');
            assert.equal(open.hasButton,false,'previous blue slider remains');
            await page.locator('#aurel-cafef-overview .cf-tab[data-tab="news"]').click();
            let tabs=await page.evaluate(()=>Array.from(document.querySelectorAll('#aurel-cafef-overview .cf-group')).map(x=>({name:x.dataset.view,hidden:x.hidden})));
            console.log('NEWS TAB',JSON.stringify(tabs));
            assert.deepEqual(tabs,[{name:'reports',hidden:true},{name:'news',hidden:false}]);
            await page.locator('#aurel-cafef-overview .cf-tab[data-tab="reports"]').click();
            tabs=await page.evaluate(()=>Array.from(document.querySelectorAll('#aurel-cafef-overview .cf-group')).map(x=>({name:x.dataset.view,hidden:x.hidden})));
            assert.deepEqual(tabs,[{name:'reports',hidden:false},{name:'news',hidden:true}]);
            await page.locator('#root > .aurel-cafef-hero-row > .ref-hero').focus();
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(450);
            const hidden=await measure();
            console.log('DESKTOP HIDDEN',JSON.stringify(hidden));
            assert.equal(hidden.closed,'true');
            assert.ok(hidden.hero.width>open.hero.width+100,'hero did not widen');
            assert.ok(hidden.hintText.includes('Kéo sang trái để mở CafeF'));
            // Simulate an actual swipe from the hero to open, not just a key press.
            const start=await page.locator('#root > .aurel-cafef-hero-row > .ref-hero').boundingBox();
            const x=start.x+Math.floor(start.width*.72),y=start.y+Math.floor(start.height*.63);
            await page.mouse.move(x,y);
            await page.mouse.down();
            await page.mouse.move(x-155,y,{steps:12});
            await page.mouse.up();
            await page.waitForTimeout(500);
            const reopened=await measure();
            console.log('DESKTOP REOPENED BY SWIPE',JSON.stringify(reopened));
            assert.equal(reopened.closed,'false');
            assert.ok(reopened.hero.width<hidden.hero.width-100);
            // Existing mobile layout must remain stacked.
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(300);
            const mobile=await page.evaluate(()=>{const r=document.querySelector('.aurel-cafef-hero-row');return {display:getComputedStyle(r).display,hero:r.querySelector('.ref-hero').getBoundingClientRect().width,hasHint: getComputedStyle(r.nextElementSibling).display};});
            console.log('MOBILE',JSON.stringify(mobile));
            assert.equal(mobile.display,'flex');
            assert.equal(mobile.hasHint,'none');
            if(errors.length)console.log('PAGE ERRORS',JSON.stringify(errors.slice(0,8)));
            await browser.close();
            console.log('BROWSER CHECK PASS: proportion, backdrop, caption, full swipe, tabs, mobile');
          })().catch(e=>{console.error('BROWSER REGRESSION FAILED',e);process.exit(1)});
          NODE
