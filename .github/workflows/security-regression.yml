name: Security regression
on:
  push:
    branches:
      - main
      - security/session-isolation-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python backend
        run: python -m py_compile server.py aurel_auth.py aurel_account_store.py
      - name: Validate embedded frontend JavaScript syntax
        run: |
          python - <<'PY'
          import base64, pathlib, re
          content = pathlib.Path('financial-intelligence.html').read_text(encoding='utf-8')
          match = re.search(r'const b="([A-Za-z0-9+/=]+)"', content)
          assert match, 'Embedded frontend not found'
          pathlib.Path('/tmp/aurel-frontend-main.js').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY
          node --check /tmp/aurel-frontend-main.js
          node --check assets/aurel-private-vault.js
          node --check assets/aurel-private-analytics.js
          node --check assets/aurel-account-auth.js
      - name: Verify existing financial formulas are unchanged
        run: |
          git fetch --depth=1 origin main
          python - <<'PY'
          import ast, pathlib, subprocess
          previous = subprocess.check_output(['git','show','origin/main:server.py'],text=True)
          updated = pathlib.Path('server.py').read_text(encoding='utf-8')
          def original_functions(source):
              tree=ast.parse(source)
              return {f.name:ast.get_source_segment(source,f)
                      for f in tree.body if isinstance(f,(ast.FunctionDef,ast.AsyncFunctionDef))}
          base, target=original_functions(previous),original_functions(updated)
          exceptions={'pdf_preview'}  # Only lazy private PDF retrieval; the calculation remains unchanged.
          different=[name for name,content in base.items()
                     if name not in exceptions and target.get(name)!=content]
          assert not different, 'Existing financial functions changed: '+', '.join(different)
          assert all(k in target for k in base), 'Removed existing functions'
          print('PASS:',len(base)-len(exceptions),'existing functions preserved byte-for-byte')
          PY
      - name: Cross-user security regression tests
        run: python -m unittest discover -s tests -p 'test_security*.py' -v
