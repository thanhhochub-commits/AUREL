name: Security regression
on:
  push:
    branches:
      - main
      - security/session-isolation-20261010
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python backend
        run: python -m py_compile server.py
      - name: Validate embedded frontend JavaScript syntax
        run: |
          python - <<'PY'
          import base64, pathlib, re
          content = pathlib.Path('financial-intelligence.html').read_text(encoding='utf-8')
          match = re.search(r'const b="([A-Za-z0-9+/=]+)"', content)
          assert match, 'Embedded frontend not found'
          pathlib.Path('/tmp/aurel-frontend-main.js').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY
          node --check /tmp/aurel-frontend-main.js
          node --check assets/aurel-private-vault.js
          node --check assets/aurel-private-analytics.js
      - name: Cross-user security regression tests
        run: python -m unittest discover -s tests -p 'test_security*.py' -v
