name: AUREL Gemini backend deployment smoke

on:
  push:
    branches: [main]
    paths:
      - server.py
      - financial-intelligence.html
      - tests/test_gemini_chat_reliability.py
      - .github/workflows/aurel-ai-chat-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ai-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live backend revision without any API key
        env:
          AUREL_BACKEND: https://aurel-thanhhochub-backend.onrender.com
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          url=os.environ['AUREL_BACKEND'].rstrip('/')+'/health'
          expected='AUREL-GEMINI-20261022-RETRY-V8'
          last='no response'
          for attempt in range(18):
              try:
                  req=Request(url,headers={'User-Agent':'AUREL-Gemini-Backend-Smoke/1.0',
                                           'Accept':'application/json','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=15) as response:
                      payload=json.load(response)
                  revision=str(payload.get('gemini_chat_revision',''))
                  print('Attempt',attempt+1,'health revision:',revision or '(missing)',flush=True)
                  if payload.get('status')=='ok' and revision==expected:
                      print('PASS: live Render backend exposes latest Gemini revision')
                      print('NOTE: this does not claim a real Gemini API-key generation check.')
                      break
                  last='outdated live backend revision '+repr(revision)
              except HTTPError as e:
                  last='backend HTTP '+str(e.code)
                  print('Attempt',attempt+1,last,flush=True)
              except Exception as e:
                  last=type(e).__name__+': '+str(e)[:150]
                  print('Attempt',attempt+1,last,flush=True)
              if attempt<17:time.sleep(10)
          else:
              raise SystemExit('Live AUREL backend revision not verified: '+last)
          PY
