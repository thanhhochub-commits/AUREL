name: AUREL AI header align
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep AI status chip close to chevron
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R144_AI_HEADER_ALIGN">
          /* Giữ trạng thái và mũi tên thành một cụm ở góc phải, cả khi mở và thu gọn. */
          .ai-key-panel .ai-key-top{
            display:flex!important;
            align-items:flex-start!important;
            justify-content:flex-start!important;
            column-gap:8px!important;
            row-gap:10px!important;
            flex-wrap:wrap!important;
          }

          .ai-key-panel .ai-key-top > div:first-child{
            flex:1 1 540px!important;
            min-width:260px!important;
          }

          .ai-key-panel .ai-key-status{
            margin-left:auto!important;
            flex:0 0 auto!important;
          }

          .ai-key-panel .aurel-ai-key-toggle{
            margin-left:0!important;
            flex:0 0 34px!important;
          }

          .ai-key-panel.aurel-ai-key-collapsed .ai-key-top{
            align-items:center!important;
            flex-wrap:nowrap!important;
            column-gap:8px!important;
          }

          .ai-key-panel.aurel-ai-key-collapsed .ai-key-top > div:first-child{
            flex:1 1 auto!important;
            min-width:0!important;
          }

          .ai-key-panel.aurel-ai-key-collapsed .ai-key-status{
            margin-left:auto!important;
          }

          @media(max-width:700px){
            .ai-key-panel .ai-key-top{
              column-gap:7px!important;
            }

            .ai-key-panel .ai-key-top > div:first-child{
              flex-basis:100%!important;
              min-width:0!important;
            }

            .ai-key-panel .ai-key-status{
              margin-left:auto!important;
            }

            .ai-key-panel.aurel-ai-key-collapsed .ai-key-top > div:first-child{
              flex-basis:auto!important;
            }
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R144_AI_HEADER_ALIGN">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Keep AI status chip aligned beside chevron"
          git push
