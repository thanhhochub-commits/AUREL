name: AUREL transparent hero text
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove hero white glass panel completely
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          # Dọn các lớp hero text cũ có thể tạo nền/blur
          for ident in ['AUREL_R155_HERO_TYPOGRAPHY_REDESIGN','AUREL_R156_HERO_COLOR_ONLY','AUREL_R157_HERO_TEXT_CLARITY','AUREL_R158_HERO_FULL_TRANSPARENT']:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          css="<style id=\"AUREL_R158_HERO_FULL_TRANSPARENT\">\n/* R158 — xoá hoàn toàn nền trắng/blur của khối chữ hero.\n   Chỉ giữ chữ trực tiếp trên ảnh, trong suốt 100%. */\n\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero > .ref-hero-live-copy,\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero .ref-hero-live-copy{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:0!important;\n  outline:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n  filter:none!important;\n}\n\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero > .ref-hero-live-copy::before,\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero > .ref-hero-live-copy::after,\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero .ref-hero-live-copy::before,\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero .ref-hero-live-copy::after{\n  content:none!important;\n  display:none!important;\n  background:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n\n/* Phòng trường hợp nền trắng nằm ở wrapper bên trong khối chữ */\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy > div{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n  filter:none!important;\n}\n\n/* Giữ chữ rõ trực tiếp trên ảnh, không tạo nền hộp */\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  text-shadow:0 1px 2px rgba(3,20,36,.98),0 2px 7px rgba(3,20,36,.72)!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n  text-shadow:0 2px 3px rgba(3,20,36,.98),0 5px 13px rgba(3,20,36,.74)!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  text-shadow:0 1px 2px rgba(3,20,36,.98),0 2px 6px rgba(3,20,36,.72)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  color:#8fe7ff!important;\n  -webkit-text-fill-color:#8fe7ff!important;\n  text-shadow:0 1px 2px rgba(0,0,0,.98),0 0 9px rgba(46,198,240,.24)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n  text-shadow:0 2px 4px rgba(0,0,0,.98)!important;\n}\n\n/* Badge chỉ hơi trong để đọc được nhưng vẫn nhìn xuyên ảnh */\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n  background:rgba(0,0,0,.22)!important;\n  box-shadow:none!important;\n}\n</style>"
          if '</body>' not in s:
              raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Remove overview hero white glass panel"
          git push
