name: AUREL inspect R78 slider script
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract R78 script
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          m=re.search(r'<script id="AUREL_R78_REAL_SLIDER_JS">([\s\S]*?)</script>',s)
          if not m: raise SystemExit("R78 script not found")
          Path("r78_slider_script.txt").write_text(m.group(1),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add r78_slider_script.txt
          git commit -m "Temporary R78 slider script inspection"
          git push
