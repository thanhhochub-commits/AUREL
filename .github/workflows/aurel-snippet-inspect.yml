name: AUREL inspect ROA markup
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ROA ROE CIR source contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          out=[]
          for needle in ["ROA","ROE","CIR","Hiệu quả tài sản","Hiệu quả vốn","Chi phí / Thu nhập"]:
              start=0;n=0
              while n<20:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-1800):min(len(s),i+3600)])
                  start=i+len(needle)
          Path("roa_context_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add roa_context_debug.txt
          git commit -m "Temporary ROA markup inspection"
          git push
