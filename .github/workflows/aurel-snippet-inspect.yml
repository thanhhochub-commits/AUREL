name: AUREL remove hero glass permanently
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero glass and blur at source
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          for ident in ['AUREL_R155_HERO_TYPOGRAPHY_REDESIGN','AUREL_R156_HERO_COLOR_ONLY','AUREL_R157_HERO_TEXT_CLARITY','AUREL_R158_HERO_FULL_TRANSPARENT','AUREL_R159_HERO_TEXT_ONLY']:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
              s=re.sub(r'<script id="'+re.escape(ident)+r'_JS">[\\s\\S]*?</script>\\s*','',s,flags=re.M)
          pat=re.compile(r'([^{}]*\\.(?:ref-hero-live-copy|ref-hero-copy)[^{}]*\\{)([^{}]*)(\\})',re.M)
          def clear_block(m):
              head,body,tail=m.group(1),m.group(2),m.group(3)
              body=re.sub(r'(?:background|background-color|background-image)\\s*:[^;{}]+;?','',body,flags=re.I)
              body=re.sub(r'-webkit-backdrop-filter\\s*:[^;{}]+;?','',body,flags=re.I)
              body=re.sub(r'(?<!-webkit-)backdrop-filter\\s*:[^;{}]+;?','',body,flags=re.I)
              body=re.sub(r'box-shadow\\s*:[^;{}]+;?','',body,flags=re.I)
              body += '\\nbackground:transparent!important;background-color:transparent!important;background-image:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;border:0!important;outline:0!important;filter:none!important;\\n'
              return head+body+tail
          s=pat.sub(clear_block,s)
          css="<style id=\"AUREL_R159_HERO_TEXT_ONLY\">\n.ref-hero .ref-hero-copy.ref-hero-live-copy,\nbody .ref-hero .ref-hero-copy.ref-hero-live-copy{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:0!important;\n  outline:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n  filter:none!important;\n}\n.ref-hero .ref-hero-copy.ref-hero-live-copy::before,\n.ref-hero .ref-hero-copy.ref-hero-live-copy::after{\n  content:none!important;\n  display:none!important;\n  background:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n.ref-hero .ref-hero-live-badges span{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker b,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-bank,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-title,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p strong,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-badges span{\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker b{\n  text-shadow:0 1px 2px rgba(1,18,34,.98),0 2px 7px rgba(1,18,34,.78)!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-bank,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-title{\n  text-shadow:0 2px 3px rgba(1,18,34,.98),0 5px 13px rgba(1,18,34,.78)!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p strong,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-badges span{\n  text-shadow:0 1px 2px rgba(1,18,34,.98),0 2px 6px rgba(1,18,34,.76)!important;\n}\nbody.aurel-dark-theme .ref-hero .ref-hero-live-kicker,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-kicker b{\n  color:#8fe7ff!important;\n  -webkit-text-fill-color:#8fe7ff!important;\n  text-shadow:0 1px 2px rgba(0,0,0,.98),0 0 8px rgba(48,196,240,.22)!important;\n}\nbody.aurel-dark-theme .ref-hero .ref-hero-live-bank,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-title,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-copy p,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-copy p strong,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-badges span{\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n  text-shadow:0 2px 4px rgba(0,0,0,.98)!important;\n}\n</style>"
          js="<script id=\"AUREL_R159_HERO_TEXT_ONLY_JS\">\n(function(){\n  function clearHero(){\n    document.querySelectorAll('.ref-hero .ref-hero-copy.ref-hero-live-copy').forEach(function(el){\n      ['background','background-color','background-image','border','outline','box-shadow','-webkit-backdrop-filter','backdrop-filter','filter'].forEach(function(prop){\n        var value=(prop==='background'||prop==='background-color')?'transparent':(prop==='background-image'?'none':(prop==='border'||prop==='outline'?'0':'none'));\n        el.style.setProperty(prop,value,'important');\n      });\n    });\n    document.querySelectorAll('.ref-hero .ref-hero-live-badges span').forEach(function(el){\n      el.style.setProperty('background','transparent','important');\n      el.style.setProperty('border','0','important');\n      el.style.setProperty('box-shadow','none','important');\n      el.style.setProperty('-webkit-backdrop-filter','none','important');\n      el.style.setProperty('backdrop-filter','none','important');\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',clearHero,{once:true});\n  else clearHero();\n  new MutationObserver(function(){requestAnimationFrame(clearHero);})\n    .observe(document.getElementById('root')||document.body,{childList:true,subtree:true});\n})();\n</script>"
          if '</body>' not in s: raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\\n'+js+'\\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Remove hero glass and keep text only"
          git push
