name: AUREL inspect scenario exact markup
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=["scenario-control","scenario-results","Tỷ lệ nợ xấu ban đầu","Biến động nợ xấu","Kết quả mô phỏng"]
          out=[]
          for needle in needles:
              start=0;n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-1600):min(len(s),i+3800)])
                  start=i+len(needle)
          Path("scenario_exact_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add scenario_exact_debug.txt
          git commit -m "Temporary exact scenario inspection"
          git push
