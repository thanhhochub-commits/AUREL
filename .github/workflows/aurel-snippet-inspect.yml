name: AUREL inspect exact t1 t8 occurrences
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact T1-T8 contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=[
            "aurel_t1_horizontal_user_20261001.png",
            "aurel_t2_horizontal_user_20261001.png",
            "aurel_t3_horizontal_user_20261001.png",
            "aurel_t4_horizontal_user_20261001.png",
            "aurel_t5_horizontal_user_20261001.png",
            "aurel_t6_horizontal_user_20261001.png",
            "aurel_t7_horizontal_user_20261001.png",
            "aurel_t8_horizontal_user_20261001.png",
            "aurel_t4_hcm_user_exact_20261001.png",
            "aurel_t5_hanoi_hero_user_exact_20261001.webp",
            "aurel_t6_hanoi_user_exact_20261001.png",
            "aurel_t7_danang_hero_sunrise_20261001.png",
            "aurel_t8_danang_hero_night_20261001.png"
          ]
          out=[]
          for needle in needles:
              start=0;n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-900):min(len(s),i+1800)])
                  start=i+len(needle)
                  if n>=20: break
          Path("t1_t8_contexts.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add t1_t8_contexts.txt
          git commit -m "Temporary T1-T8 context inspection"
          git push
