name: AUREL hero text clarity
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve hero text clarity in both themes
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          # Remove previous hero text color-only layer to avoid fighting the new clarity layer.
          s=re.sub(r'<style id="AUREL_R156_HERO_COLOR_ONLY">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          s=re.sub(r'<style id="AUREL_R157_HERO_TEXT_CLARITY">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          css="<style id=\"AUREL_R157_HERO_TEXT_CLARITY\">\n/* R157 — giữ đúng kiểu chữ overlay hiện tại, chỉ làm lại màu/độ tương phản để rõ ở cả Light/Dark.\n   Không thêm nền hộp, không đổi ảnh, không đổi slideshow, không đổi vị trí/bố cục. */\n\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n  background:transparent!important;\n  border:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n\n/* ===== LIGHT MODE ===== */\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.28px rgba(6,34,58,.85)!important;\n  text-shadow:\n    0 1px 1px rgba(5,25,44,.98),\n    0 2px 5px rgba(5,25,44,.78),\n    0 0 10px rgba(5,25,44,.34)!important;\n  font-weight:850!important;\n  letter-spacing:.10em!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.55px rgba(5,31,54,.82)!important;\n  text-shadow:\n    0 2px 2px rgba(3,20,36,.96),\n    0 4px 9px rgba(3,20,36,.72)!important;\n  font-weight:900!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.65px rgba(5,31,54,.84)!important;\n  text-shadow:\n    0 2px 2px rgba(3,20,36,.98),\n    0 5px 13px rgba(3,20,36,.75)!important;\n  font-weight:900!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.22px rgba(5,31,54,.72)!important;\n  text-shadow:\n    0 1px 1px rgba(3,20,36,.98),\n    0 2px 6px rgba(3,20,36,.72)!important;\n  font-weight:750!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  border-color:rgba(255,255,255,.78)!important;\n  background:rgba(3,22,39,.30)!important;\n  text-shadow:0 1px 2px rgba(0,15,28,.98)!important;\n  box-shadow:0 2px 7px rgba(3,22,39,.16)!important;\n  font-weight:800!important;\n}\n\n/* ===== DARK MODE ===== */\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  color:#8fe7ff!important;\n  -webkit-text-fill-color:#8fe7ff!important;\n  -webkit-text-stroke:.18px rgba(0,0,0,.70)!important;\n  text-shadow:\n    0 1px 2px rgba(0,0,0,.98),\n    0 0 9px rgba(46,198,240,.26)!important;\n  font-weight:850!important;\n  letter-spacing:.10em!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.35px rgba(0,0,0,.76)!important;\n  text-shadow:\n    0 2px 3px rgba(0,0,0,.98),\n    0 0 10px rgba(58,190,235,.14)!important;\n  font-weight:900!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  -webkit-text-stroke:.42px rgba(0,0,0,.80)!important;\n  text-shadow:\n    0 2px 3px rgba(0,0,0,.98),\n    0 0 12px rgba(58,190,235,.12)!important;\n  font-weight:900!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p,\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#f4fbff!important;\n  -webkit-text-fill-color:#f4fbff!important;\n  -webkit-text-stroke:.14px rgba(0,0,0,.70)!important;\n  text-shadow:0 1px 3px rgba(0,0,0,.98)!important;\n  font-weight:750!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n  color:#f4fbff!important;\n  -webkit-text-fill-color:#f4fbff!important;\n  border-color:rgba(109,215,248,.58)!important;\n  background:rgba(3,16,29,.34)!important;\n  text-shadow:0 1px 2px rgba(0,0,0,.98)!important;\n  box-shadow:0 0 0 1px rgba(61,176,220,.04)!important;\n  font-weight:800!important;\n}\n</style>"
          if '</body>' not in s:
              raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Improve overview hero text clarity in both themes"
          git push
