name: AUREL inspect structure
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          keys=["scenario","risk","monitor","metric","simulation","alert"]
          out=[]
          for k in keys:
              start=0
              for _ in range(20):
                  i=s.lower().find(k,start)
                  if i<0: break
                  out.append("KEY="+k+" POS="+str(i)+"\n"+s[max(0,i-1200):i+2600])
                  start=i+len(k)
          Path("structure_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add structure_debug.txt
          git commit -m "Temporary structure inspection"
          git push
