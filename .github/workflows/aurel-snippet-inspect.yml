name: AUREL inspect AI panel exact
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact AI key panel
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needle="Kết nối trí tuệ nhân tạo"
          i=s.find(needle)
          if i<0: raise SystemExit("not found")
          Path("ai_panel_exact.txt").write_text(s[max(0,i-3500):min(len(s),i+12000)],encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add ai_panel_exact.txt
          git commit -m "Temporary exact AI panel inspection"
          git push
