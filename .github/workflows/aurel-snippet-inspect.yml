name: AUREL inspect ratio markup
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact ratio markup
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          out=[]
          for needle in ["ROA","ROE","CIR","Phân tích chỉ số","analysis-feature","ratio","metric"]:
              start=0;n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-1800):min(len(s),i+4200)])
                  start=i+len(needle)
                  if n>=20: break
          Path("ratio_markup_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add ratio_markup_debug.txt
          git commit -m "Temporary ratio markup inspection"
          git push
