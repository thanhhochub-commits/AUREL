name: AUREL inspect financial metric markup
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact markup
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=["ROA - Hiệu quả tài sản","ROE - Hiệu quả vốn","CIR - Chi phí / Thu nhập","AUREL_R139_FULL_BORDER_LED_METRICS"]
          out=[]
          for needle in needles:
              start=0;n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-2200):min(len(s),i+4200)])
                  start=i+len(needle)
          Path("financial_metric_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial_metric_debug.txt
          git commit -m "Temporary financial metric markup inspection"
          git push
