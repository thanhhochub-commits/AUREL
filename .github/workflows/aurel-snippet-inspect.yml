name: AUREL restore classic hero text
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous overview hero typography
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          # Bỏ đúng lớp "sharpen" mới nhất để trả chữ về kiểu cũ như ảnh tham chiếu,
          # giữ nguyên nền trong suốt, ảnh, slideshow, bố cục và responsive hiện có.
          s=re.sub(
              r'<style id="AUREL_R161_HERO_TEXT_CRISP">[\s\S]*?</style>\s*',
              '',
              s,
              flags=re.M
          )

          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Restore classic overview hero typography"
          git push
