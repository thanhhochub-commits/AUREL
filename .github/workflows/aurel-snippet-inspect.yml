name: AUREL scenario LED medium
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase scenario result LED slightly
        shell: python
        run: |
          from pathlib import Path
          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")
          old='''          .scenario-results .aurel-r134-led::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            right:0!important;
            top:0!important;
            width:100%!important;
            height:2px!important;
            max-height:2px!important;
            z-index:20!important;
            display:block!important;
            opacity:1!important;
            pointer-events:none!important;
          }'''
          new='''          .scenario-results .aurel-r134-led::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            right:0!important;
            top:0!important;
            width:100%!important;
            height:3px!important;
            max-height:3px!important;
            border-radius:999px!important;
            z-index:20!important;
            display:block!important;
            opacity:1!important;
            pointer-events:none!important;
          }'''
          if old not in s:
              raise SystemExit("Không tìm thấy block LED R134 hiện tại.")
          s=s.replace(old,new,1)
          s=s.replace(
            '.scenario-results .aurel-r134-led-current::before{\n            background:linear-gradient(90deg,#3b82f6,#60a5fa)!important;\n          }',
            '.scenario-results .aurel-r134-led-current::before{\n            background:linear-gradient(90deg,#3b82f6,#60a5fa)!important;\n            box-shadow:0 0 6px rgba(59,130,246,.20)!important;\n          }',
            1
          )
          s=s.replace(
            '.scenario-results .aurel-r134-led-after::before{\n            background:linear-gradient(90deg,#20b8b0,#34d399)!important;\n          }',
            '.scenario-results .aurel-r134-led-after::before{\n            background:linear-gradient(90deg,#20b8b0,#34d399)!important;\n            box-shadow:0 0 6px rgba(52,211,153,.17)!important;\n          }',
            1
          )
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Increase scenario result LED thickness slightly"
          git push
