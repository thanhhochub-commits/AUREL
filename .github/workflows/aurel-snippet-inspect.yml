name: AUREL force scenario thin accents
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force thin accents on exact scenario controls and result cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          # Remove the previous attempt so only the exact runtime fix remains.
          for tag, ident in [
              ("style","AUREL_R133_SCENARIO_THIN_ACCENTS"),
              ("style","AUREL_R134_SCENARIO_EXACT"),
              ("script","AUREL_R134_SCENARIO_EXACT_JS")
          ]:
              pat=re.compile(r'<'+tag+r' id="'+re.escape(ident)+r'">[\s\S]*?</'+tag+r'>\s*',re.M)
              s=pat.sub("",s)

          css=r'''
          <style id="AUREL_R134_SCENARIO_EXACT">
          /* R134 — exact runtime-marked elements only. */
          body:has(#nav button[data-page="scenario"].active) .scenario-control.aurel-r134-control{
            border-top-width:1px!important;
            box-shadow:none!important;
          }
          body:has(#nav button[data-page="scenario"].active) .scenario-control.aurel-r134-control::before{
            height:1px!important;
            max-height:1px!important;
          }

          .scenario-results .aurel-r134-led{
            position:relative!important;
            overflow:hidden!important;
          }
          .scenario-results .aurel-r134-led::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            right:0!important;
            top:0!important;
            width:100%!important;
            height:2px!important;
            max-height:2px!important;
            z-index:20!important;
            display:block!important;
            opacity:1!important;
            pointer-events:none!important;
          }
          .scenario-results .aurel-r134-led-current::before{
            background:linear-gradient(90deg,#3b82f6,#60a5fa)!important;
          }
          .scenario-results .aurel-r134-led-after::before{
            background:linear-gradient(90deg,#20b8b0,#34d399)!important;
          }

          body:not(.aurel-dark-theme) .scenario-results .aurel-r134-led{
            background:#fff!important;
            box-shadow:0 3px 10px rgba(28,74,105,.035)!important;
          }
          body.aurel-dark-theme .scenario-results .aurel-r134-led{
            background:#111d2a!important;
            box-shadow:0 4px 12px rgba(0,0,0,.13)!important;
          }
          </style>
          '''

          js=r'''
          <script id="AUREL_R134_SCENARIO_EXACT_JS">
          (function(){
            function norm(v){return String(v||"").replace(/\s+/g," ").trim();}

            function findCard(el){
              if(!el) return null;
              var direct=el.closest(".metric");
              if(direct) return direct;
              var cur=el;
              for(var i=0;i<7 && cur && cur!==document.body;i++,cur=cur.parentElement){
                var t=norm(cur.textContent);
                var r=cur.getBoundingClientRect();
                if(r.width>=140 && r.width<=520 && r.height>=70 && r.height<=230 && t.length<260){
                  return cur;
                }
              }
              return null;
            }

            function apply(){
              document.querySelectorAll(".scenario-control").forEach(function(card){
                card.classList.add("aurel-r134-control");
                card.style.setProperty("border-top-width","1px","important");
              });

              var root=document.querySelector(".scenario-results")||document.body;
              root.querySelectorAll("*").forEach(function(el){
                var t=norm(el.textContent);
                if(t==="Tỷ lệ nợ xấu ban đầu"){
                  var c=findCard(el);
                  if(c){
                    c.classList.add("aurel-r134-led","aurel-r134-led-current");
                  }
                }else if(t==="Tỷ lệ nợ xấu sau giả định"){
                  var c2=findCard(el);
                  if(c2){
                    c2.classList.add("aurel-r134-led","aurel-r134-led-after");
                  }
                }
              });
            }

            var scheduled=false;
            function schedule(){
              if(scheduled) return;
              scheduled=true;
              requestAnimationFrame(function(){scheduled=false;apply();});
            }
            if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",schedule,{once:true});
            else schedule();

            var root=document.getElementById("root")||document.body;
            new MutationObserver(schedule).observe(root,{childList:true,subtree:true});
            document.addEventListener("click",function(){setTimeout(apply,30)},true);
          })();
          </script>
          '''

          s=s.replace("</body>",css.strip()+"\n"+js.strip()+"\n</body>",1)
          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Force exact thin accents on scenario UI"
          git push
