name: AUREL final status simulation fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact classes
        shell: python
        run: |
          from pathlib import Path
          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")
          css='''<style id="AUREL_R130_EXACT_FIX">
          /* Exact scenario result classes */
          .scenario-results{position:relative!important;overflow:hidden!important;border-radius:16px!important}
          .scenario-results:after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#3b82f6,#20b8b0,#f59e0b);z-index:3}
          body:not(.aurel-dark-theme) .scenario-results{border-color:#bfd5e4!important;background:linear-gradient(180deg,#ffffff,#f8fbfd)!important;box-shadow:0 12px 28px rgba(31,78,112,.08),0 0 24px rgba(59,130,246,.05)!important}
          body.aurel-dark-theme .scenario-results{border-color:#304b61!important;background:linear-gradient(180deg,#111d2a,#0c151f)!important;box-shadow:0 13px 30px rgba(0,0,0,.26),0 0 26px rgba(77,156,255,.07)!important}
          .scenario-results .metric{position:relative!important;overflow:hidden!important;border-radius:13px!important}
          .scenario-results .metric:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3b82f6,#60a5fa)}
          .scenario-results .metric:nth-child(even):before{background:linear-gradient(90deg,#20b8b0,#5eead4)}
          body:not(.aurel-dark-theme) .scenario-results .metric{background:linear-gradient(145deg,#f8fbff,#edf5ff)!important;border-color:#bfd4e7!important;box-shadow:0 7px 18px rgba(59,130,246,.07)!important}
          body:not(.aurel-dark-theme) .scenario-results .metric:nth-child(even){background:linear-gradient(145deg,#f7fffc,#edf9f6)!important;border-color:#b8dcd4!important;box-shadow:0 7px 18px rgba(32,184,176,.07)!important}
          body.aurel-dark-theme .scenario-results .metric{background:linear-gradient(145deg,rgba(77,156,255,.13),#101a26 48%)!important;border-color:#31506c!important;box-shadow:0 8px 20px rgba(77,156,255,.08)!important}
          body.aurel-dark-theme .scenario-results .metric:nth-child(even){background:linear-gradient(145deg,rgba(47,199,179,.12),#101a26 48%)!important;border-color:#28574f!important;box-shadow:0 8px 20px rgba(47,199,179,.08)!important}
          .scenario-results .table-wrap{border-radius:12px!important;overflow:hidden!important}
          body:not(.aurel-dark-theme) .scenario-results thead th{background:linear-gradient(180deg,#eef6fb,#e8f1f7)!important;color:#31556d!important}
          body.aurel-dark-theme .scenario-results thead th{background:linear-gradient(180deg,#182839,#142231)!important;color:#c1d1dc!important}

          /* Exact risk status cards */
          .monitor-overview .monitor-card{position:relative!important;overflow:hidden!important;border-radius:18px!important;transition:transform .18s ease,box-shadow .18s ease!important}
          .monitor-overview .monitor-card:before{content:""!important;position:absolute!important;left:0!important;right:0!important;top:0!important;height:4px!important}
          .monitor-overview .monitor-card:nth-child(1):before{background:linear-gradient(90deg,#ef4444,#dc2626)!important}
          .monitor-overview .monitor-card:nth-child(2):before{background:linear-gradient(90deg,#f59e0b,#d97706)!important}
          .monitor-overview .monitor-card:nth-child(3):before{background:linear-gradient(90deg,#22c55e,#16a34a)!important}
          .monitor-overview .monitor-card:nth-child(4):before{background:linear-gradient(90deg,#60a5fa,#3b82f6)!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(1){border-color:#efb1b1!important;background:linear-gradient(180deg,#fffdfd,#fff5f5)!important;box-shadow:0 10px 24px rgba(220,38,38,.09),0 0 20px rgba(239,68,68,.06)!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(2){border-color:#edd094!important;background:linear-gradient(180deg,#fffef9,#fff8ec)!important;box-shadow:0 10px 24px rgba(217,119,6,.08),0 0 20px rgba(245,158,11,.055)!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(3){border-color:#a7ddbc!important;background:linear-gradient(180deg,#fbfffc,#f1fbf4)!important;box-shadow:0 10px 24px rgba(22,163,74,.08),0 0 20px rgba(34,197,94,.055)!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(4){border-color:#b8cce2!important;background:linear-gradient(180deg,#fcfeff,#f2f7fd)!important;box-shadow:0 10px 24px rgba(59,130,246,.075),0 0 18px rgba(96,165,250,.05)!important}
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(1){border-color:#71383b!important;background:linear-gradient(180deg,#1c1519,#121016)!important;box-shadow:0 11px 25px rgba(0,0,0,.25),0 0 22px rgba(239,68,68,.12)!important}
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(2){border-color:#725b2a!important;background:linear-gradient(180deg,#1e1a12,#14120d)!important;box-shadow:0 11px 25px rgba(0,0,0,.25),0 0 22px rgba(245,158,11,.11)!important}
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(3){border-color:#2b5d3d!important;background:linear-gradient(180deg,#131c17,#0e1410)!important;box-shadow:0 11px 25px rgba(0,0,0,.25),0 0 22px rgba(34,197,94,.11)!important}
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(4){border-color:#335978!important;background:linear-gradient(180deg,#111c28,#0c141e)!important;box-shadow:0 11px 25px rgba(0,0,0,.25),0 0 22px rgba(96,165,250,.10)!important}
          .monitor-overview .monitor-card:hover{transform:translateY(-2px)!important}
          </style>'''
          a=s.find('<style id="AUREL_R130_EXACT_FIX">')
          if a>=0:
              b=s.find('</style>',a)+8
              s=s[:a]+css+s[b:]
          else:
              s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Fix exact simulation and risk status visuals"
          git push
