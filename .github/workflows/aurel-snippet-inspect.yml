name: AUREL support output contrast
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Brighten support analysis output in dark mode
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R146_SUPPORT_OUTPUT_CONTRAST">
          /* Chỉ tăng độ rõ phần nội dung phân tích ở trang Phân tích hỗ trợ, Dark Mode. */
          body.aurel-dark-theme:has(#nav button[data-page="support"].active) :is(
            .panel,.ai-feature,.ai-connect,.analysis-result,.result-card,
            [class*="result"],[class*="summary"],[class*="output"]
          ) :is(p,li,dd,.content,.body,.text,.description,.summary,.analysis-text){
            color:#bfd3e1!important;
            opacity:1!important;
            font-weight:500!important;
            line-height:1.72!important;
            text-shadow:0 0 1px rgba(255,255,255,.05)!important;
          }

          /* Nếu đoạn phân tích được render trực tiếp bằng div/span thay vì p. */
          body.aurel-dark-theme:has(#nav button[data-page="support"].active) :is(
            [class*="result"],[class*="summary"],[class*="output"]
          ) :is(div,span):not(
            .badge,.chip,.status-pill,.ai-key-status,.button,button,
            [class*="status"],[class*="badge"],[class*="chip"]
          ){
            color:#bfd3e1!important;
            opacity:1!important;
          }

          /* Tiêu đề kết quả giữ sáng rõ hơn nội dung. */
          body.aurel-dark-theme:has(#nav button[data-page="support"].active) :is(
            [class*="result"],[class*="summary"],[class*="output"],.panel
          ) :is(h2,h3,h4,strong){
            color:#f5f9fc!important;
            opacity:1!important;
          }

          /* Giữ badge trạng thái như "Chờ duyệt" có màu riêng. */
          body.aurel-dark-theme:has(#nav button[data-page="support"].active) :is(
            .badge,.chip,.status-pill,.ai-key-status,
            [class*="status"],[class*="badge"],[class*="chip"]
          ){
            opacity:1!important;
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R146_SUPPORT_OUTPUT_CONTRAST">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Improve dark support analysis text contrast"
          git push
