name: AUREL hero text only final
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force hero overlay fully transparent
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="AUREL_R160_HERO_TEXT_ONLY_FINAL">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          s=re.sub(r'<script id="AUREL_R160_HERO_TEXT_ONLY_FINAL_JS">[\\s\\S]*?</script>\\s*','',s,flags=re.M)
          css="<style id=\"AUREL_R160_HERO_TEXT_ONLY_FINAL\">\n.ref-hero-copy.ref-hero-live-copy,\n.ref-hero .ref-hero-copy.ref-hero-live-copy,\n.ref-hero > .ref-hero-copy.ref-hero-live-copy{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:none!important;\n  outline:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n  filter:none!important;\n  opacity:1!important;\n}\n.ref-hero-copy.ref-hero-live-copy::before,\n.ref-hero-copy.ref-hero-live-copy::after{\n  content:none!important;\n  display:none!important;\n  background:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n.ref-hero-live-badges span{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:none!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n</style>"
          js="<script id=\"AUREL_R160_HERO_TEXT_ONLY_FINAL_JS\">\n(function(){\n  function fix(){\n    document.querySelectorAll('.ref-hero-copy.ref-hero-live-copy').forEach(function(el){\n      el.style.setProperty('background','transparent','important');\n      el.style.setProperty('background-color','transparent','important');\n      el.style.setProperty('background-image','none','important');\n      el.style.setProperty('border','none','important');\n      el.style.setProperty('outline','none','important');\n      el.style.setProperty('box-shadow','none','important');\n      el.style.setProperty('-webkit-backdrop-filter','none','important');\n      el.style.setProperty('backdrop-filter','none','important');\n      el.style.setProperty('filter','none','important');\n      el.style.setProperty('opacity','1','important');\n    });\n    document.querySelectorAll('.ref-hero-live-badges span').forEach(function(el){\n      el.style.setProperty('background','transparent','important');\n      el.style.setProperty('background-color','transparent','important');\n      el.style.setProperty('background-image','none','important');\n      el.style.setProperty('border','none','important');\n      el.style.setProperty('box-shadow','none','important');\n      el.style.setProperty('-webkit-backdrop-filter','none','important');\n      el.style.setProperty('backdrop-filter','none','important');\n    });\n  }\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',fix,{once:true});\n  }else{\n    fix();\n  }\n  new MutationObserver(function(){requestAnimationFrame(fix);})\n    .observe(document.getElementById('root')||document.body,{childList:true,subtree:true});\n})();\n</script>"
          if '</body>' not in s: raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\\n'+js+'\\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Force overview hero text overlay fully transparent"
          git push
