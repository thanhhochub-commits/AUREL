name: AUREL inspect page ids
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect page ids
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          out=[]
          for m in re.finditer(r'<button[^>]*data-page=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</button>',s,re.I):
              txt=re.sub(r'<[^>]+>',' ',m.group(2))
              txt=re.sub(r'\s+',' ',txt).strip()
              out.append(f"BUTTON {m.group(1)} :: {txt}")
          for m in re.finditer(r'<section[^>]*id=["\']([^"\']+)["\'][^>]*class=["\']([^"\']*)["\']',s,re.I):
              out.append(f"SECTION {m.group(1)} :: {m.group(2)}")
          Path("page_ids_debug.txt").write_text("\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add page_ids_debug.txt
          git commit -m "Temporary page id inspection"
          git push
