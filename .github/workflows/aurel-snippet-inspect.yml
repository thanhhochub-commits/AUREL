name: AUREL redesign hero typography
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign all overview hero text for new frame
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          ident='AUREL_R155_HERO_TYPOGRAPHY_REDESIGN'
          s=re.sub(r'<style id="'+ident+r'">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          css="<style id=\"AUREL_R155_HERO_TYPOGRAPHY_REDESIGN\">\n/* R155 — thiết kế lại toàn bộ chữ overlay của ảnh ngang Tổng quan cho khung mới.\n   Chỉ đổi typography/overlay text, không đổi ảnh, dữ liệu, slideshow hay bố cục phần khác. */\n\nbody:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n  display:flex!important;\n  position:absolute!important;\n  z-index:6!important;\n  left:clamp(18px,2.4vw,38px)!important;\n  top:50%!important;\n  transform:translateY(-50%)!important;\n  flex-direction:column!important;\n  align-items:flex-start!important;\n  justify-content:center!important;\n  width:min(52%,680px)!important;\n  height:auto!important;\n  padding:clamp(18px,2vw,28px) clamp(20px,2.4vw,34px)!important;\n  border-radius:18px!important;\n  pointer-events:none!important;\n  overflow:visible!important;\n}\n\n/* ---------- LIGHT MODE ---------- */\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n  background:\n    linear-gradient(90deg,\n      rgba(248,252,255,.91) 0%,\n      rgba(248,252,255,.78) 58%,\n      rgba(248,252,255,.28) 84%,\n      rgba(248,252,255,0) 100%)!important;\n  border-left:3px solid rgba(20,126,199,.78)!important;\n  box-shadow:0 12px 34px rgba(5,35,61,.10)!important;\n  -webkit-backdrop-filter:blur(2px)!important;\n  backdrop-filter:blur(2px)!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker{\n  display:inline-flex!important;\n  align-items:center!important;\n  min-height:24px!important;\n  margin:0 0 9px!important;\n  padding:0 10px!important;\n  border:1px solid rgba(15,103,163,.20)!important;\n  border-radius:999px!important;\n  background:rgba(225,243,255,.78)!important;\n  color:#155983!important;\n  font-size:clamp(9px,.68vw,11px)!important;\n  line-height:1!important;\n  font-weight:850!important;\n  letter-spacing:.12em!important;\n  text-transform:uppercase!important;\n  text-shadow:none!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.72)!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  color:#0876b8!important;\n  font-weight:900!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank{\n  display:block!important;\n  margin:0 0 2px!important;\n  color:#0a5f98!important;\n  -webkit-text-fill-color:#0a5f98!important;\n  -webkit-text-stroke:0!important;\n  font-size:clamp(28px,2.45vw,42px)!important;\n  line-height:.98!important;\n  font-weight:900!important;\n  letter-spacing:.01em!important;\n  text-shadow:none!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n  display:block!important;\n  margin:0!important;\n  max-width:100%!important;\n  color:#092d49!important;\n  -webkit-text-fill-color:#092d49!important;\n  -webkit-text-stroke:0!important;\n  font-size:clamp(34px,3.35vw,56px)!important;\n  line-height:.98!important;\n  font-weight:900!important;\n  letter-spacing:-.035em!important;\n  text-shadow:none!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p{\n  max-width:560px!important;\n  margin:12px 0 0!important;\n  color:#214b68!important;\n  -webkit-text-fill-color:#214b68!important;\n  font-size:clamp(11px,.82vw,13px)!important;\n  line-height:1.45!important;\n  font-weight:650!important;\n  text-shadow:none!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#123a57!important;\n  -webkit-text-fill-color:#123a57!important;\n  font-weight:800!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges{\n  display:flex!important;\n  flex-wrap:wrap!important;\n  gap:7px!important;\n  margin-top:12px!important;\n}\n\nbody:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n  min-height:28px!important;\n  padding:0 11px!important;\n  border:1px solid rgba(19,104,160,.18)!important;\n  border-radius:999px!important;\n  background:rgba(247,252,255,.84)!important;\n  color:#174d70!important;\n  font-size:clamp(8.5px,.62vw,10px)!important;\n  line-height:1!important;\n  font-weight:750!important;\n  text-shadow:none!important;\n  box-shadow:0 3px 10px rgba(7,55,89,.06)!important;\n}\n\n/* ---------- DARK MODE ---------- */\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n  background:\n    linear-gradient(90deg,\n      rgba(3,16,31,.84) 0%,\n      rgba(3,18,34,.68) 58%,\n      rgba(3,18,34,.22) 84%,\n      rgba(3,18,34,0) 100%)!important;\n  border-left:3px solid rgba(50,189,229,.82)!important;\n  box-shadow:0 14px 38px rgba(0,0,0,.20)!important;\n  -webkit-backdrop-filter:blur(2px)!important;\n  backdrop-filter:blur(2px)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker{\n  display:inline-flex!important;\n  align-items:center!important;\n  min-height:24px!important;\n  margin:0 0 9px!important;\n  padding:0 10px!important;\n  border:1px solid rgba(78,190,232,.34)!important;\n  border-radius:999px!important;\n  background:rgba(7,39,62,.62)!important;\n  color:#86dcff!important;\n  font-size:clamp(9px,.68vw,11px)!important;\n  line-height:1!important;\n  font-weight:850!important;\n  letter-spacing:.12em!important;\n  text-transform:uppercase!important;\n  text-shadow:none!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker b{\n  color:#b4ebff!important;\n  font-weight:900!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank{\n  display:block!important;\n  margin:0 0 2px!important;\n  color:#75d5ff!important;\n  -webkit-text-fill-color:#75d5ff!important;\n  -webkit-text-stroke:0!important;\n  font-size:clamp(28px,2.45vw,42px)!important;\n  line-height:.98!important;\n  font-weight:900!important;\n  letter-spacing:.01em!important;\n  text-shadow:0 2px 12px rgba(0,0,0,.50)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n  display:block!important;\n  margin:0!important;\n  max-width:100%!important;\n  color:#f7fbff!important;\n  -webkit-text-fill-color:#f7fbff!important;\n  -webkit-text-stroke:0!important;\n  font-size:clamp(34px,3.35vw,56px)!important;\n  line-height:.98!important;\n  font-weight:900!important;\n  letter-spacing:-.035em!important;\n  text-shadow:0 3px 15px rgba(0,0,0,.50)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p{\n  max-width:560px!important;\n  margin:12px 0 0!important;\n  color:#d5e9f5!important;\n  -webkit-text-fill-color:#d5e9f5!important;\n  font-size:clamp(11px,.82vw,13px)!important;\n  line-height:1.45!important;\n  font-weight:650!important;\n  text-shadow:0 1px 5px rgba(0,0,0,.55)!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p strong{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:800!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges{\n  display:flex!important;\n  flex-wrap:wrap!important;\n  gap:7px!important;\n  margin-top:12px!important;\n}\n\nbody.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n  min-height:28px!important;\n  padding:0 11px!important;\n  border:1px solid rgba(85,194,230,.30)!important;\n  border-radius:999px!important;\n  background:rgba(5,30,49,.70)!important;\n  color:#e8f7ff!important;\n  font-size:clamp(8.5px,.62vw,10px)!important;\n  line-height:1!important;\n  font-weight:750!important;\n  text-shadow:none!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important;\n}\n\n/* ---------- TABLET ---------- */\n@media(max-width:1100px) and (min-width:761px){\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n    left:24px!important;\n    width:min(59%,600px)!important;\n    padding:20px 24px!important;\n  }\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n    font-size:clamp(32px,4vw,46px)!important;\n  }\n}\n\n/* ---------- MOBILE ---------- */\n@media(max-width:760px){\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n    left:16px!important;\n    top:50%!important;\n    transform:translateY(-50%)!important;\n    width:calc(100% - 32px)!important;\n    max-width:none!important;\n    padding:16px 17px!important;\n    border-radius:16px!important;\n  }\n\n  body:not(.aurel-dark-theme):has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n    background:linear-gradient(90deg,rgba(248,252,255,.92),rgba(248,252,255,.72),rgba(248,252,255,.26))!important;\n  }\n\n  body.aurel-dark-theme:has(#nav button[data-page=\"overview\"].active) .ref-hero>.ref-hero-live-copy{\n    background:linear-gradient(90deg,rgba(3,16,31,.88),rgba(3,18,34,.70),rgba(3,18,34,.28))!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-kicker{\n    min-height:22px!important;\n    margin-bottom:8px!important;\n    padding:0 9px!important;\n    font-size:8.5px!important;\n    letter-spacing:.10em!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-bank{\n    font-size:27px!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-title{\n    max-width:92%!important;\n    font-size:clamp(33px,10vw,44px)!important;\n    line-height:1!important;\n    letter-spacing:-.03em!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-copy p{\n    max-width:92%!important;\n    margin-top:10px!important;\n    font-size:10.5px!important;\n    line-height:1.4!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges{\n    gap:6px!important;\n    margin-top:10px!important;\n  }\n\n  body:has(#nav button[data-page=\"overview\"].active) .ref-hero-live-badges span{\n    min-height:26px!important;\n    padding:0 9px!important;\n    font-size:8.5px!important;\n  }\n}\n</style>"
          if '</body>' not in s:
              raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Redesign overview hero typography for new banner"
          git push
