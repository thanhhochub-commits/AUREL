name: AUREL inspect hero live text
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hero live markup
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=["ref-hero-live-copy","ref-hero-live-kicker","ref-hero-live-bank","ref-hero-live-title","ref-hero-live-badges"]
          out=[]
          for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),s)]
              out.append(f"### {needle} occurrences={len(poss)}")
              for i in poss[:20]:
                  out.append(s[max(0,i-1600):min(len(s),i+3500)])
          Path("hero_live_text_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add hero_live_text_debug.txt
          git commit -m "Temporary hero text inspection"
          git push
