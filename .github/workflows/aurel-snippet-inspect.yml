name: AUREL remove hero glass permanently
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove every hero text glass background and keep text only
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          # Dọn các lớp thử nghiệm cuối file.
          for ident in [
              "AUREL_R155_HERO_TYPOGRAPHY_REDESIGN",
              "AUREL_R156_HERO_COLOR_ONLY",
              "AUREL_R157_HERO_TEXT_CLARITY",
              "AUREL_R158_HERO_FULL_TRANSPARENT",
              "AUREL_R159_HERO_TEXT_ONLY"
          ]:
              s=re.sub(
                  r'<style id="'+re.escape(ident)+r'">[\s\S]*?</style>\s*',
                  '',
                  s,
                  flags=re.M
              )
              s=re.sub(
                  r'<script id="'+re.escape(ident)+r'_JS">[\s\S]*?</script>\s*',
                  '',
                  s,
                  flags=re.M
              )

          # Sửa tận gốc mọi CSS block lịch sử của ref-hero-copy / ref-hero-live-copy.
          pat=re.compile(
              r'([^{}]*\.(?:ref-hero-live-copy|ref-hero-copy)[^{}]*\{)([^{}]*)(\})',
              re.M
          )
          def clear_block(m):
              head, body, tail = m.group(1), m.group(2), m.group(3)
              body=re.sub(r'(?:background|background-color|background-image)\s*:[^;{}]+;?', '', body, flags=re.I)
              body=re.sub(r'-webkit-backdrop-filter\s*:[^;{}]+;?', '', body, flags=re.I)
              body=re.sub(r'(?<!-webkit-)backdrop-filter\s*:[^;{}]+;?', '', body, flags=re.I)
              body=re.sub(r'box-shadow\s*:[^;{}]+;?', '', body, flags=re.I)
              body=re.sub(r'(?:border|outline)\s*:[^;{}]+;?', '', body, flags=re.I)
              body += '''
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  box-shadow:none!important;
  border:0!important;
  outline:0!important;
  filter:none!important;
'''
              return head+body+tail
          s=pat.sub(clear_block,s)

          css=r'''
          <style id="AUREL_R159_HERO_TEXT_ONLY">
          .ref-hero .ref-hero-copy.ref-hero-live-copy,
          body .ref-hero .ref-hero-copy.ref-hero-live-copy{
            background:transparent!important;
            background-color:transparent!important;
            background-image:none!important;
            border:0!important;
            outline:0!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
            filter:none!important;
          }
          .ref-hero .ref-hero-copy.ref-hero-live-copy::before,
          .ref-hero .ref-hero-copy.ref-hero-live-copy::after{
            content:none!important;
            display:none!important;
            background:none!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
          }
          .ref-hero .ref-hero-live-badges span{
            background:transparent!important;
            background-color:transparent!important;
            background-image:none!important;
            border:0!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
          }

          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker b,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-bank,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-title,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p strong,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-badges span{
            color:#fff!important;
            -webkit-text-fill-color:#fff!important;
          }
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker b{
            text-shadow:0 1px 2px rgba(1,18,34,.98),0 2px 7px rgba(1,18,34,.78)!important;
          }
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-bank,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-title{
            text-shadow:0 2px 3px rgba(1,18,34,.98),0 5px 13px rgba(1,18,34,.78)!important;
          }
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p strong,
          body:not(.aurel-dark-theme) .ref-hero .ref-hero-live-badges span{
            text-shadow:0 1px 2px rgba(1,18,34,.98),0 2px 6px rgba(1,18,34,.76)!important;
          }

          body.aurel-dark-theme .ref-hero .ref-hero-live-kicker,
          body.aurel-dark-theme .ref-hero .ref-hero-live-kicker b{
            color:#8fe7ff!important;
            -webkit-text-fill-color:#8fe7ff!important;
            text-shadow:0 1px 2px rgba(0,0,0,.98),0 0 8px rgba(48,196,240,.22)!important;
          }
          body.aurel-dark-theme .ref-hero .ref-hero-live-bank,
          body.aurel-dark-theme .ref-hero .ref-hero-live-title,
          body.aurel-dark-theme .ref-hero .ref-hero-live-copy p,
          body.aurel-dark-theme .ref-hero .ref-hero-live-copy p strong,
          body.aurel-dark-theme .ref-hero .ref-hero-live-badges span{
            color:#fff!important;
            -webkit-text-fill-color:#fff!important;
            text-shadow:0 2px 4px rgba(0,0,0,.98)!important;
          }
          </style>
          '''

          js=r'''
          <script id="AUREL_R159_HERO_TEXT_ONLY_JS">
          (function(){
            function clearHero(){
              document.querySelectorAll('.ref-hero .ref-hero-copy.ref-hero-live-copy').forEach(function(el){
                el.style.setProperty('background','transparent','important');
                el.style.setProperty('background-color','transparent','important');
                el.style.setProperty('background-image','none','important');
                el.style.setProperty('border','0','important');
                el.style.setProperty('outline','0','important');
                el.style.setProperty('box-shadow','none','important');
                el.style.setProperty('-webkit-backdrop-filter','none','important');
                el.style.setProperty('backdrop-filter','none','important');
                el.style.setProperty('filter','none','important');
              });
              document.querySelectorAll('.ref-hero .ref-hero-live-badges span').forEach(function(el){
                el.style.setProperty('background','transparent','important');
                el.style.setProperty('border','0','important');
                el.style.setProperty('box-shadow','none','important');
                el.style.setProperty('-webkit-backdrop-filter','none','important');
                el.style.setProperty('backdrop-filter','none','important');
              });
            }
            if(document.readyState==='loading'){
              document.addEventListener('DOMContentLoaded',clearHero,{once:true});
            }else{
              clearHero();
            }
            new MutationObserver(function(){
              requestAnimationFrame(clearHero);
            }).observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
          })();
          </script>
          '''

          if "</body>" not in s:
              raise SystemExit("Không tìm thấy </body>.")

          s=s.replace("</body>",css.strip()+"\n"+js.strip()+"\n</body>",1)
          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Remove hero white glass panel permanently"
          git push
