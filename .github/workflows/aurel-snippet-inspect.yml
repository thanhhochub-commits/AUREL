name: AUREL inspect banner rotation
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect banner code
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=[
            "ref-bank-banner","background-image","backgroundImage",
            ".webp",".jpg",".jpeg",".png",
            "hero","banner","month","setInterval","currentMonth"
          ]
          out=[]
          for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              out.append(f"### {needle} occurrences={len(poss)}")
              for idx,i in enumerate(poss[:80],1):
                  out.append(f"--- {idx} @ {i} ---\n"+s[max(0,i-1400):min(len(s),i+3200)])
          Path("banner_rotation_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add banner_rotation_debug.txt
          git commit -m "Temporary banner rotation inspection"
          git push
