name: AUREL inspect slider arrays
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract slider assets and JS
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          assets=sorted(set(re.findall(r'["\'\(]([^"\'\)\s]*aurel_[^"\'\)\s]*\.(?:webp|png|jpg|jpeg))',s,re.I)))
          out=["ASSETS"]+assets+["","SLIDER CONTEXTS"]
          for needle in ["aurel-r78-slider","R78","master clock","setInterval","slides","frames","heroFrames","sidebarFrames"]:
              poss=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              out.append(f"### {needle} occurrences={len(poss)}")
              for i in poss[:25]:
                  out.append(s[max(0,i-1200):min(len(s),i+4200)])
          Path("slider_arrays_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add slider_arrays_debug.txt
          git commit -m "Temporary slider array inspection"
          git push
