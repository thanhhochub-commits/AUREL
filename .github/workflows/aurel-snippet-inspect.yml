name: AUREL inspect AI panel classes
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract AI key panel class contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          out=[]
          for needle in ["ai-key-panel","ai-key-status","ai-key-form","aiKey","ai-key"]:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  out.append("=== "+needle+" @ "+str(i)+" ===\n"+s[max(0,i-2200):min(len(s),i+5200)])
                  start=i+len(needle)
          if not out:
              raise SystemExit("no ai key markers")
          Path("ai_panel_classes.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add ai_panel_classes.txt
          git commit -m "Temporary AI panel class inspection"
          git push
