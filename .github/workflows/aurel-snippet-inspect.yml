name: AUREL thin risk status cards
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make four risk cards thin and clean
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          # Remove the previous heavy runtime coloring so it cannot override the new subtle design.
          for tag, ident in [
              ("style","AUREL_R131_FORCE_STATUS"),
              ("script","AUREL_R131_FORCE_STATUS_JS"),
              ("style","AUREL_R130_EXACT_FIX")
          ]:
              pat=re.compile(r'<'+tag+r' id="'+re.escape(ident)+r'">[\s\S]*?</'+tag+r'>\s*',re.M)
              s=pat.sub("",s)

          css=r'''
          <style id="AUREL_R132_THIN_STATUS">
          /* R132 — 4 ô trạng thái mảnh, sạch, đồng bộ KPI Tổng quan. */
          .monitor-overview .monitor-card{
            position:relative!important;
            overflow:hidden!important;
            border-width:1px!important;
            border-style:solid!important;
            border-radius:12px!important;
            box-shadow:none!important;
            transform:none!important;
          }
          .monitor-overview .monitor-card:before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            right:0!important;
            top:0!important;
            width:100%!important;
            height:3px!important;
            opacity:1!important;
            pointer-events:none!important;
          }

          /* Light mode: nền trắng, chỉ nhấn màu rất nhẹ bằng viền trên */
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card{
            background:#ffffff!important;
            border-color:#c9d8e3!important;
          }
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(1){
            border-color:#e6c9cc!important;
          }
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(2){
            border-color:#ead9b8!important;
          }
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(3){
            border-color:#c7dfcf!important;
          }
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(4){
            border-color:#c8d7e6!important;
          }

          /* Dark mode: cùng nền navy như KPI Tổng quan, không phủ màu cả card */
          body.aurel-dark-theme .monitor-overview .monitor-card{
            background:#111d2a!important;
            border-color:#31485b!important;
          }
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(1){
            border-color:#583942!important;
          }
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(2){
            border-color:#5b4b2d!important;
          }
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(3){
            border-color:#2f5140!important;
          }
          body.aurel-dark-theme .monitor-overview .monitor-card:nth-child(4){
            border-color:#314c67!important;
          }

          /* Thanh màu mảnh đúng nghĩa trạng thái */
          .monitor-overview .monitor-card:nth-child(1):before{
            background:#ef476f!important;
          }
          .monitor-overview .monitor-card:nth-child(2):before{
            background:#e3ad49!important;
          }
          .monitor-overview .monitor-card:nth-child(3):before{
            background:#27b768!important;
          }
          .monitor-overview .monitor-card:nth-child(4):before{
            background:#4d91d9!important;
          }

          /* Chỉ màu con số, không tô nền đậm */
          .monitor-overview .monitor-card:nth-child(1) strong{color:#ef6b82!important}
          .monitor-overview .monitor-card:nth-child(2) strong{color:#dba84e!important}
          .monitor-overview .monitor-card:nth-child(3) strong{color:#43bd75!important}
          .monitor-overview .monitor-card:nth-child(4) strong{color:inherit!important}

          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(1) strong{color:#cf405b!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(2) strong{color:#b07b27!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(3) strong{color:#218c50!important}
          body:not(.aurel-dark-theme) .monitor-overview .monitor-card:nth-child(4) strong{color:#315a79!important}

          .monitor-overview .monitor-card:hover{
            transform:none!important;
            box-shadow:none!important;
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R132_THIN_STATUS">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Make risk status cards thin and subtle"
          git push
