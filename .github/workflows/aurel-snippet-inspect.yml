name: AUREL scenario LED standard thickness
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match scenario-control LED to saved standard
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          css=r'''
          <style id="AUREL_R136_SCENARIO_STANDARD_LED">
          /* R136 — chuẩn LED đã chốt: cùng độ dày với khung "Tổng hợp báo cáo". */
          body:has(#nav button[data-page="scenario"].active) .scenario-control{
            position:relative!important;
            overflow:hidden!important;
            border-top-width:1px!important;
          }

          body:has(#nav button[data-page="scenario"].active) .scenario-control::before{
            content:""!important;
            position:absolute!important;
            left:0!important;
            right:0!important;
            top:0!important;
            width:100%!important;
            height:3px!important;
            max-height:3px!important;
            border-radius:999px 999px 0 0!important;
            z-index:25!important;
            pointer-events:none!important;
            opacity:1!important;
            background:linear-gradient(90deg,#20c7bb,#47b8ff)!important;
          }

          body:not(.aurel-dark-theme):has(#nav button[data-page="scenario"].active) .scenario-control::before{
            box-shadow:0 0 5px rgba(32,199,187,.16)!important;
          }

          body.aurel-dark-theme:has(#nav button[data-page="scenario"].active) .scenario-control::before{
            box-shadow:0 0 6px rgba(47,199,179,.20)!important;
          }
          </style>
          '''

          pat=re.compile(r'<style id="AUREL_R136_SCENARIO_STANDARD_LED">[\s\S]*?</style>\s*',re.M)
          if pat.search(s):
              s=pat.sub(css.strip()+"\n",s,count=1)
          else:
              if "</body>" not in s:
                  raise SystemExit("Không tìm thấy </body>.")
              s=s.replace("</body>",css.strip()+"\n</body>",1)

          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Match scenario control LEDs to standard thickness"
          git push
