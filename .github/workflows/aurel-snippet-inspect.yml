name: AUREL crisp hero text
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make overview hero text crisp on desktop and mobile
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('financial-intelligence.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="AUREL_R161_HERO_TEXT_CRISP">[\\s\\S]*?</style>\\s*','',s,flags=re.M)
          css="<style id=\"AUREL_R161_HERO_TEXT_CRISP\">\n/* R161 — giữ chữ trực tiếp trên ảnh, làm nét rõ ở desktop + mobile. Không nền, không blur. */\n.ref-hero .ref-hero-live-copy,\n.ref-hero .ref-hero-live-copy *{\n  -webkit-font-smoothing:antialiased!important;\n  -moz-osx-font-smoothing:grayscale!important;\n  text-rendering:geometricPrecision!important;\n  font-synthesis:none!important;\n  filter:none!important;\n}\n.ref-hero .ref-hero-live-copy{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:0!important;\n  outline:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n.ref-hero .ref-hero-live-copy::before,\n.ref-hero .ref-hero-live-copy::after{\n  content:none!important;\n  display:none!important;\n}\n.ref-hero .ref-hero-live-kicker,\n.ref-hero .ref-hero-live-bank,\n.ref-hero .ref-hero-live-title,\n.ref-hero .ref-hero-live-copy p,\n.ref-hero .ref-hero-live-copy p strong,\n.ref-hero .ref-hero-live-badges span{\n  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif!important;\n  -webkit-text-stroke:0!important;\n  opacity:1!important;\n}\n\n/* LIGHT MODE: trắng + viền navy sắc, không glow mờ */\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-kicker b{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:900!important;\n  letter-spacing:.10em!important;\n  text-shadow:\n    -1px 0 #123550,\n     1px 0 #123550,\n     0 -1px #123550,\n     0 1px #123550,\n     0 2px 3px rgba(4,22,38,.72)!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-bank,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-title{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:900!important;\n  text-shadow:\n    -1px 0 #08263f,\n     1px 0 #08263f,\n     0 -1px #08263f,\n     0 1px #08263f,\n     1px 2px 0 #08263f,\n     0 3px 5px rgba(2,16,29,.58)!important;\n}\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-copy p strong,\nbody:not(.aurel-dark-theme) .ref-hero .ref-hero-live-badges span{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:800!important;\n  text-shadow:\n    -1px 0 #123550,\n     1px 0 #123550,\n     0 -1px #123550,\n     0 1px #123550,\n     0 1px 2px rgba(2,16,29,.62)!important;\n}\n\n/* DARK MODE: trắng rõ, kicker cyan nhẹ */\nbody.aurel-dark-theme .ref-hero .ref-hero-live-kicker,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-kicker b{\n  color:#9be8ff!important;\n  -webkit-text-fill-color:#9be8ff!important;\n  font-weight:900!important;\n  letter-spacing:.10em!important;\n  text-shadow:\n    -1px 0 #04121e,\n     1px 0 #04121e,\n     0 -1px #04121e,\n     0 1px #04121e,\n     0 2px 3px rgba(0,0,0,.78)!important;\n}\nbody.aurel-dark-theme .ref-hero .ref-hero-live-bank,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-title{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:900!important;\n  text-shadow:\n    -1px 0 #000b14,\n     1px 0 #000b14,\n     0 -1px #000b14,\n     0 1px #000b14,\n     1px 2px 0 #000b14,\n     0 3px 5px rgba(0,0,0,.72)!important;\n}\nbody.aurel-dark-theme .ref-hero .ref-hero-live-copy p,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-copy p strong,\nbody.aurel-dark-theme .ref-hero .ref-hero-live-badges span{\n  color:#ffffff!important;\n  -webkit-text-fill-color:#ffffff!important;\n  font-weight:800!important;\n  text-shadow:\n    -1px 0 #06131f,\n     1px 0 #06131f,\n     0 -1px #06131f,\n     0 1px #06131f,\n     0 1px 2px rgba(0,0,0,.72)!important;\n}\n\n/* Badge: chỉ chữ, không nền/khung */\n.ref-hero .ref-hero-live-badges span{\n  background:transparent!important;\n  background-color:transparent!important;\n  background-image:none!important;\n  border:0!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:none!important;\n  backdrop-filter:none!important;\n}\n\n/* Desktop/tablet: giữ tỷ lệ hiện tại nhưng nét hơn */\n@media(min-width:761px){\n  .ref-hero .ref-hero-live-kicker{font-size:10px!important;line-height:1.15!important;}\n  .ref-hero .ref-hero-live-bank{font-size:clamp(28px,2.6vw,40px)!important;line-height:1!important;}\n  .ref-hero .ref-hero-live-title{font-size:clamp(32px,3.4vw,52px)!important;line-height:1!important;letter-spacing:-1.25px!important;}\n  .ref-hero .ref-hero-live-copy p{font-size:12px!important;line-height:1.4!important;}\n  .ref-hero .ref-hero-live-badges span{font-size:9px!important;line-height:1!important;}\n}\n\n/* Mobile: tránh chữ nhòe/vỡ do scale, vẫn giữ trọn bố cục */\n@media(max-width:760px){\n  .ref-hero .ref-hero-live-copy{\n    background:transparent!important;\n    -webkit-backdrop-filter:none!important;\n    backdrop-filter:none!important;\n  }\n  .ref-hero .ref-hero-live-kicker{\n    font-size:8.5px!important;\n    line-height:1.15!important;\n    letter-spacing:.085em!important;\n  }\n  .ref-hero .ref-hero-live-bank{\n    font-size:26px!important;\n    line-height:1!important;\n  }\n  .ref-hero .ref-hero-live-title{\n    font-size:clamp(30px,9.4vw,42px)!important;\n    line-height:1!important;\n    letter-spacing:-.8px!important;\n    max-width:96%!important;\n  }\n  .ref-hero .ref-hero-live-copy p{\n    font-size:10px!important;\n    line-height:1.35!important;\n    max-width:94%!important;\n  }\n  .ref-hero .ref-hero-live-badges span{\n    font-size:8px!important;\n    line-height:1!important;\n  }\n}\n</style>"
          if '</body>' not in s: raise SystemExit('Không tìm thấy </body>.')
          s=s.replace('</body>',css+'\\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Sharpen overview hero text on desktop and mobile"
          git push
