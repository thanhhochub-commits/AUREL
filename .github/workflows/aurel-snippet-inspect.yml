name: AUREL inspect monitor markup
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact monitor markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          needles=['class="monitor-overview"',"monitor-overview", "monitor-card", "Cảnh báo", "Thiếu dữ liệu"]
          out=[]
          for needle in needles:
              start=0
              n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+s[max(0,i-900):min(len(s),i+2200)])
                  start=i+len(needle)
          Path("monitor_markup_debug.txt").write_text("\n\n".join(out),encoding="utf-8")
          PY
      - name: Commit report
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add monitor_markup_debug.txt
          git commit -m "Temporary monitor markup inspection"
          git push
