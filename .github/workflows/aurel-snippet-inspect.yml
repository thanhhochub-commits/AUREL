name: AUREL inspect support structure markers
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect support markers
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          cutoff=s.find('<style id="AUREL_R145_DARK_TEXT_CONTRAST">')
          base=s[:cutoff] if cutoff>0 else s
          needles=["ai-key-panel","ai-key-top","data-page=\"support\"","data-page='support'","support-page","page-support","ai-task","ai-result","ai-analysis","cols-equal"]
          out=[]
          for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),base)]
              out.append(f"### {needle} occurrences={len(poss)}")
              for idx,i in enumerate(poss[:20],1):
                  out.append(f"--- {idx} @ {i} ---\n"+base[max(0,i-1000):min(len(base),i+1800)])
          Path("support_markers.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add support_markers.txt
          git commit -m "Temporary support structure marker inspection"
          git push
