name: AUREL inspect real support template
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pre-patch support template
        shell: python
        run: |
          from pathlib import Path
          s=Path("financial-intelligence.html").read_text(encoding="utf-8")
          # Ignore our appended patches near end.
          cutoff=s.find('<style id="AUREL_R145_DARK_TEXT_CONTRAST">')
          base=s[:cutoff] if cutoff>0 else s
          needles=["Kết quả phân tích","Tóm tắt điều hành","Chờ duyệt","Câu hỏi tiếp theo","Tạo nội dung phân tích","result"]
          out=[]
          for needle in needles:
              start=0;n=0
              while True:
                  i=base.find(needle,start)
                  if i<0: break
                  n+=1
                  out.append(f"=== {needle} #{n} @ {i} ===\n"+base[max(0,i-5000):min(len(base),i+10000)])
                  start=i+len(needle)
                  if n>=15: break
          Path("support_template_real.txt").write_text("\n\n".join(out),encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add support_template_real.txt
          git commit -m "Temporary real support template inspection"
          git push
