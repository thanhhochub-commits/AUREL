name: AUREL force visible full-border analysis LEDs
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force visible full-border LEDs on ROA ROE CIR
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          # Remove prior full-border attempts so they cannot conflict.
          for ident in ["AUREL_R139_FULL_BORDER_LED_METRICS","AUREL_R140_ANALYSIS_FULL_BORDER","AUREL_R141_ANALYSIS_FULL_BORDER_FORCE"]:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">[\s\S]*?</style>\s*',"",s,flags=re.M)
          s=re.sub(r'<script id="AUREL_R139_FULL_BORDER_LED_METRICS_JS">[\s\S]*?</script>\s*',"",s,flags=re.M)

          css=r'''
          <style id="AUREL_R141_ANALYSIS_FULL_BORDER_FORCE">
          /* R141 — full LED border, exact .analysis-feature cards, no mask tricks. */
          body:has(#nav button[data-page="analysis"].active) .analysis-feature{
            position:relative!important;
            overflow:visible!important;
            border:2px solid transparent!important;
            border-radius:16px!important;
          }

          /* Keep the existing card fill, add a second background layer only for the border. */
          body.aurel-dark-theme:has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(1){
            background:
              linear-gradient(145deg,rgba(20,184,166,.105),#101b28 44%,#0d1722 100%) padding-box,
              linear-gradient(135deg,#2dd4bf,#22c7b8,#60a5fa) border-box!important;
            box-shadow:0 0 10px rgba(45,212,191,.16),0 10px 26px rgba(0,0,0,.20)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(2){
            background:
              linear-gradient(145deg,rgba(59,130,246,.12),#101b28 44%,#0d1722 100%) padding-box,
              linear-gradient(135deg,#4d9cff,#60a5fa,#2dd4bf) border-box!important;
            box-shadow:0 0 10px rgba(77,156,255,.16),0 10px 26px rgba(0,0,0,.20)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(3){
            background:
              linear-gradient(145deg,rgba(56,189,248,.09),#101b28 44%,#0d1722 100%) padding-box,
              linear-gradient(135deg,#38bdf8,#22c7b8,#60a5fa) border-box!important;
            box-shadow:0 0 10px rgba(56,189,248,.15),0 10px 26px rgba(0,0,0,.20)!important;
          }

          body:not(.aurel-dark-theme):has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(1){
            background:
              linear-gradient(#ffffff,#fbfdfd) padding-box,
              linear-gradient(135deg,#2bbcab,#55a8ff,#2bbcab) border-box!important;
            box-shadow:0 0 8px rgba(43,188,171,.11),0 9px 24px rgba(17,48,70,.035)!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(2){
            background:
              linear-gradient(#ffffff,#fbfdfd) padding-box,
              linear-gradient(135deg,#4b91e8,#63adff,#2bbcab) border-box!important;
            box-shadow:0 0 8px rgba(75,145,232,.11),0 9px 24px rgba(17,48,70,.035)!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="analysis"].active) .analysis-feature:nth-child(3){
            background:
              linear-gradient(#ffffff,#fbfdfd) padding-box,
              linear-gradient(135deg,#46b7d8,#2bbcab,#63adff) border-box!important;
            box-shadow:0 0 8px rgba(70,183,216,.10),0 9px 24px rgba(17,48,70,.035)!important;
          }

          /* Remove the old top-only strip on these 3 cards so the full border is obvious. */
          body:has(#nav button[data-page="analysis"].active) .analysis-feature::before{
            display:none!important;
            content:none!important;
          }
          </style>
          '''

          if "</body>" not in s:
              raise SystemExit("Không tìm thấy </body>.")
          s=s.replace("</body>",css.strip()+"\n</body>",1)
          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Force visible full LED borders on ROA ROE CIR"
          git push
