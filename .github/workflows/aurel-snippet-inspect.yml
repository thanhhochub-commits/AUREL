name: AUREL restore classic hero text exactly
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove conflicting hero text patches and restore classic style
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("financial-intelligence.html")
          s = p.read_text(encoding="utf-8")

          # XÓA THẬT các patch chữ hero cũ đang chồng chéo nhau.
          # Lưu ý: regex này dùng [\s\S] đúng nghĩa trong Python.
          for ident in [
              "AUREL_R154_HERO_TEXT_CONTRAST",
              "AUREL_R155_HERO_TYPOGRAPHY_REDESIGN",
              "AUREL_R156_HERO_COLOR_ONLY",
              "AUREL_R157_HERO_TEXT_CLARITY",
              "AUREL_R158_HERO_FULL_TRANSPARENT",
              "AUREL_R159_HERO_TEXT_ONLY",
              "AUREL_R160_HERO_TEXT_ONLY_FINAL",
              "AUREL_R161_HERO_TEXT_CRISP",
              "AUREL_R162_CLASSIC_HERO_TEXT"
          ]:
              s = re.sub(
                  r'<style id="' + re.escape(ident) + r'">[\s\S]*?</style>\s*',
                  '',
                  s,
                  flags=re.M
              )
              s = re.sub(
                  r'<script id="' + re.escape(ident) + r'_JS">[\s\S]*?</script>\s*',
                  '',
                  s,
                  flags=re.M
              )

          css = r'''
          <style id="AUREL_R162_CLASSIC_HERO_TEXT">
          /* Khôi phục đúng kiểu chữ cổ điển như ảnh tham chiếu:
             chỉ chữ trên ảnh, không kính mờ, không pill ở dòng AUREL, không text-stroke gây nhoè. */

          body:has(#nav button[data-page="overview"].active) .ref-hero > .ref-hero-live-copy{
            display:flex!important;
            position:relative!important;
            z-index:6!important;
            flex-direction:column!important;
            justify-content:center!important;
            align-items:flex-start!important;
            width:58%!important;
            height:100%!important;
            padding:25px 34px!important;
            background:transparent!important;
            background-color:transparent!important;
            background-image:none!important;
            border:0!important;
            outline:0!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
            filter:none!important;
            pointer-events:none!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy::before,
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy::after{
            content:none!important;
            display:none!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy,
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy *{
            font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;
            -webkit-font-smoothing:antialiased!important;
            -moz-osx-font-smoothing:grayscale!important;
            text-rendering:optimizeLegibility!important;
            -webkit-text-stroke:0!important;
          }

          /* Dòng AUREL nhỏ: CHỈ chữ, tuyệt đối không có pill */
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-kicker{
            display:block!important;
            width:auto!important;
            min-width:0!important;
            min-height:0!important;
            margin:0 0 8px!important;
            padding:0!important;
            background:transparent!important;
            background-color:transparent!important;
            background-image:none!important;
            border:0!important;
            border-radius:0!important;
            outline:0!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-size:10px!important;
            line-height:1.15!important;
            font-weight:900!important;
            letter-spacing:1.55px!important;
            text-transform:uppercase!important;
            white-space:nowrap!important;
          }
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-kicker b{
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            background:transparent!important;
            border:0!important;
            box-shadow:none!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy h1{
            display:flex!important;
            flex-direction:column!important;
            gap:2px!important;
            margin:0!important;
            max-width:100%!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-bank{
            display:block!important;
            margin:0!important;
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-size:clamp(28px,2.6vw,40px)!important;
            line-height:1!important;
            font-weight:900!important;
            letter-spacing:.2px!important;
            white-space:nowrap!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-title{
            display:block!important;
            margin:0!important;
            max-width:100%!important;
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-size:clamp(31px,3.4vw,52px)!important;
            line-height:.98!important;
            font-weight:900!important;
            letter-spacing:-1.5px!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy p{
            display:block!important;
            max-width:600px!important;
            margin:11px 0 0!important;
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-size:12px!important;
            line-height:1.4!important;
            font-weight:700!important;
          }
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy p strong{
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-weight:900!important;
          }

          body:has(#nav button[data-page="overview"].active) .ref-hero-live-badges{
            display:flex!important;
            flex-wrap:wrap!important;
            gap:7px!important;
            margin-top:13px!important;
          }
          body:has(#nav button[data-page="overview"].active) .ref-hero-live-badges span{
            display:inline-flex!important;
            align-items:center!important;
            min-height:27px!important;
            padding:0 10px!important;
            border:1px solid rgba(255,255,255,.42)!important;
            border-radius:999px!important;
            background:rgba(4,24,42,.16)!important;
            box-shadow:none!important;
            -webkit-backdrop-filter:none!important;
            backdrop-filter:none!important;
            color:#ffffff!important;
            -webkit-text-fill-color:#ffffff!important;
            font-size:9px!important;
            line-height:1!important;
            font-weight:800!important;
            white-space:nowrap!important;
          }

          /* LIGHT: bóng navy gọn, không glow mờ */
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-kicker{
            text-shadow:0 1px 2px rgba(4,23,40,.96),0 2px 5px rgba(4,23,40,.66)!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-bank,
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-title{
            text-shadow:0 2px 2px rgba(3,18,32,.98),0 4px 7px rgba(3,18,32,.64)!important;
          }
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-copy p,
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-copy p strong,
          body:not(.aurel-dark-theme):has(#nav button[data-page="overview"].active) .ref-hero-live-badges span{
            text-shadow:0 1px 2px rgba(3,18,32,.96),0 2px 4px rgba(3,18,32,.56)!important;
          }

          /* DARK: vẫn đúng layout cũ, tăng tương phản vừa đủ */
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-kicker{
            color:#dff7ff!important;
            -webkit-text-fill-color:#dff7ff!important;
            text-shadow:0 1px 2px rgba(0,0,0,.98),0 2px 4px rgba(0,0,0,.72)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-bank,
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-title{
            text-shadow:0 2px 2px rgba(0,0,0,.98),0 4px 7px rgba(0,0,0,.72)!important;
          }
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-copy p,
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-copy p strong,
          body.aurel-dark-theme:has(#nav button[data-page="overview"].active) .ref-hero-live-badges span{
            text-shadow:0 1px 2px rgba(0,0,0,.98),0 2px 4px rgba(0,0,0,.64)!important;
          }

          @media(max-width:1100px) and (min-width:761px){
            body:has(#nav button[data-page="overview"].active) .ref-hero > .ref-hero-live-copy{
              width:66%!important;
              padding:22px 28px!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-title{
              font-size:clamp(28px,4vw,42px)!important;
            }
          }

          @media(max-width:760px){
            body:has(#nav button[data-page="overview"].active) .ref-hero > .ref-hero-live-copy{
              width:84%!important;
              height:100%!important;
              padding:20px!important;
              background:transparent!important;
              -webkit-backdrop-filter:none!important;
              backdrop-filter:none!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-kicker{
              font-size:8.5px!important;
              letter-spacing:1.05px!important;
              margin-bottom:7px!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-bank{
              font-size:24px!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-title{
              font-size:32px!important;
              letter-spacing:-.8px!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-copy p{
              font-size:10.5px!important;
              line-height:1.35!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-badges{
              margin-top:10px!important;
              gap:6px!important;
            }
            body:has(#nav button[data-page="overview"].active) .ref-hero-live-badges span{
              min-height:25px!important;
              padding:0 8px!important;
              font-size:8px!important;
            }
          }
          </style>
          '''

          if "</body>" not in s:
              raise SystemExit("Không tìm thấy </body>.")

          s = s.replace("</body>", css.strip() + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Restore classic transparent overview hero text"
          git push
