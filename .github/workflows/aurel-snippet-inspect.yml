name: AUREL force visible full-border LEDs
on:
  push:
    branches: [main]
    paths: [".github/workflows/aurel-snippet-inspect.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force visible full-border LEDs on ROA ROE CIR
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("financial-intelligence.html")
          s=p.read_text(encoding="utf-8")

          for tag, ident in [
              ("style","AUREL_R139_FULL_BORDER_LED_METRICS"),
              ("script","AUREL_R139_FULL_BORDER_LED_METRICS_JS"),
              ("style","AUREL_R140_ANALYSIS_FULL_BORDER"),
              ("style","AUREL_R141_ANALYSIS_BORDER_FORCE")
          ]:
              pat=re.compile(r'<'+tag+r' id="'+re.escape(ident)+r'">[\s\S]*?</'+tag+r'>\s*',re.M)
              s=pat.sub("",s)

          css=r'''
          <style id="AUREL_R141_ANALYSIS_BORDER_FORCE">
          /* R141 — dùng trực tiếp class thật .analysis-feature, không phụ thuộc page-id. */
          .analysis-feature-grid .analysis-feature{
            position:relative!important;
            overflow:hidden!important;
            border:2px solid transparent!important;
            border-radius:16px!important;
            transition:border-color .18s ease,box-shadow .18s ease!important;
          }

          /* Dark mode */
          body.aurel-dark-theme .analysis-feature-grid .analysis-feature:nth-child(1){
            background:
              linear-gradient(#111d2a,#111d2a) padding-box,
              linear-gradient(135deg,#2dd4bf,#22c7b8,#60a5fa) border-box!important;
            box-shadow:0 0 10px rgba(45,212,191,.16),0 8px 22px rgba(0,0,0,.16)!important;
          }
          body.aurel-dark-theme .analysis-feature-grid .analysis-feature:nth-child(2){
            background:
              linear-gradient(#111d2a,#111d2a) padding-box,
              linear-gradient(135deg,#3b82f6,#60a5fa,#22c7b8) border-box!important;
            box-shadow:0 0 10px rgba(59,130,246,.16),0 8px 22px rgba(0,0,0,.16)!important;
          }
          body.aurel-dark-theme .analysis-feature-grid .analysis-feature:nth-child(3){
            background:
              linear-gradient(#111d2a,#111d2a) padding-box,
              linear-gradient(135deg,#38bdf8,#22c7b8,#60a5fa) border-box!important;
            box-shadow:0 0 10px rgba(56,189,248,.15),0 8px 22px rgba(0,0,0,.16)!important;
          }

          /* Light mode */
          body:not(.aurel-dark-theme) .analysis-feature-grid .analysis-feature:nth-child(1){
            background:
              linear-gradient(#ffffff,#f9fbfd) padding-box,
              linear-gradient(135deg,#2bbdab,#60a5fa) border-box!important;
            box-shadow:0 0 8px rgba(43,189,171,.10),0 7px 18px rgba(25,63,91,.05)!important;
          }
          body:not(.aurel-dark-theme) .analysis-feature-grid .analysis-feature:nth-child(2){
            background:
              linear-gradient(#ffffff,#f9fbfd) padding-box,
              linear-gradient(135deg,#3b82f6,#22b8ae) border-box!important;
            box-shadow:0 0 8px rgba(59,130,246,.10),0 7px 18px rgba(25,63,91,.05)!important;
          }
          body:not(.aurel-dark-theme) .analysis-feature-grid .analysis-feature:nth-child(3){
            background:
              linear-gradient(#ffffff,#f9fbfd) padding-box,
              linear-gradient(135deg,#38bdf8,#60a5fa) border-box!important;
            box-shadow:0 0 8px rgba(56,189,248,.09),0 7px 18px rgba(25,63,91,.05)!important;
          }

          /* Tắt dải top cũ để viền full khung nhìn rõ, không bị chồng. */
          .analysis-feature-grid .analysis-feature::before,
          .analysis-feature-grid .analysis-feature::after{
            display:none!important;
          }
          </style>
          '''

          if "</body>" not in s:
              raise SystemExit("Không tìm thấy </body>.")

          s=s.replace("</body>",css.strip()+"\n</body>",1)
          p.write_text(s,encoding="utf-8")

      - name: Commit
        run: |
          if git diff --quiet -- financial-intelligence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "AUREL UI Bot"
          git config user.email "actions@github.com"
          git add financial-intelligence.html
          git commit -m "Force visible full border LEDs on analysis cards"
          git push
