services:
  - type: web
    name: aurel-thanhhochub-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: AUREL_ALLOWED_ORIGINS
        value: https://thanhhochub-commits.github.io
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://aurel-thanhhochub-backend.onrender.com/api/gmail/callback
