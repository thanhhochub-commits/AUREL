services:
  - type: web
    name: aurel-thanhhochub-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: AUREL_ALLOWED_ORIGINS
        value: https://thanhhochub-commits.github.io
      - key: AUREL_BREVO_API_KEY
        sync: false
      - key: AUREL_BREVO_SENDER
        sync: false
